<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>MizaxEngine Animator - R6 Rig Editor</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1a1a1a;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:#e0e0e0;
}

#viewports{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#ui-container{
    position:absolute;
    top:10px;
    left:10px;
    width:320px;
    max-width:calc(100vw - 20px);
    background:rgba(30,30,30,.88);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    padding:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
    z-index:100;
}

h2{
    margin:0 0 15px;
    font-size:16px;
    color:#4CAF50;
    border-bottom:1px solid rgba(255,255,255,.1);
    padding-bottom:8px;
}

.section{
    margin-bottom:15px;
}

label{
    font-size:12px;
    display:block;
    margin-bottom:5px;
    color:#aaa;
}

button{
    background:#333;
    color:#fff;
    border:1px solid #555;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
    margin-right:5px;
    margin-bottom:5px;
}

button:hover{
    background:#444;
    border-color:#777;
}

button.active{
    background:#2e7d32;
    border-color:#4CAF50;
}

#hierarchy-tree{
    max-height:200px;
    overflow-y:auto;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.05);
    border-radius:4px;
    padding:5px;
}

.tree-item{
    padding:4px 8px;
    cursor:pointer;
    border-radius:3px;
    font-size:12px;
    display:flex;
    align-items:center;
}

.tree-item:hover{
    background:rgba(255,255,255,.1);
}

.tree-item.selected{
    background:#2e7d32;
    color:white;
}

.info-panel{
    font-size:11px;
    background:rgba(0,0,0,.2);
    padding:8px;
    border-radius:4px;
    font-family:monospace;
    line-height:1.5;
}

@media(max-width:600px){

    #ui-container{
        width:260px;
        padding:10px;
    }

    button{
        padding:6px 8px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<div id="ui-container">

    <h2>MizaxEngine Animator</h2>

    <div class="section">

        <label>Transform Tools</label>

        <button id="btn-translate" class="active">
            Move (G)
        </button>

        <button id="btn-rotate">
            Rotate (R)
        </button>

        <button id="btn-scale">
            Scale (S)
        </button>

        <button id="btn-reset">
            Reset Transform
        </button>

    </div>

    <div class="section">

        <label>Hierarchy / Parts</label>

        <div id="hierarchy-tree"></div>

    </div>

    <div class="section">

        <label>Selected Part Data (Local Transform)</label>

        <div id="transform-info" class="info-panel">
            Select a part...
        </div>

    </div>

</div>

<div id="viewports"></div>


<!-- THREE.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let orbitControls;
let transformControls;

let r6Rig = {};
let selectedPart = null;

const treeContainer =
    document.getElementById("hierarchy-tree");

const transformInfo =
    document.getElementById("transform-info");


/* =========================================================
   INIT
========================================================= */

function init(){

    /* =========================
       SCENE
    ========================= */

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x1a1a1a);


    /* =========================
       CAMERA
    ========================= */

    camera =
        new THREE.PerspectiveCamera(
            50,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );

    camera.position.set(
        7,
        5,
        9
    );


    /* =========================
       RENDERER
    ========================= */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            alpha:false
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    document
        .getElementById("viewports")
        .appendChild(
            renderer.domElement
        );


    /* =========================
       CAMERA CONTROLS
    ========================= */

    orbitControls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    orbitControls.enableDamping = true;

    orbitControls.dampingFactor =
        0.06;

    orbitControls.target.set(
        0,
        1.5,
        0
    );

    orbitControls.minDistance = 3;

    orbitControls.maxDistance = 20;

    orbitControls.enableRotate = true;

    orbitControls.enableZoom = true;

    orbitControls.enablePan = true;

    orbitControls.update();


    /* =========================
       TRANSFORM CONTROLS
    ========================= */

    transformControls =
        new THREE.TransformControls(
            camera,
            renderer.domElement
        );

    transformControls.size =
        0.75;

    scene.add(
        transformControls
    );


    transformControls.addEventListener(
        "dragging-changed",
        function(event){

            orbitControls.enabled =
                !event.value;

        }
    );


    transformControls.addEventListener(
        "change",
        function(){

            if(selectedPart){
                updateTransformInfo();
            }

        }
    );


    /* =========================
       LIGHT
    ========================= */

    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            0.72
        );

    scene.add(
        ambientLight
    );


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            0.85
        );

    directionalLight.position.set(
        5,
        10,
        7
    );

    directionalLight.castShadow =
        true;

    scene.add(
        directionalLight
    );


    /* =========================
       BASEPLATE
    ========================= */

    const gridHelper =
        new THREE.GridHelper(
            20,
            20,
            0x444444,
            0x222222
        );

    /*
       Kaki bawah tepat di Y = -2.
       Jadi baseplate juga Y = -2.
       Tidak ada kaki yang menembus
       atau melewati baseplate.
    */

    gridHelper.position.y = -2;

    scene.add(
        gridHelper
    );


    /* =========================
       BUILD RIG
    ========================= */

    buildR6Rig();


    /* =========================
       UI
    ========================= */

    setupUI();


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
        "resize",
        onWindowResize
    );


    animate();
}


/* =========================================================
   ROUNDED BOX GEOMETRY
========================================================= */

function roundedBox(
    width,
    height,
    depth,
    radius
){

    const shape =
        new THREE.Shape();

    const x =
        -width / 2;

    const y =
        -height / 2;

    const w =
        width;

    const h =
        height;

    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );


    shape.moveTo(
        x + r,
        y
    );

    shape.lineTo(
        x + w - r,
        y
    );

    shape.quadraticCurveTo(
        x + w,
        y,
        x + w,
        y + r
    );

    shape.lineTo(
        x + w,
        y + h - r
    );

    shape.quadraticCurveTo(
        x + w,
        y + h,
        x + w - r,
        y + h
    );

    shape.lineTo(
        x + r,
        y + h
    );

    shape.quadraticCurveTo(
        x,
        y + h,
        x,
        y + h - r
    );

    shape.lineTo(
        x,
        y + r
    );

    shape.quadraticCurveTo(
        x,
        y,
        x + r,
        y
    );


    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth:depth,
                bevelEnabled:true,
                bevelSegments:2,
                bevelSize:radius * 0.35,
                bevelThickness:radius * 0.35,
                curveSegments:4
            }
        );


    geometry.center();

    return geometry;
}


/* =========================================================
   FACE TEXTURE
========================================================= */

function createFaceTexture(){

    /*
       Canvas transparan.
       TIDAK ADA background putih.

       Jadi yang terlihat hanya:
       >v<
    */

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;

    canvas.height = 512;

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        512,
        512
    );


    ctx.fillStyle =
        "#111111";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "bold 150px Arial";


    /*
       Wajah dibuat sedikit
       lebih rendah dari tengah.
    */

    ctx.fillText(
        ">v<",
        256,
        330
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.encoding =
        THREE.sRGBEncoding;

    texture.needsUpdate =
        true;

    return texture;
}


/* =========================================================
   BUILD R6
========================================================= */

function buildR6Rig(){

    /* =========================
       ROOT
    ========================= */

    const rigRoot =
        new THREE.Group();

    rigRoot.name =
        "r6Rig";

    scene.add(
        rigRoot
    );


    /* =========================
       MATERIAL
    ========================= */

    const faceTexture =
        createFaceTexture();


    const headMaterial =
        new THREE.MeshPhongMaterial({

            color:0xffffff,

            shininess:25

        });


    const bodyMaterial =
        new THREE.MeshPhongMaterial({

            color:0xcccccc,

            shininess:20

        });


    const torsoMaterial =
        new THREE.MeshPhongMaterial({

            color:0x00a2ff,

            shininess:20

        });


    const legMaterial =
        new THREE.MeshPhongMaterial({

            color:0xcd2027,

            shininess:20

        });


    const faceMaterial =
        new THREE.MeshBasicMaterial({

            map:faceTexture,

            transparent:true,

            alphaTest:0.01,

            depthWrite:false,

            side:THREE.DoubleSide

        });


    /* =========================
       GEOMETRY
    ========================= */

    /*
       Body rounded.
    */

    const torsoGeo =
        roundedBox(
            2,
            2,
            1,
            0.16
        );


    const armGeo =
        roundedBox(
            1,
            2,
            1,
            0.16
        );


    const legGeo =
        roundedBox(
            1,
            2,
            1,
            0.16
        );


    /*
       HEAD BENAR-BENAR KOTAK TAJAM.
       Tidak rounded.
    */

    const headGeo =
        new THREE.BoxGeometry(
            1.2,
            1.2,
            1.2
        );


    /* =====================================================
       TORSO
    ===================================================== */

    const torsoMesh =
        new THREE.Mesh(
            torsoGeo,
            torsoMaterial
        );

    torsoMesh.name =
        "Torso";

    torsoMesh.castShadow =
        true;

    torsoMesh.receiveShadow =
        true;

    rigRoot.add(
        torsoMesh
    );

    r6Rig["Torso"] =
        torsoMesh;


    /* =====================================================
       HEAD PIVOT
    ===================================================== */

    const headPivot =
        new THREE.Group();

    headPivot.name =
        "HeadPivot";

    headPivot.position.set(
        0,
        1,
        0
    );

    torsoMesh.add(
        headPivot
    );


    /* =====================================================
       HEAD
    ===================================================== */

    const headMesh =
        new THREE.Mesh(
            headGeo,
            headMaterial
        );

    headMesh.name =
        "Head";

    /*
       Head tetap tepat di atas torso.
    */

    headMesh.position.set(
        0,
        0.6,
        0
    );

    headMesh.castShadow =
        true;

    headMesh.receiveShadow =
        true;

    headPivot.add(
        headMesh
    );

    r6Rig["Head"] =
        headMesh;

    r6Rig["HeadPivot"] =
        headPivot;


    /* =====================================================
       FACE
    ===================================================== */

    const facePlane =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                0.82,
                0.48
            ),
            faceMaterial
        );

    /*
       Z positif = bagian depan kepala.

       Y = 0.20
       membuat wajah turun ke bawah,
       bukan naik ke atas.
    */

    facePlane.position.set(
        0,
        0.20,
        0.606
    );

    facePlane.name =
        "Face";

    headMesh.add(
        facePlane
    );


    /* =====================================================
       LEFT ARM
    ===================================================== */

    const leftArmPivot =
        new THREE.Group();

    leftArmPivot.name =
        "LeftArmPivot";

    leftArmPivot.position.set(
        -1.5,
        1,
        0
    );

    torsoMesh.add(
        leftArmPivot
    );


    const leftArmMesh =
        new THREE.Mesh(
            armGeo,
            bodyMaterial
        );

    leftArmMesh.name =
        "Left Arm";

    leftArmMesh.position.set(
        0,
        -1,
        0
    );

    leftArmMesh.castShadow =
        true;

    leftArmMesh.receiveShadow =
        true;

    leftArmPivot.add(
        leftArmMesh
    );

    r6Rig["Left Arm"] =
        leftArmMesh;

    r6Rig["LeftArmPivot"] =
        leftArmPivot;


    /* =====================================================
       RIGHT ARM
    ===================================================== */

    const rightArmPivot =
        new THREE.Group();

    rightArmPivot.name =
        "RightArmPivot";

    rightArmPivot.position.set(
        1.5,
        1,
        0
    );

    torsoMesh.add(
        rightArmPivot
    );


    const rightArmMesh =
        new THREE.Mesh(
            armGeo,
            bodyMaterial
        );

    rightArmMesh.name =
        "Right Arm";

    rightArmMesh.position.set(
        0,
        -1,
        0
    );

    rightArmMesh.castShadow =
        true;

    rightArmMesh.receiveShadow =
        true;

    rightArmPivot.add(
        rightArmMesh
    );

    r6Rig["Right Arm"] =
        rightArmMesh;

    r6Rig["RightArmPivot"] =
        rightArmPivot;


    /* =====================================================
       LEFT LEG
    ===================================================== */

    const leftLegPivot =
        new THREE.Group();

    leftLegPivot.name =
        "LeftLegPivot";

    leftLegPivot.position.set(
        -0.5,
        -1,
        0
    );

    torsoMesh.add(
        leftLegPivot
    );


    const leftLegMesh =
        new THREE.Mesh(
            legGeo,
            legMaterial
        );

    leftLegMesh.name =
        "Left Leg";

    leftLegMesh.position.set(
        0,
        -1,
        0
    );

    leftLegMesh.castShadow =
        true;

    leftLegMesh.receiveShadow =
        true;

    leftLegPivot.add(
        leftLegMesh
    );

    r6Rig["Left Leg"] =
        leftLegMesh;

    r6Rig["LeftLegPivot"] =
        leftLegPivot;


    /* =====================================================
       RIGHT LEG
    ===================================================== */

    const rightLegPivot =
        new THREE.Group();

    rightLegPivot.name =
        "RightLegPivot";

    rightLegPivot.position.set(
        0.5,
        -1,
        0
    );

    torsoMesh.add(
        rightLegPivot
    );


    const rightLegMesh =
        new THREE.Mesh(
            legGeo,
            legMaterial
        );

    rightLegMesh.name =
        "Right Leg";

    rightLegMesh.position.set(
        0,
        -1,
        0
    );

    rightLegMesh.castShadow =
        true;

    rightLegMesh.receiveShadow =
        true;

    rightLegPivot.add(
        rightLegMesh
    );

    r6Rig["Right Leg"] =
        rightLegMesh;

    r6Rig["RightLegPivot"] =
        rightLegPivot;


    /* =========================
       HIERARCHY
    ========================= */

    populateHierarchyTree();


    /* =========================
       DEFAULT
    ========================= */

    selectPart(
        torsoMesh
    );
}


/* =========================================================
   SELECT PART
========================================================= */

function selectPart(part){

    selectedPart =
        part;

    let targetTransform =
        part;


    if(part.name === "Head")
        targetTransform =
            r6Rig["HeadPivot"];

    else if(part.name === "Left Arm")
        targetTransform =
            r6Rig["LeftArmPivot"];

    else if(part.name === "Right Arm")
        targetTransform =
            r6Rig["RightArmPivot"];

    else if(part.name === "Left Leg")
        targetTransform =
            r6Rig["LeftLegPivot"];

    else if(part.name === "Right Leg")
        targetTransform =
            r6Rig["RightLegPivot"];


    transformControls.attach(
        targetTransform
    );


    document
        .querySelectorAll(
            ".tree-item"
        )
        .forEach(
            function(el){

                el.classList.remove(
                    "selected"
                );

                if(
                    el.dataset.name ===
                    part.name
                ){

                    el.classList.add(
                        "selected"
                    );

                }

            }
        );


    updateTransformInfo();
}


/* =========================================================
   HIERARCHY
========================================================= */

function populateHierarchyTree(){

    const parts = [

        "Torso",
        "Head",
        "Left Arm",
        "Right Arm",
        "Left Leg",
        "Right Leg"

    ];


    treeContainer.innerHTML = "";


    parts.forEach(
        function(name){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "tree-item";

            item.innerText =
                name;

            item.dataset.name =
                name;

            item.onclick =
                function(){

                    selectPart(
                        r6Rig[name]
                    );

                };


            treeContainer.appendChild(
                item
            );

        }
    );
}


/* =========================================================
   TRANSFORM INFO
========================================================= */

function updateTransformInfo(){

    if(!selectedPart)
        return;


    let target =
        selectedPart;


    if(selectedPart.name === "Head")
        target =
            r6Rig["HeadPivot"];

    else if(
        selectedPart.name === "Left Arm"
    )
        target =
            r6Rig["LeftArmPivot"];

    else if(
        selectedPart.name === "Right Arm"
    )
        target =
            r6Rig["RightArmPivot"];

    else if(
        selectedPart.name === "Left Leg"
    )
        target =
            r6Rig["LeftLegPivot"];

    else if(
        selectedPart.name === "Right Leg"
    )
        target =
            r6Rig["RightLegPivot"];


    const p =
        target.position;

    const r =
        target.rotation;

    const s =
        target.scale;


    transformInfo.innerHTML = `

        <b>Part:</b>
        ${selectedPart.name}
        <br>

        <b>Pos:</b>
        X:${p.x.toFixed(2)}
        Y:${p.y.toFixed(2)}
        Z:${p.z.toFixed(2)}

        <br>

        <b>Rot:</b>
        X:${THREE.MathUtils.radToDeg(r.x).toFixed(1)}°
        Y:${THREE.MathUtils.radToDeg(r.y).toFixed(1)}°
        Z:${THREE.MathUtils.radToDeg(r.z).toFixed(1)}°

        <br>

        <b>Scale:</b>
        X:${s.x.toFixed(2)}
        Y:${s.y.toFixed(2)}
        Z:${s.z.toFixed(2)}

    `;
}


/* =========================================================
   UI
========================================================= */

function setupUI(){

    document
        .getElementById(
            "btn-translate"
        )
        .onclick =
        function(e){

            transformControls.setMode(
                "translate"
            );

            setActiveTool(
                e.target
            );

        };


    document
        .getElementById(
            "btn-rotate"
        )
        .onclick =
        function(e){

            transformControls.setMode(
                "rotate"
            );

            setActiveTool(
                e.target
            );

        };


    document
        .getElementById(
            "btn-scale"
        )
        .onclick =
        function(e){

            transformControls.setMode(
                "scale"
            );

            setActiveTool(
                e.target
            );

        };


    document
        .getElementById(
            "btn-reset"
        )
        .onclick =
        function(){

            if(!selectedPart)
                return;


            let target =
                selectedPart;


            if(
                selectedPart.name ===
                "Head"
            )
                target =
                    r6Rig["HeadPivot"];

            else if(
                selectedPart.name ===
                "Left Arm"
            )
                target =
                    r6Rig["LeftArmPivot"];

            else if(
                selectedPart.name ===
                "Right Arm"
            )
                target =
                    r6Rig["RightArmPivot"];

            else if(
                selectedPart.name ===
                "Left Leg"
            )
                target =
                    r6Rig["LeftLegPivot"];

            else if(
                selectedPart.name ===
                "Right Leg"
            )
                target =
                    r6Rig["RightLegPivot"];


            target.rotation.set(
                0,
                0,
                0
            );

            target.scale.set(
                1,
                1,
                1
            );


            if(
                target ===
                r6Rig["Torso"]
            ){

                target.position.set(
                    0,
                    0,
                    0
                );

            }


            updateTransformInfo();

        };
}


/* =========================================================
   ACTIVE TOOL
========================================================= */

function setActiveTool(btn){

    document
        .querySelectorAll(
            ".section button"
        )
        .forEach(
            function(b){

                b.classList.remove(
                    "active"
                );

            }
        );


    btn.classList.add(
        "active"
    );
}


/* =========================================================
   RESIZE
========================================================= */

function onWindowResize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =========================================================
   RENDER
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    orbitControls.update();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

window.onload =
    init;

</script>

</body>
</html>
