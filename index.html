<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MizaxEngine Animator V1</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#080808;
 color:#eee;
 font-family:Arial,sans-serif;
}

button{
 background:#171717;
 color:#ddd;
 border:1px solid #333;
 border-radius:0;
 padding:7px 10px;
 font-size:11px;
 white-space:nowrap;
}

button:active{background:#2a2a2a}
button.active{
 background:#7b1010;
 border-color:#d51b1b;
 color:#fff;
}

#viewports{
 position:absolute;
 inset:0;
 z-index:1;
}

#viewports canvas{
 display:block;
 width:100%;
 height:100%;
}

#topbar{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:48px;
 background:#0d0d0d;
 border-bottom:1px solid #292929;
 z-index:20;
 display:flex;
 align-items:center;
 gap:4px;
 padding:5px;
 overflow-x:auto;
}

.logo{
 color:#e21b23;
 font-weight:bold;
 font-size:13px;
 margin:0 8px 0 3px;
 white-space:nowrap;
}

#playBtn{
 min-width:58px;
}

#duration{
 width:55px;
 background:#111;
 color:#fff;
 border:1px solid #333;
 border-radius:0;
 padding:7px 5px;
 font-size:11px;
}

#fps{
 width:45px;
 background:#111;
 color:#fff;
 border:1px solid #333;
 border-radius:0;
 padding:7px 4px;
 font-size:11px;
}

#rigPanel{
 position:absolute;
 top:58px;
 left:8px;
 width:190px;
 max-height:48vh;
 background:rgba(12,12,12,.94);
 border:1px solid #292929;
 z-index:15;
 overflow:hidden;
}

.panelTitle{
 height:30px;
 display:flex;
 align-items:center;
 padding:0 8px;
 color:#e21b23;
 font-size:11px;
 font-weight:bold;
 border-bottom:1px solid #292929;
}

.tree{
 overflow:auto;
 max-height:calc(48vh - 30px);
}

.treeRow{
 height:27px;
 display:flex;
 align-items:center;
 padding-left:10px;
 font-size:11px;
 border-bottom:1px solid #171717;
}

.treeRow:active,
.treeRow.selected{
 background:#681010;
 color:#fff;
}

.treeArrow{
 color:#777;
 width:15px;
}

#info{
 position:absolute;
 top:calc(58px + 48vh + 7px);
 left:8px;
 width:190px;
 background:rgba(12,12,12,.94);
 border:1px solid #292929;
 z-index:15;
 padding:8px;
 font:10px monospace;
 line-height:1.55;
}

#timeline{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 height:250px;
 min-height:90px;
 background:#0b0b0b;
 border-top:2px solid #9c1717;
 z-index:30;
 display:flex;
 flex-direction:column;
}

#timelineHandle{
 height:10px;
 flex:none;
 background:#151515;
 border-bottom:1px solid #333;
 cursor:ns-resize;
 position:relative;
}

#timelineHandle:after{
 content:"";
 position:absolute;
 width:35px;
 height:3px;
 background:#666;
 left:50%;
 top:3px;
 transform:translateX(-50%);
}

#timeControls{
 height:39px;
 flex:none;
 display:flex;
 align-items:center;
 gap:4px;
 padding:4px 6px;
 border-bottom:1px solid #292929;
 overflow-x:auto;
}

#timeReadout{
 color:#ddd;
 font:11px monospace;
 min-width:76px;
 text-align:center;
}

#timelineBody{
 flex:1;
 min-height:0;
 display:flex;
 overflow:hidden;
}

#labels{
 width:135px;
 min-width:135px;
 background:#0e0e0e;
 border-right:1px solid #333;
 overflow:hidden;
}

.labelHead{
 height:30px;
 border-bottom:1px solid #333;
 display:flex;
 align-items:center;
 padding-left:8px;
 color:#777;
 font-size:10px;
}

.label{
 height:34px;
 display:flex;
 align-items:center;
 padding-left:8px;
 border-bottom:1px solid #1d1d1d;
 font-size:10px;
 white-space:nowrap;
 overflow:hidden;
}

#trackViewport{
 flex:1;
 min-width:0;
 overflow:auto;
 position:relative;
}

#trackInner{
 position:relative;
 min-width:900px;
 height:100%;
}

#ruler{
 height:30px;
 position:relative;
 border-bottom:1px solid #333;
 background:#111;
}

.tick{
 position:absolute;
 top:0;
 height:30px;
 border-left:1px solid #343434;
 color:#777;
 font:9px monospace;
 padding:3px 0 0 4px;
}

.tick.major{
 border-color:#555;
 color:#aaa;
}

#tracks{
 position:absolute;
 top:30px;
 left:0;
 right:0;
}

.track{
 height:34px;
 position:relative;
 border-bottom:1px solid #1d1d1d;
}

.snapLine{
 position:absolute;
 top:0;
 bottom:0;
 width:1px;
 background:#242424;
 pointer-events:none;
}

.kf{
 position:absolute;
 top:10px;
 width:12px;
 height:12px;
 background:#777;
 border:1px solid #aaa;
 transform:rotate(45deg);
 margin-left:-6px;
 cursor:pointer;
 z-index:5;
}

.kf.selected{
 background:#e21b23;
 border-color:#ff6767;
 box-shadow:0 0 8px #d51b1b;
}

#playhead{
 position:absolute;
 top:0;
 bottom:0;
 width:2px;
 background:#e21b23;
 z-index:20;
 pointer-events:none;
}

#playheadHead{
 position:absolute;
 top:0;
 left:-5px;
 width:12px;
 height:12px;
 background:#e21b23;
 clip-path:polygon(0 0,100% 0,50% 100%);
}

#contextMenu{
 position:fixed;
 display:none;
 z-index:100;
 background:#111;
 border:1px solid #555;
 width:150px;
 box-shadow:0 5px 20px #000;
}

.ctxTitle{
 padding:7px;
 color:#e21b23;
 font-size:10px;
 border-bottom:1px solid #333;
}

.ctxBtn{
 width:100%;
 border:0;
 border-bottom:1px solid #292929;
 text-align:left;
 padding:9px;
 background:#151515;
 color:#ddd;
}

.ctxBtn:active{
 background:#721313;
}

#toast{
 position:absolute;
 left:50%;
 bottom:270px;
 transform:translateX(-50%);
 background:#111;
 border:1px solid #e21b23;
 padding:7px 12px;
 font-size:10px;
 z-index:100;
 display:none;
}

@media(max-width:600px){
 #rigPanel{
  width:155px;
  max-height:35vh;
 }
 #info{
  width:155px;
  top:calc(58px + 35vh + 5px);
  font-size:9px;
 }
 #labels{
  width:110px;
  min-width:110px;
 }
 .logo{font-size:11px}
 #timeline{height:235px}
}
</style>
</head>

<body>

<div id="viewports"></div>

<div id="topbar">
 <div class="logo">MIZAXENGINE</div>
 <button id="rewind">⏮</button>
 <button id="prev">◀</button>
 <button id="playBtn">▶ PLAY</button>
 <button id="next">▶</button>
 <button id="loop" class="active">LOOP</button>
 <button id="copyBtn">COPY</button>
 <button id="pasteBtn">PASTE</button>
 <button id="newBtn">NEW</button>
 <span style="color:#555">│</span>
 <span style="font-size:9px;color:#777">DURATION</span>
 <input id="duration" type="number" value="2" min="0.25" step="0.25">
 <span style="font-size:9px;color:#777">FPS</span>
 <input id="fps" type="number" value="30" min="1" max="120">
</div>

<div id="rigPanel">
 <div class="panelTitle">RIG / HIERARCHY</div>
 <div class="tree" id="tree"></div>
</div>

<div id="info">Select a part...</div>

<div id="timeline">

 <div id="timelineHandle"></div>

 <div id="timeControls">
  <button id="zoomOut">−</button>
  <button id="zoomIn">+</button>
  <button id="addKf">KEYFRAME</button>
  <span id="timeReadout">0.00 / 2.00</span>
 </div>

 <div id="timelineBody">

  <div id="labels">
   <div class="labelHead">PARTS</div>
   <div id="labelRows"></div>
  </div>

  <div id="trackViewport">
   <div id="trackInner">
    <div id="ruler"></div>
    <div id="tracks"></div>
    <div id="playhead">
     <div id="playheadHead"></div>
    </div>
   </div>
  </div>

 </div>
</div>

<div id="contextMenu">
 <div class="ctxTitle">KEYFRAME</div>
 <button class="ctxBtn" id="ctxDuplicate">Duplicate</button>
 <button class="ctxBtn" id="ctxDelete">Delete</button>
 <button class="ctxBtn" id="ctxType">Type: Pose</button>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>
/* =========================================================
   MIZAXENGINE V1
========================================================= */

let scene,camera,renderer;
let orbitControls,transformControls;
let r6Rig={};
let pivots={};
let selectedPart=null;

let duration=2;
let fps=30;
let currentTime=0;
let playing=false;
let loop=true;
let timelineZoom=100;

let keyframes=[];
let selectedKF=null;
let clipboard=null;

const parts=[
 "Torso",
 "Head",
 "Left Arm",
 "Right Arm",
 "Left Leg",
 "Right Leg"
];

const $=id=>document.getElementById(id);


/* =========================================================
   INIT
========================================================= */

function init(){

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x1a1a1a);

 camera=new THREE.PerspectiveCamera(
  50,
  innerWidth/innerHeight,
  .1,
  1000
 );

 camera.position.set(7,5,9);

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
 });

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
 );

 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;

 $("viewports").appendChild(renderer.domElement);

 orbitControls=new THREE.OrbitControls(
  camera,
  renderer.domElement
 );

 orbitControls.enableDamping=true;
 orbitControls.dampingFactor=.06;
 orbitControls.target.set(0,1.5,0);
 orbitControls.minDistance=3;
 orbitControls.maxDistance=20;

 transformControls=new THREE.TransformControls(
  camera,
  renderer.domElement
 );

 transformControls.setSize(.75);
 scene.add(transformControls);

 transformControls.addEventListener(
  "dragging-changed",
  e=>orbitControls.enabled=!e.value
 );

 transformControls.addEventListener(
  "change",
  ()=>updateInfo()
 );

 const ambient=new THREE.AmbientLight(0xffffff,.72);
 scene.add(ambient);

 const light=new THREE.DirectionalLight(0xffffff,.85);
 light.position.set(5,10,7);
 light.castShadow=true;
 scene.add(light);

 const grid=new THREE.GridHelper(
  20,20,0x444444,0x222222
 );

 grid.position.y=-2;
 scene.add(grid);

 buildR6Rig();

 setupUI();
 buildTimeline();

 window.addEventListener("resize",resize);

 animate();
}


/* =========================================================
   ROUNDED BOX
========================================================= */

function roundedBox(w,h,d,r){

 const s=new THREE.Shape();

 const x=-w/2,y=-h/2;
 const rr=Math.min(r,w/2,h/2);

 s.moveTo(x+rr,y);
 s.lineTo(x+w-rr,y);
 s.quadraticCurveTo(x+w,y,x+w,y+rr);
 s.lineTo(x+w,y+h-rr);
 s.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
 s.lineTo(x+rr,y+h);
 s.quadraticCurveTo(x,y+h,x,y+h-rr);
 s.lineTo(x,y+rr);
 s.quadraticCurveTo(x,y,x+rr,y);

 const g=new THREE.ExtrudeGeometry(s,{
  depth:d,
  bevelEnabled:true,
  bevelSegments:2,
  bevelSize:r*.35,
  bevelThickness:r*.35,
  curveSegments:4
 });

 g.center();
 return g;
}


/* =========================================================
   FACE
========================================================= */

function faceTexture(){

 const c=document.createElement("canvas");
 c.width=512;
 c.height=512;

 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,512,512);

 ctx.fillStyle="#111";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font="bold 150px Arial";
 ctx.fillText(">v<",256,330);

 const t=new THREE.CanvasTexture(c);
 t.needsUpdate=true;

 return t;
}


/* =========================================================
   R6 RIG
========================================================= */

function buildR6Rig(){

 const root=new THREE.Group();
 root.name="R6";
 scene.add(root);

 const bodyMat=new THREE.MeshPhongMaterial({
  color:0xcccccc,
  shininess:20
 });

 const torsoMat=new THREE.MeshPhongMaterial({
  color:0x00a2ff,
  shininess:20
 });

 const legMat=new THREE.MeshPhongMaterial({
  color:0xcd2027,
  shininess:20
 });

 const headMat=new THREE.MeshPhongMaterial({
  color:0xffffff,
  shininess:25
 });

 const faceMat=new THREE.MeshBasicMaterial({
  map:faceTexture(),
  transparent:true,
  alphaTest:.01,
  depthWrite:false,
  side:THREE.DoubleSide
 });

 const torsoGeo=roundedBox(2,2,1,.16);
 const armGeo=roundedBox(1,2,1,.16);
 const legGeo=roundedBox(1,2,1,.16);
 const headGeo=new THREE.BoxGeometry(1.2,1.2,1.2);

 /* TORSO */

 const torso=new THREE.Mesh(torsoGeo,torsoMat);
 torso.name="Torso";
 torso.castShadow=true;
 torso.receiveShadow=true;
 root.add(torso);

 r6Rig.Torso=torso;
 pivots.Torso=torso;

 /* HEAD */

 const headPivot=new THREE.Group();
 headPivot.name="HeadPivot";
 headPivot.position.set(0,1,0);
 torso.add(headPivot);

 const head=new THREE.Mesh(headGeo,headMat);
 head.name="Head";
 head.position.set(0,.6,0);
 head.castShadow=true;
 head.receiveShadow=true;
 headPivot.add(head);

 const face=new THREE.Mesh(
  new THREE.PlaneGeometry(.82,.48),
  faceMat
 );

 face.position.set(0,.20,.606);
 head.add(face);

 r6Rig.Head=head;
 pivots.Head=headPivot;

 /* ARMS */

 createLimb(
  "Left Arm",
  -1.5,
  1,
  armGeo,
  bodyMat,
  "LeftArmPivot"
 );

 createLimb(
  "Right Arm",
  1.5,
  1,
  armGeo,
  bodyMat,
  "RightArmPivot"
 );

 /* LEGS */

 createLimb(
  "Left Leg",
  -.5,
  -1,
  legGeo,
  legMat,
  "LeftLegPivot"
 );

 createLimb(
  "Right Leg",
  .5,
  -1,
  legGeo,
  legMat,
  "RightLegPivot"
 );

 buildTree();
 selectPart(torso);
}


function createLimb(
 name,x,y,geo,mat,pivotName
){

 const pivot=new THREE.Group();
 pivot.name=pivotName;
 pivot.position.set(x,y,0);
 r6Rig.Torso.add(pivot);

 const mesh=new THREE.Mesh(geo,mat);
 mesh.name=name;
 mesh.position.set(0,-1,0);
 mesh.castShadow=true;
 mesh.receiveShadow=true;

 pivot.add(mesh);

 r6Rig[name]=mesh;
 pivots[name]=pivot;
}


/* =========================================================
   TREE
========================================================= */

function buildTree(){

 $("tree").innerHTML="";

 parts.forEach(name=>{

  const row=document.createElement("div");
  row.className="treeRow";
  row.dataset.name=name;

  row.innerHTML=
   '<span class="treeArrow">▸</span>'+
   '<span>'+name+'</span>';

  row.onclick=()=>selectPart(r6Rig[name]);

  $("tree").appendChild(row);
 });
}


function selectPart(part){

 selectedPart=part;

 const target=
  pivots[part.name]||part;

 transformControls.attach(target);

 document.querySelectorAll(".treeRow")
 .forEach(x=>{
  x.classList.toggle(
   "selected",
   x.dataset.name===part.name
  );
 });

 updateInfo();
}


function updateInfo(){

 if(!selectedPart)return;

 const t=pivots[selectedPart.name]||selectedPart;

 $("info").innerHTML=
  "<b style='color:#e21b23'>"+selectedPart.name+"</b><br>"+
  "POS "+
  t.position.x.toFixed(2)+" / "+
  t.position.y.toFixed(2)+" / "+
  t.position.z.toFixed(2)+"<br>"+
  "ROT "+
  THREE.MathUtils.radToDeg(t.rotation.x).toFixed(1)+"° / "+
  THREE.MathUtils.radToDeg(t.rotation.y).toFixed(1)+"° / "+
  THREE.MathUtils.radToDeg(t.rotation.z).toFixed(1)+"°";
}


/* =========================================================
   TIMELINE
========================================================= */

function buildTimeline(){

 $("labelRows").innerHTML="";
 $("tracks").innerHTML="";
 $("ruler").innerHTML="";

 parts.forEach(name=>{

  const label=document.createElement("div");
  label.className="label";
  label.textContent=name;
  $("labelRows").appendChild(label);

  const track=document.createElement("div");
  track.className="track";
  track.dataset.part=name;
  $("tracks").appendChild(track);
 });

 drawTimeline();
}


function pixelsPerSecond(){
 return timelineZoom;
}


function timeToX(t){
 return t*pixelsPerSecond();
}


function xToTime(x){

 let t=x/pixelsPerSecond();

 const step=1/fps;

 t=Math.round(t/step)*step;

 return Math.max(
  0,
  Math.min(duration,t)
 );
}


function drawTimeline(){

 const width=Math.max(
  900,
  duration*pixelsPerSecond()+100
 );

 $("trackInner").style.width=width+"px";

 $("ruler").innerHTML="";

 const step=1/fps;

 const visibleStep=
  fps>=60 ? .25 :
  fps>=30 ? .25 :
  .5;

 for(
  let t=0;
  t<=duration+.001;
  t+=visibleStep
 ){

  const tick=document.createElement("div");

  tick.className=
   "tick "+(
    Math.abs(t%1)<.001?
    "major":""
   );

  tick.style.left=timeToX(t)+"px";
  tick.textContent=t.toFixed(2);

  $("ruler").appendChild(tick);

  const line=document.createElement("div");

  line.className="snapLine";
  line.style.left=timeToX(t)+"px";

  document.querySelectorAll(".track")
   .forEach(track=>{
    track.appendChild(
     line.cloneNode()
    );
   });
 }

 renderKeyframes();
 updatePlayhead();
}


function renderKeyframes(){

 document.querySelectorAll(".kf")
  .forEach(x=>x.remove());

 keyframes.forEach((kf,index)=>{

  const track=document.querySelector(
   '.track[data-part="'+kf.part+'"]'
  );

  if(!track)return;

  const el=document.createElement("div");

  el.className="kf";

  if(selectedKF===kf)
   el.classList.add("selected");

  el.style.left=timeToX(kf.time)+"px";

  el.dataset.index=index;

  el.addEventListener(
   "click",
   e=>{
    e.stopPropagation();
    selectedKF=kf;
    currentTime=kf.time;
    renderKeyframes();
    updatePlayhead();
   }
  );

  let holdTimer;

  el.addEventListener(
   "pointerdown",
   e=>{

    e.stopPropagation();

    holdTimer=setTimeout(()=>{
     selectedKF=kf;
     showContext(
      e.clientX,
      e.clientY
     );
    },500);

    el.setPointerCapture(e.pointerId);
   }
  );

  el.addEventListener(
   "pointerup",
   e=>{
    clearTimeout(holdTimer);
   }
  );

  el.addEventListener(
   "pointermove",
   e=>{

    if(
     selectedKF!==kf ||
     e.pressure===0
    )return;

    clearTimeout(holdTimer);

    const rect=$("trackInner")
     .getBoundingClientRect();

    const x=e.clientX-
     rect.left+
     $("trackViewport").scrollLeft;

    kf.time=xToTime(x);

    currentTime=kf.time;

    updatePlayhead();
    renderKeyframes();
   }
  );

  track.appendChild(el);
 });
}


/* =========================================================
   ADD KEYFRAME
========================================================= */

function addKeyframe(){

 if(!selectedPart)return;

 const t=xToTime(currentTime);

 const part=selectedPart.name;

 const target=pivots[part]||selectedPart;

 const kf={
  part:part,
  time:t,
  type:"Pose",
  position:{
   x:target.position.x,
   y:target.position.y,
   z:target.position.z
  },
  rotation:{
   x:target.rotation.x,
   y:target.rotation.y,
   z:target.rotation.z
  },
  scale:{
   x:target.scale.x,
   y:target.scale.y,
   z:target.scale.z
  }
 };

 const existing=keyframes.find(
  x=>x.part===part &&
  Math.abs(x.time-t)<.0001
 );

 if(existing){

  Object.assign(existing,kf);
  selectedKF=existing;

 }else{

  keyframes.push(kf);
  selectedKF=kf;

 }

 keyframes.sort((a,b)=>a.time-b.time);

 renderKeyframes();
 showToast("Keyframe added");
}


/* =========================================================
   APPLY KEYFRAME
========================================================= */

function applyKeyframe(kf){

 const target=pivots[kf.part];

 if(!target)return;

 target.position.set(
  kf.position.x,
  kf.position.y,
  kf.position.z
 );

 target.rotation.set(
  kf.rotation.x,
  kf.rotation.y,
  kf.rotation.z
 );

 target.scale.set(
  kf.scale.x,
  kf.scale.y,
  kf.scale.z
 );
}


/* =========================================================
   PLAYBACK
========================================================= */

function updatePlayhead(){

 const x=timeToX(currentTime);

 $("playhead").style.left=x+"px";

 $("timeReadout").textContent=
  currentTime.toFixed(2)+
  " / "+
  duration.toFixed(2);
}


function animatePlayback(){

 if(playing){

  currentTime+=1/60;

  if(currentTime>=duration){

   if(loop){
    currentTime=0;
   }else{
    currentTime=duration;
    playing=false;
    $("playBtn").textContent="▶ PLAY";
   }
  }

  applyNearestAnimation();
  updatePlayhead();
 }

 requestAnimationFrame(animatePlayback);
}


function applyNearestAnimation(){

 if(!keyframes.length)return;

 for(const part of parts){

  const list=keyframes
   .filter(k=>k.part===part)
   .sort((a,b)=>a.time-b.time);

  if(!list.length)continue;

  let a=list[0];
  let b=list[list.length-1];

  for(let i=0;i<list.length-1;i++){

   if(
    currentTime>=list[i].time &&
    currentTime<=list[i+1].time
   ){

    a=list[i];
    b=list[i+1];
    break;
   }
  }

  const span=b.time-a.time;

  let alpha=
   span<=0?0:
   (currentTime-a.time)/span;

  alpha=Math.max(0,Math.min(1,alpha));

  const target=pivots[part];

  if(!target)continue;

  target.position.x=
   a.position.x+
   (b.position.x-a.position.x)*alpha;

  target.position.y=
   a.position.y+
   (b.position.y-a.position.y)*alpha;

  target.position.z=
   a.position.z+
   (b.position.z-a.position.z)*alpha;

  target.rotation.x=
   a.rotation.x+
   (b.rotation.x-a.rotation.x)*alpha;

  target.rotation.y=
   a.rotation.y+
   (b.rotation.y-a.rotation.y)*alpha;

  target.rotation.z=
   a.rotation.z+
   (b.rotation.z-a.rotation.z)*alpha;

  target.scale.x=
   a.scale.x+
   (b.scale.x-a.scale.x)*alpha;

  target.scale.y=
   a.scale.y+
   (b.scale.y-a.scale.y)*alpha;

  target.scale.z=
   a.scale.z+
   (b.scale.z-a.scale.z)*alpha;
 }
}


/* =========================================================
   PLAYHEAD CLICK
========================================================= */

$("trackViewport").addEventListener(
 "pointerdown",
 e=>{

  if(
   e.target.classList.contains("kf")
  )return;

  const rect=$("trackInner")
   .getBoundingClientRect();

  const x=
   e.clientX-
   rect.left+
   $("trackViewport").scrollLeft;

  currentTime=xToTime(x);

  updatePlayhead();
 }
);


/* =========================================================
   COPY / PASTE
========================================================= */

function copyKeyframe(){

 if(!selectedKF){
  showToast("Select a keyframe first");
  return;
 }

 clipboard=JSON.parse(
  JSON.stringify(selectedKF)
 );

 showToast("Copied");
}


function pasteKeyframe(){

 if(!clipboard){
  showToast("Nothing copied");
  return;
 }

 const kf=JSON.parse(
  JSON.stringify(clipboard)
 );

 kf.time=xToTime(currentTime);

 keyframes.push(kf);

 keyframes.sort(
  (a,b)=>a.time-b.time
 );

 selectedKF=kf;

 renderKeyframes();

 showToast("Pasted");
}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContext(x,y){

 $("contextMenu").style.display="block";

 const w=150;
 const h=120;

 $("contextMenu").style.left=
  Math.min(x,innerWidth-w-5)+"px";

 $("contextMenu").style.top=
  Math.min(y,innerHeight-h-5)+"px";
}


function hideContext(){
 $("contextMenu").style.display="none";
}


document.addEventListener(
 "pointerdown",
 e=>{
  if(!e.target.closest("#contextMenu"))
   hideContext();
 }
);


$("ctxDelete").onclick=()=>{

 if(selectedKF){

  keyframes=
   keyframes.filter(
    x=>x!==selectedKF
   );

  selectedKF=null;

  renderKeyframes();
  showToast("Deleted");
 }

 hideContext();
};


$("ctxDuplicate").onclick=()=>{

 if(selectedKF){

  const copy=
   JSON.parse(
    JSON.stringify(selectedKF)
   );

  copy.time=xToTime(
   selectedKF.time+1/fps
  );

  keyframes.push(copy);
  keyframes.sort(
   (a,b)=>a.time-b.time
  );

  selectedKF=copy;
  renderKeyframes();
  showToast("Duplicated");
 }

 hideContext();
};


$("ctxType").onclick=()=>{

 if(selectedKF){

  selectedKF.type=
   selectedKF.type==="Pose"?
   "Move":"Pose";

  showToast(
   "Type: "+selectedKF.type
  );
 }

 hideContext();
};


/* =========================================================
   TIMELINE RESIZE
========================================================= */

let resizing=false;
let startY=0;
let startH=0;

$("timelineHandle").addEventListener(
 "pointerdown",
 e=>{

  resizing=true;
  startY=e.clientY;
  startH=$("timeline").offsetHeight;

  $("timelineHandle")
   .setPointerCapture(e.pointerId);
 }
);

$("timelineHandle").addEventListener(
 "pointermove",
 e=>{

  if(!resizing)return;

  const h=
   startH+
   (startY-e.clientY);

  $("timeline").style.height=
   Math.max(
    90,
    Math.min(innerHeight-50,h)
   )+"px";
 }
);

$("timelineHandle").addEventListener(
 "pointerup",
 ()=>{
  resizing=false;
 }
);


/* =========================================================
   UI
========================================================= */

$("playBtn").onclick=()=>{

 playing=!playing;

 $("playBtn").textContent=
  playing?"❚❚ PAUSE":"▶ PLAY";
};


$("rewind").onclick=()=>{
 currentTime=0;
 playing=false;
 $("playBtn").textContent="▶ PLAY";
 updatePlayhead();
};


$("prev").onclick=()=>{
 currentTime=xToTime(
  currentTime-1/fps
 );
 updatePlayhead();
};


$("next").onclick=()=>{
 currentTime=xToTime(
  currentTime+1/fps
 );
 updatePlayhead();
};


$("loop").onclick=()=>{

 loop=!loop;

 $("loop").classList.toggle(
  "active",
  loop
 );
};


$("addKf").onclick=addKeyframe;

$("copyBtn").onclick=copyKeyframe;
$("pasteBtn").onclick=pasteKeyframe;


$("zoomIn").onclick=()=>{

 timelineZoom=Math.min(
  400,
  timelineZoom+25
 );

 drawTimeline();
};


$("zoomOut").onclick=()=>{

 timelineZoom=Math.max(
  40,
  timelineZoom-25
 );

 drawTimeline();
};


$("duration").onchange=e=>{

 duration=Math.max(
  .25,
  Number(e.target.value)||2
 );

 if(currentTime>duration)
  currentTime=duration;

 drawTimeline();
};


$("fps").onchange=e=>{

 fps=Math.max(
  1,
  Number(e.target.value)||30
 );

 drawTimeline();
};


$("newBtn").onclick=()=>{

 keyframes=[];
 selectedKF=null;
 currentTime=0;
 playing=false;

 $("playBtn").textContent="▶ PLAY";

 resetRig();
 drawTimeline();

 showToast("New animation");
};


function resetRig(){

 parts.forEach(name=>{

  const t=pivots[name];

  if(!t)return;

  if(name==="Torso"){
   t.position.set(0,0,0);
  }

  t.rotation.set(0,0,0);
  t.scale.set(1,1,1);
 });
}


/* =========================================================
   CAMERA / RESIZE
========================================================= */

function resize(){

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
);
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(msg){

 $("toast").textContent=msg;
 $("toast").style.display="block";

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  $("toast").style.display="none";
 },900);
}


/* =========================================================
   RENDER
========================================================= */

function animate(){

 requestAnimationFrame(animate);

 orbitControls.update();

 renderer.render(
  scene,
  camera
 );
}


/* =========================================================
   START
========================================================= */

window.onload=()=>{

 init();

 animatePlayback();
};

</script>
</body>
</html>
