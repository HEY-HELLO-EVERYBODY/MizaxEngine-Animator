<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MizaxEngine Animator</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#eee;font-family:Arial}
button{border:1px solid #444;background:#151515;color:#ddd;border-radius:7px;font-weight:bold}
button.active{background:#777;color:#fff;border-color:#aaa}
#app{height:100%;display:flex;flex-direction:column}
#top{height:50px;display:flex;gap:5px;padding:5px;background:#101010;overflow:auto}
.tool{height:40px;min-width:64px;padding:0 10px;flex-shrink:0}
#page{height:32px;display:flex;background:#0d0d0d;border-bottom:1px solid #292929}
.page{flex:1;border:0;border-radius:0;background:#111;color:#777;font-size:10px}
.page.active{background:#292929;color:#fff}
#work{position:relative;flex:1;min-height:0}
#view{position:absolute;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#parts{position:absolute;left:5px;top:5px;z-index:5;display:flex;flex-direction:column;gap:4px}
.part{width:92px;height:30px;font-size:9px;background:#111c}
.part.active{background:#777}
#panel{position:absolute;right:5px;top:5px;z-index:5;background:#111d;border:1px solid #333;border-radius:7px;padding:7px;font-size:9px}
#timelinePanel{height:205px;display:flex;flex-direction:column;background:#090909;border-top:1px solid #333}
#controls{height:40px;display:flex;gap:5px;padding:4px}
.ctrl{height:32px;min-width:42px}
#readout{min-width:110px;text-align:center;padding-top:9px;font-size:10px}
#timeline{flex:1;overflow:auto;position:relative;touch-action:pan-x}
#inner{position:relative;min-height:100%;width:500px}
#ruler{height:25px;background:#111;position:relative}
.tick{position:absolute;height:25px;width:1px;background:#333}
.tick span{font-size:8px;color:#888;position:absolute;left:3px;top:5px;white-space:nowrap}
.track{height:27px;border-bottom:1px solid #191919;position:relative}
.label{position:sticky;left:0;z-index:4;width:92px;height:27px;background:#111;color:#888;font-size:8px;padding:9px 5px;border-right:1px solid #333}
.key{position:absolute;top:8px;width:11px;height:11px;background:#aaa;transform:translateX(-5px) rotate(45deg);border:1px solid #fff;z-index:3}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:8;pointer-events:none}
#end{position:absolute;top:0;bottom:0;width:20px;z-index:9;touch-action:none}
#end:before{content:"]";font-size:18px;position:absolute;left:0;color:#fff}
#end:after{content:"";position:absolute;left:9px;top:0;bottom:0;width:1px;background:#aaa}
#popup{display:none;position:fixed;z-index:50;background:#161616;border:1px solid #666;border-radius:9px;padding:5px;box-shadow:0 5px 25px #000}
#popup button{display:block;width:110px;height:30px;margin:3px;font-size:10px}
.pageContent{display:none}
.pageContent.active{display:block}
#transformInfo{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#111d;border:1px solid #444;border-radius:7px;padding:5px 10px;font-size:9px;z-index:10}
</style>
</head>

<body>
<div id="app">

<div id="top">
<button class="tool active" id="modeBtn">MOVE</button>
<button class="tool active" id="dirBtn">FIXED</button>
<button class="tool active" id="playMode">LOOP</button>
<button class="tool" id="cameraBtn">CAM</button>
<button class="tool" id="undoBtn">UNDO</button>
<button class="tool" id="redoBtn">REDO</button>
</div>

<div id="page">
<button class="page active" data-page="animate">ANIMATE</button>
<button class="page" data-page="transform">TRANSFORM</button>
<button class="page" data-page="rig">RIG</button>
<button class="page" data-page="camera">CAMERA</button>
</div>

<div id="work">

<div id="view"></div>

<div id="parts">
<button class="part" data-part="Head">HEAD</button>
<button class="part active" data-part="Torso">TORSO</button>
<button class="part" data-part="Left Arm">L ARM</button>
<button class="part" data-part="Right Arm">R ARM</button>
<button class="part" data-part="Left Leg">L LEG</button>
<button class="part" data-part="Right Leg">R LEG</button>
</div>

<div id="panel">
R6<br>
GRAY RIG
</div>

<div id="transformInfo">
MOVE • FIXED
</div>

</div>

<div id="timelinePanel">

<div id="controls">
<button class="ctrl" id="prev">◀</button>
<button class="ctrl" id="play">▶</button>
<button class="ctrl" id="next">▶|</button>
<div id="readout">0.00 / 2.00</div>
</div>

<div id="timeline">
<div id="inner">
<div id="ruler"></div>
<div id="tracks"></div>
<div id="playhead"></div>
<div id="end"></div>
</div>
</div>

</div>
</div>

<div id="popup">
<button id="kfMove">KF MOVE</button>
<button id="kfCopy">DUPLICATE</button>
<button id="kfDelete">DELETE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>
const view=document.getElementById("view");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090909);

const camera=new THREE.PerspectiveCamera(
45,
1,
.05,
100
);

camera.position.set(7,5,9);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(view.clientWidth,view.clientHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
view.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x333333,1.5));

const dl=new THREE.DirectionalLight(0xffffff,1);
dl.position.set(5,8,7);
scene.add(dl);

const grid=new THREE.GridHelper(
30,30,0x444444,0x191919
);
scene.add(grid);

const orbit=new THREE.OrbitControls(
camera,
renderer.domElement
);

orbit.target.set(0,3,0);
orbit.enableDamping=true;

const gizmo=new THREE.TransformControls(
camera,
renderer.domElement
);

gizmo.setSize(.8);
scene.add(gizmo);

let cameraLocked=false;
let selected="Torso";
let transformMode="translate";
let directionMode="world";

const gray=new THREE.MeshStandardMaterial({
color:0x888888,
roughness:.72
});

const darkGray=new THREE.MeshStandardMaterial({
color:0x777777,
roughness:.72
});

function box(w,h,d,r=.1){

const s=new THREE.Shape();
const x=-w/2,y=-h/2;

s.moveTo(x+r,y);
s.lineTo(x+w-r,y);
s.quadraticCurveTo(x+w,y,x+w,y+r);
s.lineTo(x+w,y+h-r);
s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
s.lineTo(x+r,y+h);
s.quadraticCurveTo(x,y+h,x,y+h-r);
s.lineTo(x,y+r);
s.quadraticCurveTo(x,y,x+r,y);

const g=new THREE.ExtrudeGeometry(s,{
depth:d,
bevelEnabled:true,
bevelSegments:3,
bevelSize:r*.4,
bevelThickness:r*.4
});

g.center();
return g;
}

function makeHead(){

const g=box(1.65,1.55,1.55,.22);
const group=new THREE.Group();

const mesh=new THREE.Mesh(g,gray);
group.add(mesh);

/* XD FACE — ROTATED 90° */
const canvas=document.createElement("canvas");
canvas.width=256;
canvas.height=256;

const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,256,256);
ctx.fillStyle="#222";
ctx.font="bold 78px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.save();
ctx.translate(128,128);
ctx.rotate(Math.PI/2);
ctx.fillText("XD",0,0);
ctx.restore();

const tex=new THREE.CanvasTexture(canvas);
tex.needsUpdate=true;

const faceMat=new THREE.MeshBasicMaterial({
map:tex,
transparent:true
});

const face=new THREE.Mesh(
new THREE.PlaneGeometry(1.05,1.05),
faceMat
);

face.position.z=.786;
group.add(face);

return group;
}

const root=new THREE.Group();
scene.add(root);

const parts={};

function part(name,geo,mat,parent){

const g=new THREE.Group();
g.name=name;

g.add(new THREE.Mesh(geo,mat));
parent.add(g);

parts[name]=g;

return g;
}

const torso=part(
"Torso",
box(2,2,1,.12),
gray,
root
);

torso.position.y=4;

const head=makeHead();
head.name="Head";
head.position.y=1.72;
torso.add(head);
parts.Head=head;

const la=part(
"Left Arm",
box(1,2,1,.1),
darkGray,
torso
);

la.position.x=-1.5;

const ra=part(
"Right Arm",
box(1,2,1,.1),
darkGray,
torso
);

ra.position.x=1.5;

const ll=part(
"Left Leg",
box(1,2,1,.1),
darkGray,
torso
);

ll.position.set(-.5,-2,0);

const rl=part(
"Right Leg",
box(1,2,1,.1),
darkGray,
torso
);

rl.position.set(.5,-2,0);

function selectPart(n){

selected=n;

document.querySelectorAll(".part").forEach(b=>{
b.classList.toggle(
"active",
b.dataset.part===n
);
});

gizmo.attach(parts[n]);
}

document.querySelectorAll(".part").forEach(b=>{
b.onpointerdown=e=>{
e.stopPropagation();
selectPart(b.dataset.part);
};
});

gizmo.attach(parts.Torso);

document.getElementById("modeBtn").onclick=()=>{

transformMode=
transformMode==="translate"
?"rotate"
:"translate";

gizmo.setMode(transformMode);

document.getElementById("modeBtn").textContent=
transformMode==="translate"
?"MOVE"
:"ROTATE";

document.getElementById("transformInfo").textContent=
(transformMode==="translate"?"MOVE":"ROTATE")+
" • "+
(directionMode==="world"?"FIXED":"LOCAL");
};

document.getElementById("dirBtn").onclick=()=>{

directionMode=
directionMode==="world"
?"local"
:"world";

gizmo.setSpace(directionMode);

document.getElementById("dirBtn").textContent=
directionMode==="world"
?"FIXED"
:"LOCAL";

document.getElementById("transformInfo").textContent=
(transformMode==="translate"?"MOVE":"ROTATE")+
" • "+
(directionMode==="world"?"FIXED":"LOCAL");
};

document.getElementById("cameraBtn").onclick=()=>{

cameraLocked=!cameraLocked;

orbit.enabled=!cameraLocked;

document.getElementById("cameraBtn").textContent=
cameraLocked?"CAM 🔒":"CAM";
};

let loop=true;

document.getElementById("playMode").onclick=()=>{

loop=!loop;

document.getElementById("playMode").textContent=
loop?"LOOP":"ONCE";
};

/* =====================
   PER-PART KEYFRAMES
===================== */

const tracks={};

Object.keys(parts).forEach(n=>{
tracks[n]=[];
});

let currentTime=0;
let duration=2;
let playing=false;

function capturePart(name){

const p=parts[name];

return {
position:p.position.clone(),
quaternion:p.quaternion.clone()
};
}

function applyPart(name,data){

const p=parts[name];

p.position.copy(data.position);
p.quaternion.copy(data.quaternion);
}

function saveState(){

const state={};

Object.keys(parts).forEach(n=>{
state[n]=capturePart(n);
});

return state;
}

const undoStack=[];
const redoStack=[];

function history(){

undoStack.push(saveState());

if(undoStack.length>30)
undoStack.shift();

redoStack.length=0;
}

function restore(state){

Object.keys(state).forEach(n=>{
applyPart(n,state[n]);
});
}

function addKey(name,time){

const data=capturePart(name);

let list=tracks[name];

let k=list.find(
x=>Math.abs(x.time-time)<.03
);

if(k){
k.data=data;
}else{
list.push({
time:time,
data:data
});
}

list.sort((a,b)=>a.time-b.time);

renderTimeline();
}

let lastTransform=null;

gizmo.addEventListener(
"dragging-changed",
e=>{

orbit.enabled=
!e.value&&!cameraLocked;

if(e.value){

history();

lastTransform={
name:selected,
data:capturePart(selected)
};

}
});

gizmo.addEventListener(
"objectChange",
()=>{

if(!playing){

addKey(
selected,
currentTime
);

}
});

/* =====================
   EVALUATION
===================== */

function evaluatePart(name,time){

const list=tracks[name];

if(!list.length)return;

if(list.length===1){

applyPart(name,list[0].data);
return;
}

if(time<=list[0].time){

applyPart(name,list[0].data);
return;
}

if(time>=list[list.length-1].time){

applyPart(
name,
list[list.length-1].data
);

return;
}

let a=list[0],b=list[1];

for(let i=0;i<list.length-1;i++){

if(
time>=list[i].time&&
time<=list[i+1].time
){

a=list[i];
b=list[i+1];
break;
}
}

let t=
(time-a.time)/
Math.max(.00001,b.time-a.time);

t=t*t*(3-2*t);

const p=parts[name];

p.position.lerpVectors(
a.data.position,
b.data.position,
t
);

p.quaternion.slerpQuaternions(
a.data.quaternion,
b.data.quaternion,
t
);
}

function evaluate(){

Object.keys(parts).forEach(n=>{
evaluatePart(n,currentTime);
});

}

/* =====================
   TIMELINE
===================== */

const timeline=
document.getElementById("timeline");

const inner=
document.getElementById("inner");

const ruler=
document.getElementById("ruler");

const tracksEl=
document.getElementById("tracks");

const playhead=
document.getElementById("playhead");

const end=
document.getElementById("end");

const readout=
document.getElementById("readout");

const PX=130;
const OFFSET=92;

function renderTimeline(){

ruler.innerHTML="";
tracksEl.innerHTML="";

inner.style.width=
Math.max(
timeline.clientWidth,
OFFSET+duration*PX+100
)+"px";

for(let t=0;t<=duration+.001;t+=.25){

const tick=document.createElement("div");

tick.className="tick";
tick.style.left=
OFFSET+t*PX+"px";

if(Math.abs(t%0.5)<.001){

const s=document.createElement("span");
s.textContent=t.toFixed(1)+"s";
tick.appendChild(s);

}

ruler.appendChild(tick);
}

Object.keys(parts).forEach(name=>{

const row=document.createElement("div");
row.className="track";

const label=document.createElement("div");
label.className="label";
label.textContent=name;
row.appendChild(label);

tracks[name].forEach(k=>{

const key=document.createElement("div");
key.className="key";

key.style.left=
OFFSET+k.time*PX+"px";

let holdTimer;

key.addEventListener(
"pointerdown",
e=>{

e.stopPropagation();

holdTimer=setTimeout(()=>{

openKeyMenu(
e.clientX,
e.clientY,
name,
k
);

},500);

});

key.addEventListener(
"pointerup",
()=>clearTimeout(holdTimer)
);

key.addEventListener(
"pointercancel",
()=>clearTimeout(holdTimer)
);

row.appendChild(key);

});

tracksEl.appendChild(row);

});

updateTimeline();
}

function updateTimeline(){

playhead.style.left=
OFFSET+currentTime*PX+"px";

end.style.left=
OFFSET+duration*PX+"px";

readout.textContent=
currentTime.toFixed(2)+
" / "+
duration.toFixed(2);
}

/* =====================
   KEY MOVE
===================== */

let movingKey=null;

function openKeyMenu(x,y,name,k){

const popup=
document.getElementById("popup");

popup.style.display="block";

popup.style.left=
Math.min(
x,
innerWidth-125
)+"px";

popup.style.top=
Math.min(
y,
innerHeight-120
)+"px";

popup.dataset.name=name;
popup._key=k;
}

document.addEventListener(
"pointerdown",
e=>{

const popup=
document.getElementById("popup");

if(
popup.style.display==="block"&&
!popup.contains(e.target)
){
popup.style.display="none";
}

});

document.getElementById("kfMove").onclick=()=>{

const popup=document.getElementById("popup");
const name=popup.dataset.name;
const k=popup._key;

movingKey={
name:name,
key:k
};

popup.style.display="none";

};

document.getElementById("kfCopy").onclick=()=>{

const popup=document.getElementById("popup");

const name=popup.dataset.name;
const k=popup._key;

const copy={
time:Math.min(
duration,
k.time+.25
),
data:{
position:k.data.position.clone(),
quaternion:k.data.quaternion.clone()
}
};

tracks[name].push(copy);
tracks[name].sort((a,b)=>a.time-b.time);

popup.style.display="none";

renderTimeline();
};

document.getElementById("kfDelete").onclick=()=>{

const popup=document.getElementById("popup");

const name=popup.dataset.name;
const k=popup._key;

tracks[name]=
tracks[name].filter(x=>x!==k);

popup.style.display="none";

renderTimeline();
};

/* drag KF */

timeline.addEventListener(
"pointermove",
e=>{

if(!movingKey)return;

const rect=
inner.getBoundingClientRect();

let x=
e.clientX-
rect.left-
OFFSET;

let t=
Math.max(
0,
Math.min(
duration,
x/PX
)
);

movingKey.key.time=t;

tracks[movingKey.name].sort(
(a,b)=>a.time-b.time
);

renderTimeline();
});

timeline.addEventListener(
"pointerup",
()=>{

if(movingKey){

movingKey=null;
renderTimeline();

}
});

/* =====================
   PLAYHEAD
===================== */

let scrub=false;

timeline.addEventListener(
"pointerdown",
e=>{

if(
e.target.classList.contains("key")||
e.target===end
)return;

const rect=
inner.getBoundingClientRect();

let x=
e.clientX-
rect.left-
OFFSET;

scrub=true;

currentTime=
Math.max(
0,
Math.min(duration,x/PX)
);

evaluate();
updateTimeline();

});

timeline.addEventListener(
"pointermove",
e=>{

if(!scrub)return;

const rect=
inner.getBoundingClientRect();

let x=
e.clientX-
rect.left-
OFFSET;

currentTime=
Math.max(
0,
Math.min(duration,x/PX)
);

evaluate();
updateTimeline();

});

timeline.addEventListener(
"pointerup",
()=>scrub=false
);

/* =====================
   DURATION 0-50s
===================== */

let draggingEnd=false;

end.addEventListener(
"pointerdown",
e=>{
e.stopPropagation();
draggingEnd=true;
});

end.addEventListener(
"pointermove",
e=>{

if(!draggingEnd)return;

const rect=
inner.getBoundingClientRect();

let x=
e.clientX-
rect.left-
OFFSET;

duration=
Math.max(
.25,
Math.min(
50,
x/PX
)
);

if(currentTime>duration)
currentTime=duration;

renderTimeline();
});

end.addEventListener(
"pointerup",
()=>draggingEnd=false
);

end.addEventListener(
"pointercancel",
()=>draggingEnd=false
);

/* =====================
   PLAY
===================== */

let lastTime=performance.now();

document.getElementById("play").onclick=()=>{

playing=!playing;

document.getElementById("play").textContent=
playing?"⏸":"▶";

lastTime=performance.now();

};

document.getElementById("prev").onclick=()=>{

let t=0;

Object.values(tracks).forEach(list=>{

list.forEach(k=>{

if(k.time<currentTime-.02)
t=Math.max(t,k.time);

});

});

currentTime=t;
evaluate();
updateTimeline();
};

document.getElementById("next").onclick=()=>{

let t=duration;

Object.values(tracks).forEach(list=>{

list.forEach(k=>{

if(k.time>currentTime+.02)
t=Math.min(t,k.time);

});

});

currentTime=t;
evaluate();
updateTimeline();
};

/* =====================
   UNDO REDO
===================== */

document.getElementById("undoBtn").onclick=()=>{

if(!undoStack.length)return;

redoStack.push(saveState());

restore(
undoStack.pop()
);

renderTimeline();

};

document.getElementById("redoBtn").onclick=()=>{

if(!redoStack.length)return;

undoStack.push(saveState());

restore(
redoStack.pop()
);

renderTimeline();

};

/* =====================
   PAGES
===================== */

document.querySelectorAll(".page").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

const page=btn.dataset.page;

document.getElementById("timelinePanel")
.style.display=
page==="animate"?"flex":"none";

document.getElementById("parts")
.style.display=
page==="rig"||page==="transform"
?"flex":"none";

document.getElementById("transformInfo")
.style.display=
page==="transform"
?"block":"none";

if(page==="camera"){

orbit.enabled=true;

}

if(page==="transform"){

gizmo.attach(parts[selected]);

}

};

});

/* =====================
   RESIZE
===================== */

function resize(){

const w=Math.max(1,view.clientWidth);
const h=Math.max(1,view.clientHeight);

camera.aspect=w/h;
camera.updateProjectionMatrix();

renderer.setSize(w,h,false);

renderTimeline();
}

window.addEventListener("resize",resize);

/* =====================
   LOOP
===================== */

function animate(now){

requestAnimationFrame(animate);

orbit.update();

if(playing){

let dt=
Math.min(
.08,
(now-lastTime)/1000
);

lastTime=now;

currentTime+=dt;

if(currentTime>=duration){

if(loop){

currentTime=0;

}else{

currentTime=duration;
playing=false;

document.getElementById("play")
.textContent="▶";

}

}

evaluate();
updateTimeline();

}

renderer.render(
scene,
camera
);

}

resize();

selectPart("Torso");

renderTimeline();

requestAnimationFrame(animate);

</script>
</body>
</html>
