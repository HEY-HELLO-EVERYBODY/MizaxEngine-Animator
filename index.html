<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MizaxEngine Animator V6</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#0d0d0d;
 color:#ddd;
 font-family:Arial,sans-serif
}

button,input{font:inherit}

#app{
 position:relative;
 width:100%;
 height:100%;
 overflow:hidden
}

/* TOP */

#top{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:48px;

 display:flex;
 align-items:center;
 gap:4px;
 padding:4px;

 background:#181818;
 border-bottom:1px solid #303030;

 z-index:50;
 overflow-x:auto;
 white-space:nowrap
}

#title{
 font-size:10px;
 font-weight:bold;
 color:#eee;
 margin-right:3px
}

.tool{
 height:31px;
 padding:0 8px;

 border:1px solid #3b3b3b;
 border-radius:6px;

 background:#222;
 color:#bbb;

 font-size:9px;
 white-space:nowrap
}

.tool.active{
 background:#383838;
 border-color:#aaa;
 color:#fff
}

.tool input{
 width:40px;
 height:20px;

 background:#111;
 border:1px solid #333;

 color:#fff;

 text-align:center;
 font-size:9px;

 border-radius:3px
}

/* VIEW */

#view{
 position:absolute;
 top:48px;
 left:0;
 right:0;
 bottom:190px;

 overflow:hidden;
 background:#111
}

canvas{
 position:absolute;
 inset:0;

 width:100%;
 height:100%;

 display:block;

 touch-action:none
}

/* PARTS */

#parts{
 position:absolute;

 top:7px;
 right:6px;

 display:flex;
 flex-direction:column;
 gap:3px;

 z-index:20
}

.part{
 min-width:78px;

 padding:7px 8px;

 border:1px solid #393939;
 border-radius:6px;

 background:#202020;
 color:#aaa;

 font-size:9px;
 text-align:left
}

.part.active{
 background:#393939;
 border-color:#aaa;
 color:#fff
}

/* TIMELINE */

#timelinePanel{
 position:absolute;

 left:0;
 right:0;
 bottom:0;

 height:190px;

 background:#151515;

 border-top:1px solid #353535;

 z-index:40;

 overflow:hidden
}

#timelineScroll{
 position:absolute;

 left:0;
 right:0;
 top:0;
 bottom:47px;

 overflow-x:auto;
 overflow-y:hidden
}

#timelineInner{
 position:relative;

 min-width:100%;
 height:143px
}

#timeRuler{
 position:absolute;

 left:0;
 top:0;

 height:34px;

 background:#191919;

 border-bottom:1px solid #303030;

 touch-action:none
}

.tick{
 position:absolute;

 top:0;
 bottom:0;

 width:1px;

 background:#333
}

.tick.major{
 background:#666
}

.tick span{
 position:absolute;

 top:5px;
 left:4px;

 color:#aaa;

 font-size:8px;

 white-space:nowrap
}

/* TRACKS */

#tracks{
 position:absolute;

 left:0;
 right:0;
 top:34px;

 height:109px
}

.trackRow{
 position:relative;

 height:18px;

 border-bottom:1px solid #242424;

 background:#191919
}

.trackRow:nth-child(even){
 background:#161616
}

.trackName{
 position:absolute;

 left:5px;
 top:4px;

 color:#888;

 font-size:8px;

 z-index:3
}

.keyDot{
 position:absolute;

 width:9px;
 height:9px;

 margin-left:-4px;
 margin-top:-4px;

 top:9px;

 transform:rotate(45deg);

 background:#aaa;

 border:1px solid #ccc
}

.keyDot.selected{
 background:#fff
}

/* PLAYHEAD */

#playhead{
 position:absolute;

 top:0;
 bottom:0;

 width:2px;

 background:#fff;

 z-index:15;

 pointer-events:none
}

#playheadHandle{
 position:absolute;

 top:0;
 left:-5px;

 width:12px;
 height:9px;

 background:#fff;

 clip-path:polygon(
  0 0,
  100% 0,
  50% 100%
 )
}

/* END MARKER */

#endMarker{
 position:absolute;

 top:0;
 bottom:0;

 width:2px;

 background:#a66;

 z-index:12;

 touch-action:none
}

#endMarker::before{
 content:"]";

 position:absolute;

 top:-2px;
 left:-7px;

 color:#ddd;

 font-size:17px;

 font-weight:bold
}

/* CONTROLS */

#timelineControls{
 position:absolute;

 left:0;
 right:0;
 bottom:0;

 height:47px;

 display:flex;
 align-items:center;

 gap:4px;
 padding:4px;

 background:#171717;

 border-top:1px solid #292929;

 z-index:30
}

.control{
 height:32px;

 min-width:45px;

 border:1px solid #383838;
 border-radius:6px;

 background:#222;

 color:#bbb;

 font-size:9px
}

.control:active{
 background:#333
}

#timeReadout{
 min-width:76px;

 color:#ddd;

 font-size:10px;

 text-align:center
}

#loopBtn{
 min-width:52px
}

@media(max-width:600px){

 #top{
  gap:3px
 }

 .tool{
  padding:0 7px
 }

 #view{
  bottom:190px
 }
}
</style>
</head>

<div id="app">

<div id="top">

 <div id="title">

 <button

 <button

<div id="view">

  </button>

  </button>

  <button

   Right Arm
  </button>

  <button

   data-part="Left Leg">
   Left Leg
  </button>

  <button

<div id="timelinePanel">

  <button

  </button>

  </button>

 </div>

</div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>

/* ==========================================
   PART 1 SELESAI
   SCRIPT LANJUT DI PART 2
========================================== */
<script>

/* ==========================================
   MIZAXENGINE V6
   PART 2 — 3D + R6 + HANDLES
========================================== */

const view =
 document.getElementById("view");

const scene =
 new THREE.Scene();

scene.background =
 new THREE.Color(0x111111);


/* CAMERA */

const camera =
 new THREE.PerspectiveCamera(
  45,
  view.clientWidth /
  view.clientHeight,
  .01,
  100
 );

camera.position.set(
  5,
  3.5,
  7
);


/* RENDERER */

const renderer =
 new THREE.WebGLRenderer({
  antialias:true
 });

renderer.setPixelRatio(
 Math.min(
  window.devicePixelRatio,
  1.5
 )
);

renderer.setSize(
 view.clientWidth,
 view.clientHeight
);

view.appendChild(
 renderer.domElement
);


/* LIGHT */

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  1.4
 )
);

const sun =
 new THREE.DirectionalLight(
  0xffffff,
  1.2
 );

sun.position.set(
  4,8,6
 );

scene.add(sun);


/* ORBIT */

const orbit =
 new THREE.OrbitControls(
  camera,
  renderer.domElement
 );

orbit.enableDamping = true;
orbit.dampingFactor = .14;

orbit.rotateSpeed = .22;
orbit.zoomSpeed = .28;
orbit.panSpeed = .18;


/* ==========================================
   RIG
========================================== */

const rig =
 new THREE.Group();

rig.name = "R6";

scene.add(rig);

const parts = {};


/* MATERIAL */

const bodyMaterial =
 new THREE.MeshStandardMaterial({
  color:0x9d9d9d,
  roughness:.82,
  metalness:0
 });


/* ==========================================
   ROUNDED BLOCK
========================================== */

function roundedBlock(
 w,
 h,
 d,
 r=.07
){

 const shape =
  new THREE.Shape();

 const hw = w/2;
 const hh = h/2;

 shape.moveTo(
  -hw+r,
  -hh
 );

 shape.lineTo(
  hw-r,
  -hh
 );

 shape.quadraticCurveTo(
  hw,
  -hh,
  hw,
  -hh+r
 );

 shape.lineTo(
  hw,
  hh-r
 );

 shape.quadraticCurveTo(
  hw,
  hh,
  hw-r,
  hh
 );

 shape.lineTo(
  -hw+r,
  hh
 );

 shape.quadraticCurveTo(
  -hw,
  hh,
  -hw,
  hh-r
 );

 shape.lineTo(
  -hw,
  -hh+r
 );

 shape.quadraticCurveTo(
  -hw,
  -hh,
  -hw+r,
  -hh
 );


 const geo =
  new THREE.ExtrudeGeometry(
   shape,
   {
    depth:d,

    bevelEnabled:true,

    bevelSegments:3,

    bevelSize:r*.3,

    bevelThickness:r*.3,

    curveSegments:5
   }
  );

 geo.center();

 const mesh =
  new THREE.Mesh(
   geo,
   bodyMaterial
  );

 return mesh;
}


/* ==========================================
   ROUNDED CYLINDER HEAD
========================================== */

function makeHead(){

 const points=[];

 const height=1.35;
 const radius=.70;

 const segments=24;

 for(
  let i=0;
  i<=segments;
  i++
 ){

  const t=
   i/segments;

  const y=
   -height/2+
   t*height;

  const edge=
   Math.min(
    t,
    1-t
   );

  let r=
   radius;

  /*
    Rounded atas/bawah.
  */

  if(edge<.18){

   const f=
    edge/.18;

   r=
    radius*
    (
     .84+
     .16*
     Math.sin(
      f*Math.PI/2
     )
    );

  }

  points.push(
   new THREE.Vector2(
    r,
    y
   )
  );

 }


 const geo =
  new THREE.LatheGeometry(
   points,
   32
  );

 geo.computeVertexNormals();


 const mesh =
  new THREE.Mesh(
   geo,
   bodyMaterial
  );

 return mesh;
}


/* ==========================================
   CREATE BODY PART
========================================== */

function createPart(
 name,
 w,
 h,
 d
){

 const group =
  new THREE.Group();

 group.name =
  name;

 const mesh =
  roundedBlock(
   w,
   h,
   d
  );

 group.add(mesh);

 parts[name]=group;

 return group;
}


/* ==========================================
   TORSO
========================================== */

const torso =
 createPart(
  "Torso",
  2,
  2,
  1
 );

rig.add(torso);

torso.position.set(
 0,
 4,
 0
);


/* ==========================================
   ARMS
========================================== */

const leftArm =
 createPart(
  "Left Arm",
  1,
  2,
  1
 );

const rightArm =
 createPart(
  "Right Arm",
  1,
  2,
  1
 );

torso.add(leftArm);
torso.add(rightArm);

leftArm.position.set(
 -1.5,
 0,
 0
 );

rightArm.position.set(
 1.5,
 0,
 0
 );


/* ==========================================
   LEGS
========================================== */

const leftLeg =
 createPart(
  "Left Leg",
  1,
  2,
  1
 );

const rightLeg =
 createPart(
  "Right Leg",
  1,
  2,
  1
 );

torso.add(leftLeg);
torso.add(rightLeg);


/*
   KAKI RAPAT.

   Left:
   -1 → 0

   Right:
    0 → 1
*/

leftLeg.position.set(
 -.5,
 -2,
 0
 );

rightLeg.position.set(
 .5,
 -2,
 0
 );


/* ==========================================
   HEAD
========================================== */

const head =
 new THREE.Group();

head.name =
 "Head";

head.add(
 makeHead()
);

parts["Head"] =
 head;

torso.add(head);


/*
   Head diturunkan supaya
   benar-benar dekat dengan torso.
*/

head.position.set(
 0,
 1.66,
 0
 );


/* ==========================================
   PART STORAGE
========================================== */

parts["Torso"] = torso;
parts["Left Arm"] = leftArm;
parts["Right Arm"] = rightArm;
parts["Left Leg"] = leftLeg;
parts["Right Leg"] = rightLeg;


/* ==========================================
   GROUND
========================================== */

const grid =
 new THREE.GridHelper(
  12,
  24,
  0x444444,
  0x222222
 );

grid.position.y=0;

scene.add(grid);


/* CAMERA TARGET */

orbit.target.set(
 0,
 3,
 0
);

orbit.update();


/* ==========================================
   TRANSFORM HANDLES
========================================== */

let selected =
 head;

let gizmo =
 new THREE.TransformControls(
  camera,
  renderer.domElement
 );

scene.add(gizmo);

gizmo.attach(
 selected
);

gizmo.setMode(
 "translate"
);


/* ==========================================
   TRANSFORM SPACE
========================================== */

let transformSpace =
 "world";


document
 .getElementById("globalBtn")
 .onclick=()=>{

  transformSpace="world";

  gizmo.setSpace(
   "world"
  );

  setSpaceButtons();

 };


document
 .getElementById("localBtn")
 .onclick=()=>{

  transformSpace="local";

  gizmo.setSpace(
   "local"
  );

  setSpaceButtons();

 };


document
 .getElementById("parentBtn")
 .onclick=()=>{

  transformSpace="parent";

  /*
    TransformControls tidak punya
    mode "parent" langsung.

    Parent space disimulasikan
    menggunakan local transform.
  */

  gizmo.setSpace(
   "local"
  );

  setSpaceButtons();

 };


function setSpaceButtons(){

 document
  .getElementById("globalBtn")
  .classList.toggle(
   "active",
   transformSpace==="world"
  );

 document
  .getElementById("localBtn")
  .classList.toggle(
   "active",
   transformSpace==="local"
  );

 document
  .getElementById("parentBtn")
  .classList.toggle(
   "active",
   transformSpace==="parent"
  );

}


/* ==========================================
   MOVE / ROTATE
========================================== */

const moveBtn =
 document.getElementById(
  "moveBtn"
 );

const rotateBtn =
 document.getElementById(
  "rotateBtn"
 );


moveBtn.onclick=()=>{

 gizmo.setMode(
  "translate"
 );

 moveBtn.classList.add(
  "active"
 );

 rotateBtn.classList.remove(
  "active"
 );

 };


rotateBtn.onclick=()=>{

 gizmo.setMode(
  "rotate"
 );

 rotateBtn.classList.add(
  "active"
 );

 moveBtn.classList.remove(
  "active"
 );

 };


/* ==========================================
   AXIS LOCK
========================================== */

/*
   Saat jari mulai drag salah satu
   axis, axis itu dikunci.

   Jadi kalau awalnya Y,
   geser jari ke arah lain
   tidak tiba-tiba menjadi X/Z.
*/

let lockedAxis =
 null;


gizmo.addEventListener(
 "mouseDown",
 event=>{

  lockedAxis =
   gizmo.axis;

 });


gizmo.addEventListener(
 "mouseUp",
 ()=>{

  lockedAxis=null;

 });


/*
   Touch/drag detection tambahan.
*/

renderer.domElement
 .addEventListener(
  "pointerdown",
  ()=>{
   lockedAxis =
    gizmo.axis;
  }
 );


renderer.domElement
 .addEventListener(
  "pointerup",
  ()=>{
   lockedAxis=null;
  }
 );


/* ==========================================
   DRAGGING
========================================== */

let cameraLocked=false;


gizmo.addEventListener(
 "dragging-changed",
 event=>{

  if(
   !cameraLocked
  ){

   orbit.enabled =
    !event.value;

  }

 });


/* ==========================================
   CAMERA LOCK
========================================== */

const cameraButton =
 document.getElementById(
  "lockCamera"
 );


cameraButton.onclick=()=>{

 cameraLocked =
  !cameraLocked;

 orbit.enabled =
  !cameraLocked;

 if(cameraLocked){

  cameraButton.textContent =
   "🔒 CAMERA";

  cameraButton.classList.add(
   "active"
  );

 }else{

  cameraButton.textContent =
   "🔓 CAMERA";

  cameraButton.classList.remove(
   "active"
  );

 }

 };


/* ==========================================
   SELECT PART
========================================== */

document
 .querySelectorAll(".part")
 .forEach(button=>{

  button.onclick=()=>{

   const name =
    button.dataset.part;

   if(!parts[name])
    return;

   selected =
    parts[name];

   gizmo.attach(
    selected
   );


   document
    .querySelectorAll(".part")
    .forEach(
     x=>
      x.classList.remove(
       "active"
      )
    );


   button.classList.add(
    "active"
   );

  };

 });


/* ==========================================
   GIZMO SCALE
========================================== */

function updateGizmo(){

 const distance =
  camera.position.distanceTo(
   orbit.target
  );

 const size =
  THREE.MathUtils.clamp(
   distance*.11,
   .55,
   2.2
  );

 gizmo.setSize(
  size
  );

}


/* ==========================================
   ANIMATION STATE
========================================== */

let interpolation =
 "smooth";

let fps=30;

let currentTime=0;

let totalDuration=2;

let playing=false;

let loopPlayback=true;

let playbackRequest=null;

let lastPlayback=0;

const keyframes=[];


/* ==========================================
   CAPTURE POSE
========================================== */

function capturePose(){

 const pose={};

 Object.keys(parts)
 .forEach(name=>{

  const p =
   parts[name];

  pose[name]={

   position:[
    p.position.x,
    p.position.y,
    p.position.z
   ],

   rotation:[
    p.rotation.x,
    p.rotation.y,
    p.rotation.z
   ]

  };

 });

 return pose;

}


/* ==========================================
   APPLY POSE
========================================== */

function applyPose(
 pose
){

 if(!pose)
  return;


 Object.keys(pose)
 .forEach(name=>{

  const p =
   parts[name];

  const d =
   pose[name];

  if(!p||!d)
   return;


  p.position.set(
   d.position[0],
   d.position[1],
   d.position[2]
  );

  p.rotation.set(
   d.rotation[0],
   d.rotation[1],
   d.rotation[2]
  );

 });

}


/* ==========================================
   AUTO KEYFRAME
========================================== */

let lastPose =
 capturePose();


function poseChanged(){

 const now =
  capturePose();

 const old =
  lastPose;

 let changed=false;


 Object.keys(now)
 .forEach(name=>{

  if(changed)
   return;

  const a =
   now[name];

  const b =
   old[name];

  if(!b){

   changed=true;
   return;

  }


  for(
   let i=0;
   i<3;
   i++
  ){

   if(
    Math.abs(
     a.position[i]-
     b.position[i]
    )>.0001
   ){

    changed=true;
    return;

   }

   if(
    Math.abs(
     a.rotation[i]-
     b.rotation[i]
    )>.0001
   ){

    changed=true;
    return;

   }

  }

 });


 return {
  changed,
  pose:now
 };


}


/* ==========================================
   MAKE / UPDATE KEYFRAME
========================================== */

function autoKey(){

 const result =
  poseChanged();

 if(!result.changed)
  return;


 const existing =
  keyframes.find(
   k=>
    Math.abs(
     k.time-currentTime
    )<.0001
  );


 if(existing){

  existing.pose =
   result.pose;

 }else{

  keyframes.push({

   time:currentTime,

   pose:result.pose

  });

 }


 keyframes.sort(
  (a,b)=>
   a.time-b.time
 );


 lastPose =
  result.pose;


 if(
  currentTime>
  totalDuration
 ){

  totalDuration =
   currentTime;

 }


 rebuildTimeline();

}


/* ==========================================
   TRANSFORM CHANGE DETECTION
========================================== */

gizmo.addEventListener(
 "change",
 ()=>{

  if(
   playing
  )
   return;

  autoKey();

 });


/* ==========================================
   INITIAL KEYFRAME
========================================== */

keyframes.push({

 time:0,

 pose:capturePose()

});

lastPose =
 capturePose();
/* =========================
   PART 3 — TIMELINE + ANIMATION
========================= */

const timeline = document.getElementById("timeline");
const timelineInner = document.getElementById("timelineInner");
const ruler = document.getElementById("ruler");
const tracks = document.getElementById("tracks");
const playhead = document.getElementById("playhead");
const endMarker = document.getElementById("endMarker");
const timeReadout = document.getElementById("timeReadout");
const playBtn = document.getElementById("play");
const loopBtn = document.getElementById("loop");
const smoothBtn = document.getElementById("smooth");
const choppyBtn = document.getElementById("choppy");
const fpsInput = document.getElementById("fps");

let pixelsPerSecond = 120;
let draggingPlayhead = false;
let draggingEnd = false;

/* ---------- TIME ---------- */

function clamp(v, a, b){
  return Math.max(a, Math.min(b, v));
}

function setTime(t, rebuild=true){
  currentTime = clamp(t, 0, totalDuration);
  evaluate(currentTime);

  lastPose = capturePose();

  updateTimeline();

  if(rebuild) renderTimeline();
}

/* ---------- POSE INTERPOLATION ---------- */

const qa = new THREE.Quaternion();
const qb = new THREE.Quaternion();

function poseToQuat(rot, target){
  target.setFromEuler(
    new THREE.Euler(rot.x, rot.y, rot.z, "XYZ")
  );
  return target;
}

function applyInterpolatedPose(a, b, alpha){

  for(const name of Object.keys(parts)){

    const p = parts[name];

    const pa = a[name];
    const pb = b[name];

    p.position.set(
      THREE.MathUtils.lerp(pa.position.x, pb.position.x, alpha),
      THREE.MathUtils.lerp(pa.position.y, pb.position.y, alpha),
      THREE.MathUtils.lerp(pa.position.z, pb.position.z, alpha)
    );

    poseToQuat(pa.rotation, qa);
    poseToQuat(pb.rotation, qb);

    qa.slerp(qb, alpha);

    p.quaternion.copy(qa);
  }
}

/* ---------- EVALUATE ---------- */

function evaluate(time){

  if(!keyframes.length) return;

  if(keyframes.length === 1){
    applyPose(keyframes[0].pose);
    return;
  }

  let A = keyframes[0];
  let B = keyframes[keyframes.length - 1];

  for(let i=0;i<keyframes.length-1;i++){

    if(
      time >= keyframes[i].time &&
      time <= keyframes[i+1].time
    ){
      A = keyframes[i];
      B = keyframes[i+1];
      break;
    }
  }

  if(time <= A.time){
    applyPose(A.pose);
    return;
  }

  if(time >= B.time){
    applyPose(B.pose);
    return;
  }

  let alpha =
    (time - A.time) /
    Math.max(0.0001, B.time - A.time);

  if(interpolation === "choppy"){
    applyPose(A.pose);
    return;
  }

  /* SMOOTH */
  alpha = alpha * alpha * (3 - 2 * alpha);

  applyInterpolatedPose(
    A.pose,
    B.pose,
    alpha
  );
}

/* ---------- AUTO KEY ---------- */

function poseDifferent(a,b){

  if(!a || !b) return true;

  for(const name of Object.keys(parts)){

    const A = a[name];
    const B = b[name];

    if(!A || !B) return true;

    if(
      Math.abs(A.position.x-B.position.x) > 0.0001 ||
      Math.abs(A.position.y-B.position.y) > 0.0001 ||
      Math.abs(A.position.z-B.position.z) > 0.0001 ||
      Math.abs(A.rotation.x-B.rotation.x) > 0.0001 ||
      Math.abs(A.rotation.y-B.rotation.y) > 0.0001 ||
      Math.abs(A.rotation.z-B.rotation.z) > 0.0001
    ){
      return true;
    }
  }

  return false;
}

function autoKey(){

  const pose = capturePose();

  if(!poseDifferent(lastPose, pose)){
    return;
  }

  let existing = null;

  for(const k of keyframes){

    if(Math.abs(k.time-currentTime) < 0.035){
      existing = k;
      break;
    }
  }

  if(existing){
    existing.time = currentTime;
    existing.pose = pose;
  }else{

    keyframes.push({
      time: currentTime,
      pose: pose
    });

    keyframes.sort((a,b)=>a.time-b.time);
  }

  lastPose = pose;

  renderTimeline();
}

/* ---------- TRANSFORM AUTO KEY ---------- */

gizmo.addEventListener("change",()=>{

  if(playing) return;

  autoKey();
});

/* ---------- RULER ---------- */

function buildRuler(){

  ruler.innerHTML = "";

  const width =
    Math.max(
      timeline.clientWidth,
      totalDuration * pixelsPerSecond + 200
    );

  timelineInner.style.width = width + "px";

  for(
    let t=0;
    t<=totalDuration+0.001;
    t+=0.5
  ){

    const x = t * pixelsPerSecond;

    const mark = document.createElement("div");

    mark.className = "tick";
    mark.style.left = x + "px";

    mark.innerHTML =
      `<span>${t.toFixed(1)}s</span>`;

    ruler.appendChild(mark);
  }
}

/* ---------- TRACKS ---------- */

const trackNames = [
  "Head",
  "Torso",
  "Left Arm",
  "Right Arm",
  "Left Leg",
  "Right Leg"
];

function renderTimeline(){

  buildRuler();

  tracks.innerHTML = "";

  const width =
    Math.max(
      timeline.clientWidth,
      totalDuration * pixelsPerSecond + 200
    );

  timelineInner.style.width = width + "px";

  for(const name of trackNames){

    const row =
      document.createElement("div");

    row.className = "track";

    const label =
      document.createElement("div");

    label.className = "trackLabel";
    label.textContent = name;

    row.appendChild(label);

    const lane =
      document.createElement("div");

    lane.className = "trackLane";

    for(const k of keyframes){

      const diamond =
        document.createElement("div");

      diamond.className = "keyDiamond";

      diamond.style.left =
        (k.time * pixelsPerSecond) + "px";

      diamond.title =
        `${name} — ${k.time.toFixed(2)}s`;

      diamond.addEventListener("pointerdown",e=>{

        e.stopPropagation();

        setTime(k.time);

      });

      lane.appendChild(diamond);
    }

    row.appendChild(lane);
    tracks.appendChild(row);
  }

  updateTimeline();
}

/* ---------- PLAYHEAD ---------- */

function updateTimeline(){

  const x =
    currentTime * pixelsPerSecond;

  playhead.style.left =
    x + "px";

  endMarker.style.left =
    (totalDuration * pixelsPerSecond) + "px";

  timeReadout.textContent =
    currentTime.toFixed(2) +
    "s / " +
    totalDuration.toFixed(2) +
    "s";

  /* keep playhead visible */
  if(playing){

    const left =
      timeline.scrollLeft;

    const right =
      left + timeline.clientWidth;

    if(x > right - 80){
      timeline.scrollLeft =
        Math.max(0,x-timeline.clientWidth+120);
    }

    if(x < left+40){
      timeline.scrollLeft =
        Math.max(0,x-40);
    }
  }
}

/* ---------- CLICK TIMELINE ---------- */

timeline.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.target === endMarker ||
      endMarker.contains(e.target)
    ){
      return;
    }

    const rect =
      timelineInner.getBoundingClientRect();

    const x =
      e.clientX -
      rect.left +
      timeline.scrollLeft;

    setTime(
      x / pixelsPerSecond
    );

    draggingPlayhead = true;

    timeline.setPointerCapture?.(
      e.pointerId
    );
  }
);

timeline.addEventListener(
  "pointermove",
  e=>{

    if(!draggingPlayhead) return;

    const rect =
      timelineInner.getBoundingClientRect();

    const x =
      e.clientX -
      rect.left +
      timeline.scrollLeft;

    setTime(
      clamp(
        x / pixelsPerSecond,
        0,
        totalDuration
      )
    );
  }
);

timeline.addEventListener(
  "pointerup",
  ()=>{
    draggingPlayhead=false;
  }
);

timeline.addEventListener(
  "pointercancel",
  ()=>{
    draggingPlayhead=false;
  }
);

/* ---------- END MARKER ---------- */

endMarker.addEventListener(
  "pointerdown",
  e=>{

    e.stopPropagation();

    draggingEnd=true;

    endMarker.setPointerCapture?.(
      e.pointerId
    );
  }
);

endMarker.addEventListener(
  "pointermove",
  e=>{

    if(!draggingEnd) return;

    const rect =
      timelineInner.getBoundingClientRect();

    const x =
      e.clientX -
      rect.left +
      timeline.scrollLeft;

    let duration =
      x / pixelsPerSecond;

    duration =
      clamp(duration,0.25,50);

    totalDuration =
      duration;

    if(currentTime > totalDuration){
      currentTime =
        totalDuration;
    }

    renderTimeline();
  }
);

endMarker.addEventListener(
  "pointerup",
  ()=>{
    draggingEnd=false;
  }
);

endMarker.addEventListener(
  "pointercancel",
  ()=>{
    draggingEnd=false;
  }
);

/* ---------- INTERPOLATION BUTTONS ---------- */

smoothBtn.addEventListener("click",()=>{

  interpolation="smooth";

  smoothBtn.classList.add("active");
  choppyBtn.classList.remove("active");

  evaluate(currentTime);
});

choppyBtn.addEventListener("click",()=>{

  interpolation="choppy";

  choppyBtn.classList.add("active");
  smoothBtn.classList.remove("active");

  evaluate(currentTime);
});

/* ---------- LOOP ---------- */

loopBtn.addEventListener("click",()=>{

  loopPlayback =
    !loopPlayback;

  loopBtn.classList.toggle(
    "active",
    loopPlayback
  );
});

/* ---------- FPS ---------- */

fpsInput.addEventListener(
  "change",
  ()=>{

    fps =
      clamp(
        Number(fpsInput.value)||30,
        1,
        60
      );

    fpsInput.value=fps;
  }
);

/* ---------- PLAY ---------- */

function playAnimation(){

  if(totalDuration<=0) return;

  playing=true;

  playBtn.textContent="⏸";

  lastPlayback =
    performance.now();
}

function stopAnimation(){

  playing=false;

  playBtn.textContent="▶";

  evaluate(currentTime);

  lastPose =
    capturePose();
}

playBtn.addEventListener(
  "click",
  ()=>{

    if(playing){
      stopAnimation();
    }else{
      playAnimation();
    }
  }
);

/* ---------- PREV / NEXT ---------- */

document.getElementById("prev").addEventListener(
  "click",
  ()=>{

    let previous=0;

    for(const k of keyframes){

      if(k.time < currentTime-0.02){
        previous=k.time;
      }
    }

    setTime(previous);
  }
);

document.getElementById("next").addEventListener(
  "click",
  ()=>{

    for(const k of keyframes){

      if(k.time > currentTime+0.02){

        setTime(k.time);
        return;
      }
    }

    setTime(totalDuration);
  }
);

/* ---------- MANUAL KEY BUTTON NOT NEEDED ---------- */

const manualKey =
  document.getElementById("addKey");

if(manualKey){
  manualKey.style.opacity="0.35";
  manualKey.title=
    "Keyframe dibuat otomatis saat pose berubah";
}

/* ---------- CAMERA LOCK ---------- */

const cameraButton =
  document.getElementById("cameraLock");

if(cameraButton){

  cameraButton.addEventListener(
    "click",
    ()=>{

      cameraLocked =
        !cameraLocked;

      controls.enabled =
        !cameraLocked;

      cameraButton.textContent =
        cameraLocked
        ? "🔒 CAMERA"
        : "🔓 CAMERA";
    }
  );
}

/* ---------- REAL-TIME PLAYBACK ---------- */

function playbackUpdate(now){

  if(!playing){
    lastPlayback=now;
    return;
  }

  let delta =
    (now-lastPlayback)/1000;

  lastPlayback=now;

  /* prevent huge jumps after lag */
  delta =
    Math.min(delta,0.1);

  currentTime += delta;

  if(currentTime >= totalDuration){

    if(loopPlayback){

      currentTime =
        0;

    }else{

      currentTime =
        totalDuration;

      stopAnimation();
    }
  }

  evaluate(currentTime);

  updateTimeline();
}

/* ---------- RENDER LOOP ---------- */

function animate(now){

  requestAnimationFrame(animate);

  playbackUpdate(now);

  renderer.render(
    scene,
    camera
  );
}

requestAnimationFrame(animate);

/* ---------- RESIZE ---------- */

function resize(){

  const w =
    view.clientWidth;

  const h =
    view.clientHeight;

  if(!w || !h) return;

  camera.aspect =
    w/h;

  camera.updateProjectionMatrix();

  renderer.setSize(
    w,
    h,
    false
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();

/* ---------- INITIAL STATE ---------- */

smoothBtn.classList.add("active");
loopBtn.classList.add("active");

interpolation="smooth";
loopPlayback=true;

if(!keyframes.length){

  keyframes.push({
    time:0,
    pose:capturePose()
  });
}

lastPose =
  capturePose();

renderTimeline();

/* ---------- DEFAULT CAMERA ---------- */

camera.position.set(
  7,
  5,
  9
);

controls.target.set(
  0,
  2.8,
  0
);

controls.update();

/* ---------- FINISH ---------- */

console.log(
  "MizaxEngine Animator V6 loaded."
);

</script>
</body>
