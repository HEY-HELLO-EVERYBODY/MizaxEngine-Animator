<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MizaxEngine Animator V5</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#0e0e0e;
 color:#ddd;
 font-family:Arial,sans-serif;
}

#app{
 position:relative;
 width:100%;
 height:100%;
}

/* ================= TOP ================= */

#top{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:48px;
 display:flex;
 align-items:center;
 gap:4px;
 padding:4px 6px;
 background:#181818;
 border-bottom:1px solid #303030;
 z-index:50;
 overflow-x:auto;
}

#title{
 font-size:11px;
 font-weight:bold;
 color:#eee;
 white-space:nowrap;
 margin-right:3px;
}

.tool{
 height:30px;
 padding:0 8px;
 border:1px solid #3a3a3a;
 border-radius:5px;
 background:#222;
 color:#aaa;
 font-size:9px;
 white-space:nowrap;
 flex-shrink:0;
}

.tool.active{
 background:#383838;
 border-color:#aaa;
 color:#fff;
}

.tool select{
 height:20px;
 background:#111;
 color:#ddd;
 border:1px solid #444;
 font-size:9px;
}

/* ================= VIEW ================= */

#view{
 position:absolute;
 top:48px;
 left:0;
 right:0;
 bottom:185px;
 background:#111;
 overflow:hidden;
}

canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}

/* ================= PARTS ================= */

#parts{
 position:absolute;
 top:7px;
 right:6px;
 z-index:20;
 display:flex;
 flex-direction:column;
 gap:3px;
}

.part{
 min-width:82px;
 height:31px;
 padding:0 8px;
 border:1px solid #393939;
 border-radius:5px;
 background:#202020;
 color:#aaa;
 font-size:8px;
 text-align:left;
}

.part.active{
 background:#383838;
 border-color:#aaa;
 color:#fff;
}

/* ================= TIMELINE ================= */

#timelinePanel{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 height:185px;
 background:#151515;
 border-top:1px solid #363636;
 z-index:40;
}

/* PLAY BAR */

#playBar{
 height:38px;
 display:flex;
 align-items:center;
 gap:5px;
 padding:4px 6px;
 background:#181818;
 border-bottom:1px solid #303030;
}

.playButton{
 width:54px;
 height:28px;
 border:1px solid #555;
 border-radius:5px;
 background:#282828;
 color:#fff;
 font-size:10px;
}

.playButton:active{
 background:#444;
}

.smallButton{
 height:28px;
 min-width:48px;
 border:1px solid #383838;
 border-radius:5px;
 background:#222;
 color:#aaa;
 font-size:8px;
}

.smallButton.active{
 background:#383838;
 border-color:#aaa;
 color:#fff;
}

#timeReadout{
 min-width:78px;
 font-size:10px;
 color:#ddd;
 text-align:center;
}

#timelineScroll{
 position:absolute;
 top:38px;
 left:0;
 right:0;
 bottom:0;
 overflow-x:auto;
 overflow-y:hidden;
}

/* ruler */

#timeRuler{
 position:relative;
 height:32px;
 background:#191919;
 border-bottom:1px solid #303030;
}

.tick{
 position:absolute;
 top:0;
 bottom:0;
 width:1px;
 background:#303030;
 pointer-events:none;
}

.tick.major{
 background:#606060;
}

.tick span{
 position:absolute;
 left:5px;
 top:8px;
 color:#aaa;
 font-size:8px;
 white-space:nowrap;
}

/* END DURATION */

#durationHandle{
 position:absolute;
 top:0;
 width:16px;
 height:32px;
 margin-left:-8px;
 color:#fff;
 font-size:23px;
 line-height:29px;
 font-weight:bold;
 text-align:center;
 z-index:30;
 cursor:ew-resize;
 touch-action:none;
}

#durationHandle:after{
 content:"";
 position:absolute;
 top:0;
 left:7px;
 width:2px;
 height:150px;
 background:#7d35ff;
}

/* tracks */

#trackArea{
 position:relative;
 min-height:112px;
 background:#191919;
}

.trackRow{
 position:relative;
 height:17px;
 border-bottom:1px solid #252525;
}

.trackRow:nth-child(even){
 background:#202020;
}

.trackName{
 position:absolute;
 left:5px;
 top:4px;
 font-size:7px;
 color:#777;
 pointer-events:none;
 z-index:2;
}

.keyDot{
 position:absolute;
 width:9px;
 height:9px;
 margin-left:-4px;
 margin-top:-4px;
 top:8px;
 transform:rotate(45deg);
 background:#aaa;
 z-index:4;
}

.keyDot.current{
 background:#fff;
}

#playhead{
 position:absolute;
 top:0;
 bottom:0;
 width:1px;
 background:#fff;
 z-index:20;
 pointer-events:none;
}

#playheadHandle{
 position:absolute;
 top:0;
 left:-5px;
 width:11px;
 height:8px;
 background:#fff;
 clip-path:polygon(
  0 0,
  100% 0,
  50% 100%
 );
}

/* mobile */

@media(max-width:600px){

 #title{
  font-size:9px;
 }

 .tool{
  padding:0 6px;
 }

 #view{
  bottom:185px;
 }

}
</style>
</head>

<body>

<div id="app">

<!-- =================================================
 TOP
================================================= -->

<div id="top">

 <div id="title">
  MizaxEngine
 </div>

 <button id="moveBtn"
  class="tool active">

 </button>

 <button id="rotateBtn"

<div id="view">

<div id="timelinePanel">

 <div id="playBar">

  <button id="play"

  <button id="loopBtn"

 </div>


 <div id="timelineScroll">

  <div id="timeRuler">

   <div id="durationHandle">
    ]

  </div>

   <div id="playhead">
    <div id="playheadHandle"></div>

<!-- =================================================
 THREE
================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>


<script>

/* =====================================================
 MIZAXENGINE V5
===================================================== */

const view =
 document.getElementById("view");

const ruler =
 document.getElementById("timeRuler");

const track =
 document.getElementById("trackArea");

const scroll =
 document.getElementById("timelineScroll");

const playhead =
 document.getElementById("playhead");

const durationHandle =
 document.getElementById("durationHandle");

const readout =
 document.getElementById("timeReadout");


/* =====================================================
 SCENE
===================================================== */

const scene =
 new THREE.Scene();

scene.background =
 new THREE.Color(0x111111);


/* =====================================================
 CAMERA
===================================================== */

const camera =
 new THREE.PerspectiveCamera(
  38,
  view.clientWidth /
  view.clientHeight,
  .01,
  100
 );

camera.position.set(
 5.2,
 3.7,
 8.5
 );


/* =====================================================
 RENDERER
===================================================== */

const renderer =
 new THREE.WebGLRenderer({
  antialias:true
 });

renderer.setPixelRatio(
 Math.min(
  window.devicePixelRatio,
  1.5
 )
);

renderer.setSize(
 view.clientWidth,
 view.clientHeight
);

view.appendChild(
 renderer.domElement
);


/* =====================================================
 LIGHT
===================================================== */

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  1.55
 )
);

const light =
 new THREE.DirectionalLight(
  0xffffff,
  1.2
 );

light.position.set(
 4,8,6
 );

scene.add(light);


/* =====================================================
 ORBIT
===================================================== */

const orbit =
 new THREE.OrbitControls(
  camera,
  renderer.domElement
 );

orbit.enableDamping = true;
orbit.dampingFactor = .12;

orbit.rotateSpeed = .16;
orbit.zoomSpeed = .20;
orbit.panSpeed = .10;


/* =====================================================
 MATERIAL
===================================================== */

const material =
 new THREE.MeshStandardMaterial({
  color:0xb8b8b8,
  roughness:.82,
  metalness:0
 });


/* =====================================================
 R6 ROOT
===================================================== */

const rig =
 new THREE.Group();

scene.add(rig);

const parts = {};


/* =====================================================
 ROUNDED BLOCK
===================================================== */

function roundedBlock(
 w,h,d,r
){

 const shape =
  new THREE.Shape();

 const x=w/2;
 const y=h/2;

 const rr =
  Math.min(
   r,
   x,
   y
  );

 shape.moveTo(
  -x+rr,
  -y
 );

 shape.lineTo(
  x-rr,
  -y
 );

 shape.quadraticCurveTo(
  x,-y,
  x,-y+rr
 );

 shape.lineTo(
  x,y-rr
 );

 shape.quadraticCurveTo(
  x,y,
  x-rr,y
 );

 shape.lineTo(
  -x+rr,y
 );

 shape.quadraticCurveTo(
  -x,y,
  -x,y-rr
 );

 shape.lineTo(
  -x,-y+rr
 );

 shape.quadraticCurveTo(
  -x,-y,
  -x+rr,-y
 );

 const geo =
  new THREE.ExtrudeGeometry(
   shape,
   {
    depth:d,
    bevelEnabled:true,
    bevelSegments:3,
    bevelSize:r*.30,
    bevelThickness:r*.30,
    curveSegments:5
   }
  );

 geo.center();

 return new THREE.Mesh(
  geo,
  material
 );
}


/* =====================================================
 R6 PART
===================================================== */

function makePart(
 name,
 w,h,d
){

 const group =
  new THREE.Group();

 group.name =
  name;

 const mesh =
  roundedBlock(
   w,h,d,.08
  );

 group.add(mesh);

 parts[name]=group;

 return group;
}


/* =====================================================
 CREATE RIG
===================================================== */

/*
   Proporsi sengaja dibuat
   mendekati classic R6.

             HEAD
          ┌─────────┐
          │         │
          └─────────┘
       ┌───────────────┐
       │     TORSO     │
   ┌───┤               ├───┐
   │   └───────────────┘   │
   │                       │
   │       │       │       │
       LEG       LEG
*/


const torso =
 makePart(
  "Torso",
  2.0,
  2.0,
  .85
 );

rig.add(torso);


/* ARMS */

const leftArm =
 makePart(
  "Left Arm",
  .65,
  2.0,
  .75
 );

const rightArm =
 makePart(
  "Right Arm",
  .65,
  2.0,
  .75
 );


/* LEGS */

const leftLeg =
 makePart(
  "Left Leg",
  .72,
  2.0,
  .78
 );

const rightLeg =
 makePart(
  "Right Leg",
  .72,
  2.0,
  .78
 );


/* HEAD */

const head =
 makePart(
  "Head",
  1.42,
  1.30,
  1.35
 );


/* =====================================================
 HIERARCHY
===================================================== */

torso.add(head);
torso.add(leftArm);
torso.add(rightArm);
torso.add(leftLeg);
torso.add(rightLeg);


/*
   Torso center = 4

   Torso top = 5

   Head height = 1.30

   Head bottom =
   5

   Jadi nempel tepat.
*/

head.position.set(
 0,
 1.65,
 0
);


/*
   Torso half width = 1

   Arm half width = .325

   Center = 1.325

   Inner edge =
   1.325-.325 = 1

   Tepat dengan torso.
*/

leftArm.position.set(
 -1.325,
 0,
 0
 );

rightArm.position.set(
 1.325,
 0,
 0
 );


/* LEGS */

leftLeg.position.set(
 -.5,
 -2,
 0
 );

rightLeg.position.set(
 .5,
 -2,
 0
 );


/* =====================================================
 FACE
===================================================== */

function addFace(){

 const face =
  new THREE.Group();

 const eyeMat =
  new THREE.MeshBasicMaterial({
   color:0x151515
  });

 const eyeGeo =
  new THREE.SphereGeometry(
   .075,
   12,
   8
  );

 const e1 =
  new THREE.Mesh(
   eyeGeo,
   eyeMat
  );

 const e2 =
  new THREE.Mesh(
   eyeGeo,
   eyeMat
  );

 e1.position.set(
  -.22,
  .16,
  .66
 );

 e2.position.set(
  .22,
  .16,
  .66
 );

 face.add(e1,e2);

 head.add(face);

}

addFace();


/* =====================================================
 GROUND
===================================================== */

const grid =
 new THREE.GridHelper(
  12,
  24,
  0x444444,
  0x222222
 );

scene.add(grid);


/* =====================================================
 CAMERA TARGET
===================================================== */

orbit.target.set(
 0,
 3.2,
 0
 );

orbit.update();


/* =====================================================
 TRANSFORM CONTROLS
===================================================== */

let selected =
 head;

const gizmo =
 new THREE.TransformControls(
  camera,
  renderer.domElement
 );

gizmo.setMode(
 "translate"
 );

gizmo.setSpace(
 "world"
 );

gizmo.setSize(
 1
 );

scene.add(gizmo);

gizmo.attach(
 selected
 );


/* =====================================================
 TRANSFORM SPACE
===================================================== */

const spaces = [
 "world",
 "local",
 "parent"
];

let spaceIndex=0;

const spaceButton =
 document.getElementById(
  "spaceBtn"
 );


function updateSpace(){

 const mode =
  spaces[
   spaceIndex
  ];

 gizmo.setSpace(
  mode==="world"
   ? "world"
   : mode==="local"
 );

 spaceButton.textContent =
  mode.toUpperCase();

}


/*
   TransformControls sendiri
   hanya punya world/local.
   Parent kita buat sebagai
   parent-relative fallback.
*/

spaceButton.onclick =
 ()=>{

  spaceIndex++;

  if(
   spaceIndex>=spaces.length
  )
   spaceIndex=0;

  updateSpace();

 };


updateSpace();


/* =====================================================
 CAMERA LOCK
===================================================== */

let cameraLocked=false;

document.getElementById(
 "lockCamera"
).onclick =
 ()=>{

  cameraLocked =
   !cameraLocked;

  orbit.enabled =
   !cameraLocked;

  const b =
   document.getElementById(
    "lockCamera"
   );

  b.textContent =
   cameraLocked
    ? "🔒 CAMERA"
    : "🔓 CAMERA";

  b.classList.toggle(
   "active",
   cameraLocked
  );

 };


/* =====================================================
 SELECT PART
===================================================== */

document
.querySelectorAll(".part")
.forEach(
 button=>{

  button.onclick =
   ()=>{

    selected =
     parts[
      button.dataset.part
     ];

    gizmo.attach(
     selected
    );

    document
    .querySelectorAll(".part")
    .forEach(
     x=>
      x.classList.remove(
       "active"
      )
    );

    button.classList.add(
     "active"
    );

   };

 });


/* =====================================================
 MOVE / ROTATE
===================================================== */

const moveBtn =
 document.getElementById(
  "moveBtn"
 );

const rotateBtn =
 document.getElementById(
  "rotateBtn"
 );


moveBtn.onclick =
 ()=>{

  gizmo.setMode(
   "translate"
  );

  moveBtn.classList.add(
   "active"
  );

  rotateBtn.classList.remove(
   "active"
  );

 };


rotateBtn.onclick =
 ()=>{

  gizmo.setMode(
   "rotate"
  );

  rotateBtn.classList.add(
   "active"
  );

  moveBtn.classList.remove(
   "active"
  );

 };


/* =====================================================
 AXIS LOCK DURING DRAG
===================================================== */

/*
   TIDAK ADA tombol X/Y/Z.

   Saat jari pertama menyentuh
   ring/handle Y:

        Y LOCKED

   Selama drag berlangsung,
   axis tidak boleh berganti.

   Jadi kalau jari melewati
   area Z, transform tetap Y.
*/

let lockedAxis =
 null;


gizmo.addEventListener(
 "mouseDown",
 ()=>{
  lockedAxis =
   gizmo.axis;
 }
);


gizmo.addEventListener(
 "mouseUp",
 ()=>{
  lockedAxis =
   null;
 }
);


/*
   TransformControls memilih axis
   ketika pointer pertama kali
   mengenai handle.

   objectChange hanya membaca
   transform yang sedang aktif.
*/


/* =====================================================
 GIZMO DRAG
===================================================== */

gizmo.addEventListener(
 "dragging-changed",
 e=>{

  if(!cameraLocked)
   orbit.enabled =
    !e.value;

 }
);


/* =====================================================
 GIZMO SCALE
===================================================== */

function updateGizmoScale(){

 const distance =
  camera.position.distanceTo(
   orbit.target
  );

 gizmo.setSize(
  THREE.MathUtils.clamp(
   distance*.12,
   .55,
   2.3
  )
 );

}


/* =====================================================
 ANIMATION
===================================================== */

let interpolation =
 "smooth";

let fps=30;

let currentTime=0;

let totalDuration=2;

let playing=false;

let loopPlayback=false;

let timer=null;

const keyframes=[];


/* =====================================================
 CAPTURE
===================================================== */

function capturePose(){

 const pose={};

 Object.keys(parts)
 .forEach(
  name=>{

   const p =
    parts[name];

   pose[name]={
    position:[
     p.position.x,
     p.position.y,
     p.position.z
    ],
    rotation:[
     p.rotation.x,
     p.rotation.y,
     p.rotation.z
    ]
   };

  }
 );

 return pose;

}


/* =====================================================
 APPLY
===================================================== */

function applyPose(
 pose
){

 if(!pose)return;

 Object.keys(pose)
 .forEach(
  name=>{

   const p =
    parts[name];

   if(!p)return;

   const d =
    pose[name];

   p.position.set(
    ...d.position
   );

   p.rotation.set(
    ...d.rotation
   );

  }
 );

}


/* =====================================================
 AUTO KEY
===================================================== */

function autoKeyframe(){

 if(playing)
  return;

 const old =
  keyframes.find(
   k=>
    Math.abs(
     k.time-currentTime
    )<0.00001
  );

 if(old){

  old.pose =
   capturePose();

 }else{

  keyframes.push({
   time:currentTime,
   pose:capturePose()
  });

 }

 keyframes.sort(
  (a,b)=>
   a.time-b.time
 );

 rebuildTimeline();

}


gizmo.addEventListener(
 "objectChange",
 autoKeyframe
);


/* INITIAL KEY */

keyframes.push({
 time:0,
 pose:capturePose()
});


/* =====================================================
 SURROUNDING
===================================================== */

function surrounding(
 time
){

 let A=null;
 let B=null;

 for(
  const k of keyframes
 ){

  if(k.time<=time)
   A=k;

  if(k.time>=time){

   B=k;
   break;

  }

 }

 if(!A)
  A=keyframes[0];

 if(!B)
  B=
   keyframes[
    keyframes.length-1
   ];

 return {A,B};

}


/* =====================================================
 EVALUATE
===================================================== */

function evaluate(
 time
){

 if(!keyframes.length)
  return;

 const {
  A,B
 } =
 surrounding(time);

 if(A===B){

  applyPose(
   A.pose
  );

  return;

 }

 if(
  interpolation===
  "choppy"
 ){

  applyPose(
   A.pose
  );

  return;

 }

 let alpha =
  (time-A.time)/
  (B.time-A.time);

 alpha =
  THREE.MathUtils.clamp(
   alpha,
   0,
   1
  );

 /*
   Smooth.
 */

 alpha =
  alpha*alpha*
  (3-2*alpha);

 Object.keys(parts)
 .forEach(
  name=>{

   const p =
    parts[name];

   const a =
    A.pose[name];

   const b =
    B.pose[name];

   if(!a||!b)
    return;

   for(
    let i=0;
    i<3;
    i++
   ){

    p.position.setComponent(
     i,
     THREE.MathUtils.lerp(
      a.position[i],
      b.position[i],
      alpha
     )
    );

    p.rotation.setComponent(
     i,
     THREE.MathUtils.lerp(
      a.rotation[i],
      b.rotation[i],
      alpha
     )
    );

   }

  }
 );

}


/* =====================================================
 TIME
===================================================== */

function formatTime(
 sec
){

 const m =
  Math.floor(
   sec/60
  );

 const s =
  sec%60;

 return(
  String(m)
   .padStart(2,"0")
  +":"+
  s.toFixed(2)
   .padStart(5,"0")
 );

}


/* =====================================================
 TIMELINE WIDTH
===================================================== */

const PPS=75;


function width(){

 return Math.max(
  scroll.clientWidth,
  totalDuration*
  PPS+
  100
 );

}


/* =====================================================
 BUILD TIMELINE
===================================================== */

function rebuildTimeline(){

 ruler.innerHTML="";
 track.innerHTML="";

 const w =
  width();

 ruler.style.width =
  w+"px";

 track.style.width =
  w+"px";


 /*
   Hanya label setiap 1 detik.
   Tick kecil tiap .25.
 */

 for(
  let t=0;
  t<=totalDuration+.001;
  t+=.25
 ){

  const tick =
   document.createElement(
    "div"
   );

  tick.className =
   "tick";

  if(
   Math.abs(
    t-Math.round(t)
   )<.001
  ){

   tick.classList.add(
    "major"
   );

   const label =
    document.createElement(
     "span"
    );

   label.textContent =
    formatTime(t);

   tick.appendChild(
    label
   );

  }

  tick.style.left =
   (
    t*PPS
   )+"px";

  ruler.appendChild(
   tick
  );

 }


 ruler.appendChild(
  durationHandle
 );

 durationHandle.style.left =
  (
   totalDuration*PPS
  )+"px";


 const names=[
  "Head",
  "Torso",
  "Left Arm",
  "Right Arm",
  "Left Leg",
  "Right Leg"
 ];


 names.forEach(
  name=>{

   const row =
    document.createElement(
     "div"
    );

   row.className =
    "trackRow";

   const label =
    document.createElement(
     "div"
    );

   label.className =
    "trackName";

   label.textContent =
    name;

   row.appendChild(
    label
   );


   keyframes.forEach(
    k=>{

     const dot =
      document.createElement(
       "div"
      );

     dot.className =
      "keyDot";

     if(
      Math.abs(
       k.time-currentTime
      )<.0001
     ){

      dot.classList.add(
       "current"
      );

     }

     dot.style.left =
      (
       k.time*PPS
      )+"px";

     dot.onclick =
      e=>{

       e.stopPropagation();

       currentTime =
        k.time;

       evaluate(
        currentTime
       );

       rebuildTimeline();

      };

     row.appendChild(
      dot
     );

    }
   );

   track.appendChild(
    row
   );

  }
 );


 track.appendChild(
  playhead
 );

 updateTimeline();

}


/* =====================================================
 UPDATE TIMELINE
===================================================== */

function updateTimeline(){

 playhead.style.left =
  (
   currentTime*PPS
  )+"px";

 readout.textContent =
  formatTime(
   currentTime
  );

}


/* =====================================================
 DURATION DRAG
===================================================== */

let durationDragging=false;


durationHandle.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  durationDragging=true;

  durationHandle.setPointerCapture(
   e.pointerId
  );

 }
);


durationHandle.addEventListener(
 "pointermove",
 e=>{

  if(!durationDragging)
   return;

  const rect =
   scroll.getBoundingClientRect();

  let x =
   e.clientX-
   rect.left+
   scroll.scrollLeft;

  let t =
   x/PPS;

  t =
   THREE.MathUtils.clamp(
    t,
    .05,
    50
   );

  totalDuration=t;

  if(
   currentTime>
   totalDuration
  )
   currentTime=
    totalDuration;

  document.getElementById(
   "durationInput"
  ).value=
   t.toFixed(2);

  updateTimeline();

 }
);


durationHandle.addEventListener(
 "pointerup",
 e=>{

  durationDragging=false;

  try{
   durationHandle.releasePointerCapture(
    e.pointerId
   );
  }catch(err){}

  rebuildTimeline();

 }
);


/* =====================================================
 DURATION INPUT
===================================================== */

document.getElementById(
 "durationInput"
).onchange =
 e=>{

  totalDuration =
   THREE.MathUtils.clamp(
    Number(e.target.value)||2,
    .05,
    50
   );

  e.target.value =
   totalDuration;

  currentTime =
   Math.min(
    currentTime,
    totalDuration
   );

  rebuildTimeline();

 };


/* =====================================================
 RULER SEEK
===================================================== */

ruler.addEventListener(
 "pointerdown",
 e=>{

  if(
   e.target===
   durationHandle
  )
   return;

  const rect =
   scroll.getBoundingClientRect();

  const x =
   e.clientX-
   rect.left+
   scroll.scrollLeft;

  currentTime =
   THREE.MathUtils.clamp(
    x/PPS,
    0,
    totalDuration
   );

  evaluate(
   currentTime
  );

  rebuildTimeline();

 }
);

/* =====================================================
 LOOP / ONCE
===================================================== */

const loopBtn =
 document.getElementById(
  "loopBtn"
 );

const onceBtn =
 document.getElementById(
  "onceBtn"
 );


loopBtn.onclick =
 ()=>{

  loopPlayback=true;

  loopBtn.classList.add(
   "active"
  );

  onceBtn.classList.remove(
   "active"
  );

 };


onceBtn.onclick =

/* =====================================================
 PLAY
===================================================== */

function stop(){

 playing=false;

 if(timer)
  cancelAnimationFrame(
   timer
  );

 timer=null;

 document.getElementById(
  "play"
 ).textContent=
  "▶ PLAY";

 }


function play(){

 if(playing){

  stop();
  return;

 }

 if(keyframes.length<2)
  return;

 playing=true;

 document.getElementById(
  "play"
 ).textContent=
  "■ STOP";

 let last =
  performance.now();


 function frame(now){

  if(!playing)
   return;

  const dt =
   (now-last)/1000;

  last=now;

  currentTime += dt;

  if(
   currentTime>=
   totalDuration
  ){

   if(loopPlayback){

    currentTime=0;

   }else{

    currentTime=
     totalDuration;

    evaluate(
     currentTime
    );

    updateTimeline();

    stop();

    return;

   }

  }

  evaluate(
   currentTime
  );

  updateTimeline();

  timer =
   requestAnimationFrame(
    frame
   );

 }


 timer =
  requestAnimationFrame(
   frame
  );

 }


document.getElementById(
 "play"
).onclick=
 play;


/* =====================================================
 PREV / NEXT
===================================================== */

document.getElementById(
 "prev"
).onclick =
 ()=>{

  stop();

  currentTime =
   Math.max(
    0,
    currentTime-
    1/fps
   );

  evaluate(
   currentTime
  );

  rebuildTimeline();

 };


document.getElementById(
 "next"
).onclick =
 ()=>{

  stop();

  currentTime =
   Math.min(
    totalDuration,
    currentTime+
    1/fps
   );

  evaluate(
   currentTime
  );

  rebuildTimeline();

 };


/* =====================================================
 RESIZE
===================================================== */

function resize(){

 const w =
  view.clientWidth;

 const h =
  view.clientHeight;

 if(!w||!h)
  return;

 camera.aspect =
  w/h;

 camera.updateProjectionMatrix();

 renderer.setSize(
  w,
  h,
  false
 );

 rebuildTimeline();

 }


window.addEventListener(
 "resize",
 resize
);


/* =====================================================
 START
===================================================== */

resize();

rebuildTimeline();


/* =====================================================
 LOOP
===================================================== */

function animate(){

 requestAnimationFrame(
  animate
 );

 orbit.update();

 updateGizmoScale();

 renderer.render(
  scene,
  camera
 );

}

animate();
