<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MizaxEngine Animator Roblox Style</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#0f0f0f;
 color:#ddd;
 font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

button{
 background:rgba(40,40,40,0.6);
 color:#ccc;
 border:1px solid rgba(255,255,255,0.15);
 border-radius:4px;
 padding:6px 10px;
 font-size:11px;
 white-space:nowrap;
 cursor:pointer;
 backdrop-filter:blur(6px);
}

button:active{background:rgba(80,80,80,0.8)}
button.active{
 background:rgba(180,20,20,0.7);
 border-color:rgba(255,80,80,0.5);
 color:#fff;
}

#viewports{
 position:absolute;
 inset:0;
 z-index:1;
}

#viewports canvas{
 display:block;
 width:100%;
 height:100%;
}

/* TOP BAR TRANSPARAN ALA ROBLOX STUDIO */
#topbar{
 position:absolute;
 top:8px;
 left:8px;
 right:8px;
 height:44px;
 background:rgba(20,20,20,0.5);
 backdrop-filter:blur(8px);
 border:1px solid rgba(255,255,255,0.1);
 border-radius:6px;
 z-index:20;
 display:flex;
 align-items:center;
 gap:4px;
 padding:0 8px;
 overflow-x:auto;
}

.logo{
 color:#ff3333;
 font-weight:bold;
 font-size:12px;
 margin:0 8px 0 2px;
 white-space:nowrap;
 letter-spacing:1px;
}

#playBtn{
 min-width:54px;
}

#duration, #fps{
 width:48px;
 background:rgba(15,15,15,0.6);
 color:#fff;
 border:1px solid rgba(255,255,255,0.15);
 border-radius:4px;
 padding:5px 4px;
 font-size:11px;
 text-align:center;
}

/* PANEL RIG / HIERARCHY (TRANSARAN 0.5) */
#rigPanel{
 position:absolute;
 top:60px;
 left:8px;
 width:185px;
 max-height:42vh;
 background:rgba(20,20,20,0.5);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,0.1);
 border-radius:6px;
 z-index:15;
 overflow:hidden;
 box-shadow:0 8px 32px rgba(0,0,0,0.4);
}

.panelTitle{
 height:28px;
 display:flex;
 align-items:center;
 padding:0 8px;
 color:#ff4d4d;
 font-size:10px;
 font-weight:bold;
 border-bottom:1px solid rgba(255,255,255,0.08);
 background:rgba(25,25,25,0.3);
}

.tree{
 overflow:auto;
 max-height:calc(42vh - 28px);
}

.treeRow{
 height:26px;
 display:flex;
 align-items:center;
 padding-left:8px;
 font-size:11px;
 border-bottom:1px solid rgba(255,255,255,0.04);
 cursor:pointer;
 color:#ccc;
}

.treeRow:active,
.treeRow.selected{
 background:rgba(180,20,20,0.6);
 color:#fff;
}

.treeArrow{
 color:#888;
 width:14px;
}

/* PANEL INFO TRANSFORM */
#info{
 position:absolute;
 top:calc(60px + 42vh + 6px);
 left:8px;
 width:185px;
 background:rgba(20,20,20,0.5);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,0.1);
 border-radius:6px;
 z-index:15;
 padding:8px;
 font:10px monospace;
 line-height:1.55;
 box-shadow:0 8px 32px rgba(0,0,0,0.4);
 color:#bbb;
}

/* TIMELINE BAWAH */
#timeline{
 position:absolute;
 left:8px;
 right:8px;
 bottom:8px;
 height:230px;
 min-height:80px;
 background:rgba(16,16,16,0.6);
 backdrop-filter:blur(12px);
 border:1px solid rgba(255,255,255,0.12);
 border-radius:8px;
 z-index:30;
 display:flex;
 flex-direction:column;
 box-shadow:0 10px 40px rgba(0,0,0,0.5);
 overflow:hidden;
}

#timelineHandle{
 height:8px;
 flex:none;
 background:rgba(30,30,30,0.4);
 cursor:ns-resize;
 position:relative;
}

#timelineHandle:after{
 content:"";
 position:absolute;
 width:30px;
 height:2px;
 background:rgba(255,255,255,0.3);
 left:50%;
 top:3px;
 transform:translateX(-50%);
 border-radius:2px;
}

#timeControls{
 height:36px;
 flex:none;
 display:flex;
 align-items:center;
 gap:4px;
 padding:4px 8px;
 border-bottom:1px solid rgba(255,255,255,0.08);
 overflow-x:auto;
 background:rgba(20,20,20,0.2);
}

#timeReadout{
 color:#ddd;
 font:10px monospace;
 min-width:70px;
 text-align:center;
}

#timelineBody{
 flex:1;
 min-height:0;
 display:flex;
 overflow:hidden;
}

#labels{
 width:125px;
 min-width:125px;
 background:rgba(15,15,15,0.4);
 border-right:1px solid rgba(255,255,255,0.08);
 overflow:hidden;
}

.labelHead{
 height:26px;
 border-bottom:1px solid rgba(255,255,255,0.08);
 display:flex;
 align-items:center;
 padding-left:8px;
 color:#888;
 font-size:9px;
}

.label{
 height:32px;
 display:flex;
 align-items:center;
 padding-left:8px;
 border-bottom:1px solid rgba(255,255,255,0.04);
 font-size:10px;
 white-space:nowrap;
 overflow:hidden;
 color:#ccc;
}

#trackViewport{
 flex:1;
 min-width:0;
 overflow:auto;
 position:relative;
}

#trackInner{
 position:relative;
 min-width:800px;
 height:100%;
}

#ruler{
 height:26px;
 position:relative;
 border-bottom:1px solid rgba(255,255,255,0.08);
 background:rgba(20,20,20,0.3);
}

.tick{
 position:absolute;
 top:0;
 height:26px;
 border-left:1px solid rgba(255,255,255,0.1);
 color:#888;
 font:9px monospace;
 padding:3px 0 0 3px;
}

.tick.major{
 border-color:rgba(255,255,255,0.25);
 color:#ccc;
}

#tracks{
 position:absolute;
 top:26px;
 left:0;
 right:0;
}

.track{
 height:32px;
 position:relative;
 border-bottom:1px solid rgba(255,255,255,0.04);
}

.snapLine{
 position:absolute;
 top:0;
 bottom:0;
 width:1px;
 background:rgba(255,255,255,0.03);
 pointer-events:none;
}

.kf{
 position:absolute;
 top:9px;
 width:10px;
 height:10px;
 background:#888;
 border:1px solid #ccc;
 transform:rotate(45deg);
 margin-left:-5px;
 cursor:pointer;
 z-index:5;
}

.kf.selected{
 background:#ff3333;
 border-color:#ff9999;
 box-shadow:0 0 6px #ff3333;
}

#playhead{
 position:absolute;
 top:0;
 bottom:0;
 width:2px;
 background:#ff3333;
 z-index:20;
 pointer-events:none;
}

#playheadHead{
 position:absolute;
 top:0;
 left:-4px;
 width:10px;
 height:10px;
 background:#ff3333;
 clip-path:polygon(0 0,100% 0,50% 100%);
}

#contextMenu{
 position:fixed;
 display:none;
 z-index:100;
 background:rgba(20,20,20,0.85);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,0.2);
 border-radius:6px;
 width:140px;
 box-shadow:0 8px 24px rgba(0,0,0,0.5);
 overflow:hidden;
}

.ctxTitle{
 padding:6px 8px;
 color:#ff4d4d;
 font-size:9px;
 border-bottom:1px solid rgba(255,255,255,0.1);
 font-weight:bold;
}

.ctxBtn{
 width:100%;
 border:0;
 border-bottom:1px solid rgba(255,255,255,0.05);
 text-align:left;
 padding:8px;
 background:transparent;
 color:#ddd;
 font-size:10px;
 cursor:pointer;
}

.ctxBtn:active{
 background:rgba(180,20,20,0.6);
}

#toast{
 position:absolute;
 left:50%;
 bottom:250px;
 transform:translateX(-50%);
 background:rgba(20,20,20,0.85);
 backdrop-filter:blur(8px);
 border:1px solid rgba(255,51,51,0.5);
 border-radius:4px;
 padding:6px 10px;
 font-size:10px;
 z-index:100;
 display:none;
 color:#fff;
}
</style>
</head>

<body>

<div id="viewports"></div>

<div id="topbar">
 <div class="logo">MIZAX</div>
 <button id="rewind">⏮</button>
 <button id="prev">◀</button>
 <button id="playBtn">▶ PLAY</button>
 <button id="next">▶</button>
 <button id="loop" class="active">LOOP</button>
 <button id="copyBtn">COPY</button>
 <button id="pasteBtn">PASTE</button>
 <button id="newBtn">NEW</button>
 <span style="font-size:9px;color:#777;margin-left:4px;">DUR</span>
 <input id="duration" type="number" value="2" min="0.25" step="0.25">
 <span style="font-size:9px;color:#777">FPS</span>
 <input id="fps" type="number" value="30" min="1" max="120">
</div>

<div id="rigPanel">
 <div class="panelTitle">EXPLORER (RIG)</div>
 <div class="tree" id="tree"></div>
</div>

<div id="info">Select a part...</div>

<div id="timeline">
 <div id="timelineHandle"></div>
 <div id="timeControls">
  <button id="zoomOut">−</button>
  <button id="zoomIn">+</button>
  <button id="addKf">KEYFRAME</button>
  <span id="timeReadout">0.00 / 2.00</span>
 </div>
 <div id="timelineBody">
  <div id="labels">
   <div class="labelHead">PARTS</div>
   <div id="labelRows"></div>
  </div>
  <div id="trackViewport">
   <div id="trackInner">
    <div id="ruler"></div>
    <div id="tracks"></div>
    <div id="playhead">
     <div id="playheadHead"></div>
    </div>
   </div>
  </div>
 </div>
</div>

<div id="contextMenu">
 <div class="ctxTitle">KEYFRAME</div>
 <button class="ctxBtn" id="ctxDuplicate">Duplicate</button>
 <button class="ctxBtn" id="ctxDelete">Delete</button>
 <button class="ctxBtn" id="ctxType">Type: Pose</button>
</div>

<div id="toast"></div>

<!-- THREE.JS & CONTROLS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>
let scene, camera, renderer;
let orbitControls, transformControls;
let r6Rig = {};
let pivots = {};
let selectedPart = null;

let duration = 2;
let fps = 30;
let currentTime = 0;
let playing = false;
let loop = true;
let timelineZoom = 100;

let keyframes = [];
let selectedKF = null;
let clipboard = null;

const parts = ["Torso", "Head", "Left Arm", "Right Arm", "Left Leg", "Right Leg"];
const $ = id => document.getElementById(id);

function init(){
 scene = new THREE.Scene();
 scene.background = new THREE.Color(0x141414);

 camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
 camera.position.set(7, 5, 9);

 renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
 renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
 renderer.setSize(innerWidth, innerHeight);
 renderer.shadowMap.enabled = true;
 renderer.shadowMap.type = THREE.PCFSoftShadowMap;

 $("viewports").appendChild(renderer.domElement);

 orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
 orbitControls.enableDamping = true;
 orbitControls.dampingFactor = 0.06;
 orbitControls.target.set(0, 1.5, 0);
 orbitControls.minDistance = 3;
 orbitControls.maxDistance = 20;

 transformControls = new THREE.TransformControls(camera, renderer.domElement);
 transformControls.setSize(0.75);
 scene.add(transformControls);

 transformControls.addEventListener("dragging-changed", e => orbitControls.enabled = !e.value);
 transformControls.addEventListener("change", () => updateInfo());

 scene.add(new THREE.AmbientLight(0xffffff, 0.72));
 const light = new THREE.DirectionalLight(0xffffff, 0.85);
 light.position.set(5, 10, 7);
 light.castShadow = true;
 scene.add(light);

 const grid = new THREE.GridHelper(20, 20, 0x333333, 0x1c1c1c);
 grid.position.y = -2;
 scene.add(grid);

 buildR6Rig();
 setupUI();
 buildTimeline();

 window.addEventListener("resize", resize);
 animate();
 animatePlayback();
}

function roundedBox(w, h, d, r){
 const s = new THREE.Shape();
 const x = -w / 2, y = -h / 2;
 const rr = Math.min(r, w / 2, h / 2);
 s.moveTo(x + rr, y);
 s.lineTo(x + w - rr, y);
 s.quadraticCurveTo(x + w, y, x + w, y + rr);
 s.lineTo(x + w, y + h - rr);
 s.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
 s.lineTo(x + rr, y + h);
 s.quadraticCurveTo(x, y + h, x, y + h - rr);
 s.lineTo(x, y + rr);
 s.quadraticCurveTo(x, y, x + rr, y);

 const g = new THREE.ExtrudeGeometry(s, {
  depth: d, bevelEnabled: true, bevelSegments: 2,
  bevelSize: r * 0.35, bevelThickness: r * 0.35, curveSegments: 4
 });
 g.center();
 return g;
}

function faceTexture(){
 const c = document.createElement("canvas");
 c.width = 512; c.height = 512;
 const ctx = c.getContext("2d");
 ctx.clearRect(0, 0, 512, 512);
 ctx.fillStyle = "#111";
 ctx.textAlign = "center";
 ctx.textBaseline = "middle";
 ctx.font = "bold 150px Arial";
 ctx.fillText(">v<", 256, 330);
 const t = new THREE.CanvasTexture(c);
 t.needsUpdate = true;
 return t;
}

function buildR6Rig(){
 const root = new THREE.Group();
 root.name = "R6";
 scene.add(root);

 const bodyMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 20 });
 const torsoMat = new THREE.MeshPhongMaterial({ color: 0x00a2ff, shininess: 20 });
 const legMat = new THREE.MeshPhongMaterial({ color: 0xcd2027, shininess: 20 });
 const headMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 25 });
 const faceMat = new THREE.MeshBasicMaterial({ map: faceTexture(), transparent: true, alphaTest: 0.01, depthWrite: false, side: THREE.DoubleSide });

 const torsoGeo = roundedBox(2, 2, 1, 0.16);
 const armGeo = roundedBox(1, 2, 1, 0.16);
 const legGeo = roundedBox(1, 2, 1, 0.16);
 const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);

 const torso = new THREE.Mesh(torsoGeo, torsoMat);
 torso.name = "Torso";
 torso.castShadow = true; torso.receiveShadow = true;
 root.add(torso);
 r6Rig.Torso = torso; pivots.Torso = torso;

 const headPivot = new THREE.Group();
 headPivot.name = "HeadPivot"; headPivot.position.set(0, 1, 0);
 torso.add(headPivot);

 const head = new THREE.Mesh(headGeo, headMat);
 head.name = "Head"; head.position.set(0, 0.6, 0);
 head.castShadow = true; head.receiveShadow = true;
 headPivot.add(head);

 const face = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.48), faceMat);
 face.position.set(0, 0.20, 0.606);
 head.add(face);

 r6Rig.Head = head; pivots.Head = headPivot;

 createLimb("Left Arm", -1.5, 1, armGeo, bodyMat, "LeftArmPivot");
 createLimb("Right Arm", 1.5, 1, armGeo, bodyMat, "RightArmPivot");
 createLimb("Left Leg", -0.5, -1, legGeo, legMat, "LeftLegPivot");
 createLimb("Right Leg", 0.5, -1, legGeo, legMat, "RightLegPivot");

 buildTree();
 selectPart(torso);
}

function createLimb(name, x, y, geo, mat, pivotName){
 const pivot = new THREE.Group();
 pivot.name = pivotName; pivot.position.set(x, y, 0);
 r6Rig.Torso.add(pivot);

 const mesh = new THREE.Mesh(geo, mat);
 mesh.name = name; mesh.position.set(0, -1, 0);
 mesh.castShadow = true; mesh.receiveShadow = true;
 pivot.add(mesh);

 r6Rig[name] = mesh; pivots[name] = pivot;
}

function buildTree(){
 $("tree").innerHTML = "";
 parts.forEach(name => {
  const row = document.createElement("div");
  row.className = "treeRow";
  row.dataset.name = name;
  row.innerHTML = '<span class="treeArrow">▸</span><span>' + name + '</span>';
  row.onclick = () => selectPart(r6Rig[name]);
  $("tree").appendChild(row);
 });
}

function selectPart(part){
 selectedPart = part;
 const target = pivots[part.name] || part;
 transformControls.attach(target);

 document.querySelectorAll(".treeRow").forEach(x => {
  x.classList.toggle("selected", x.dataset.name === part.name);
 });
 updateInfo();
}

function updateInfo(){
 if(!selectedPart) return;
 const t = pivots[selectedPart.name] || selectedPart;
 $("info").innerHTML =
  "<b style='color:#ff4d4d'>" + selectedPart.name + "</b><br>" +
  "POS " + t.position.x.toFixed(2) + " / " + t.position.y.toFixed(2) + " / " + t.position.z.toFixed(2) + "<br>" +
  "ROT " + THREE.MathUtils.radToDeg(t.rotation.x).toFixed(1) + "° / " +
  THREE.MathUtils.radToDeg(t.rotation.y).toFixed(1) + "° / " +
  THREE.MathUtils.radToDeg(t.rotation.z).toFixed(1) + "°";
}

function buildTimeline(){
 $("labelRows").innerHTML = "";
 $("tracks").innerHTML = "";
 $("ruler").innerHTML = "";

 parts.forEach(name => {
  const label = document.createElement("div");
  label.className = "label"; label.textContent = name;
  $("labelRows").appendChild(label);

  const track = document.createElement("div");
  track.className = "track"; track.dataset.part = name;
  $("tracks").appendChild(track);
 });

 drawTimeline();
}

function pixelsPerSecond(){ return timelineZoom; }
function timeToX(t){ return t * pixelsPerSecond(); }

function xToTime(x){
 let t = x / pixelsPerSecond();
 const step = 1 / fps;
 t = Math.round(t / step) * step;
 return Math.max(0, Math.min(duration, t));
}

function drawTimeline(){
 const width = Math.max(800, duration * pixelsPerSecond() + 100);
 $("trackInner").style.width = width + "px";
 $("ruler").innerHTML = "";

 const visibleStep = 0.25;
 for(let t = 0; t <= duration + 0.001; t += visibleStep){
  const tick = document.createElement("div");
  tick.className = "tick " + (Math.abs(t % 1) < 0.001 ? "major" : "");
  tick.style.left = timeToX(t) + "px";
  tick.textContent = t.toFixed(2);
  $("ruler").appendChild(tick);

  const line = document.createElement("div");
  line.className = "snapLine";
  line.style.left = timeToX(t) + "px";
  document.querySelectorAll(".track").forEach(track => track.appendChild(line.cloneNode()));
 }
 renderKeyframes();
 updatePlayhead();
}

function renderKeyframes(){
 document.querySelectorAll(".kf").forEach(x => x.remove());

 keyframes.forEach((kf, index) => {
  const track = document.querySelector('.track[data-part="' + kf.part + '"]');
  if(!track) return;

  const el = document.createElement("div");
  el.className = "kf";
  if(selectedKF === kf) el.classList.add("selected");
  el.style.left = timeToX(kf.time) + "px";

  el.addEventListener("click", e => {
   e.stopPropagation();
   selectedKF = kf;
   currentTime = kf.time;
   renderKeyframes();
   updatePlayhead();
  });

  let holdTimer;
  el.addEventListener("pointerdown", e => {
   e.stopPropagation();
   holdTimer = setTimeout(() => { selectedKF = kf; showContext(e.clientX, e.clientY); }, 500);
   el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointerup", () => clearTimeout(holdTimer));
  el.addEventListener("pointermove", e => {
   if(selectedKF !== kf || e.pressure === 0) return;
   clearTimeout(holdTimer);
   const rect = $("trackInner").getBoundingClientRect();
   const x = e.clientX - rect.left + $("trackViewport").scrollLeft;
   kf.time = xToTime(x);
   currentTime = kf.time;
   updatePlayhead();
   renderKeyframes();
  });

  track.appendChild(el);
 });
}

function addKeyframe(){
 if(!selectedPart) return;
 const t = xToTime(currentTime);
 const part = selectedPart.name;
 const target = pivots[part] || selectedPart;

 const kf = {
  part: part, time: t, type: "Pose",
  position: { x: target.position.x, y: target.position.y, z: target.position.z },
  rotation: { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z },
  scale: { x: target.scale.x, y: target.scale.y, z: target.scale.z }
 };

 const existing = keyframes.find(x => x.part === part && Math.abs(x.time - t) < 0.0001);
 if(existing){ Object.assign(existing, kf); selectedKF = existing; }
 else { keyframes.push(kf); selectedKF = kf; }

 keyframes.sort((a, b) => a.time - b.time);
 renderKeyframes();
 showToast("Keyframe added");
}

function updatePlayhead(){
 $("playhead").style.left = timeToX(currentTime) + "px";
 $("timeReadout").textContent = currentTime.toFixed(2) + " / " + duration.toFixed(2);
}

function animatePlayback(){
 if(playing){
  currentTime += 1 / 60;
  if(currentTime >= duration){
   if(loop) currentTime = 0;
   else { currentTime = duration; playing = false; $("playBtn").textContent = "▶ PLAY"; }
  }
  applyNearestAnimation();
  updatePlayhead();
 }
 requestAnimationFrame(animatePlayback);
}

function applyNearestAnimation(){
 if(!keyframes.length) return;
 for(const part of parts){
  const list = keyframes.filter(k => k.part === part).sort((a, b) => a.time - b.time);
  if(!list.length) continue;
  let a = list[0], b = list[list.length - 1];
  for(let i = 0; i < list.length - 1; i++){
   if(currentTime >= list[i].time && currentTime <= list[i + 1].time){
    a = list[i]; b = list[i + 1]; break;
   }
  }
  const span = b.time - a.time;
  let alpha = span <= 0 ? 0 : (currentTime - a.time) / span;
  alpha = Math.max(0, Math.min(1, alpha));
  const target = pivots[part];
  if(!target) continue;

  target.position.set(a.position.x + (b.position.x - a.position.x) * alpha, a.position.y + (b.position.y - a.position.y) * alpha, a.position.z + (b.position.z - a.position.z) * alpha);
  target.rotation.set(a.rotation.x + (b.rotation.x - a.rotation.x) * alpha, a.rotation.y + (b.rotation.y - a.rotation.y) * alpha, a.rotation.z + (b.rotation.z - a.rotation.z) * alpha);
  target.scale.set(a.scale.x + (b.scale.x - a.scale.x) * alpha, a.scale.y + (b.scale.y - a.scale.y) * alpha, a.scale.z + (b.scale.z - a.scale.z) * alpha);
 }
}

$("trackViewport").addEventListener("pointerdown", e => {
 if(e.target.classList.contains("kf")) return;
 const rect = $("trackInner").getBoundingClientRect();
 const x = e.clientX - rect.left + $("trackViewport").scrollLeft;
 currentTime = xToTime(x);
 updatePlayhead();
});

function copyKeyframe(){
 if(!selectedKF){ showToast("Select a keyframe first"); return; }
 clipboard = JSON.parse(JSON.stringify(selectedKF));
 showToast("Copied");
}

function pasteKeyframe(){
 if(!clipboard){ showToast("Nothing copied"); return; }
 const kf = JSON.parse(JSON.stringify(clipboard));
 kf.time = xToTime(currentTime);
 keyframes.push(kf);
 keyframes.sort((a, b) => a.time - b.time);
 selectedKF = kf;
 renderKeyframes();
 showToast("Pasted");
}

function showContext(x, y){
 $("contextMenu").style.display = "block";
 $("contextMenu").style.left = Math.min(x, innerWidth - 145) + "px";
 $("contextMenu").style.top = Math.min(y, innerHeight - 110) + "px";
}

function hideContext(){ $("contextMenu").style.display = "none"; }
document.addEventListener("pointerdown", e => { if(!e.target.closest("#contextMenu")) hideContext(); });

$("ctxDelete").onclick = () => {
 if(selectedKF){ keyframes = keyframes.filter(x => x !== selectedKF); selectedKF = null; renderKeyframes(); showToast("Deleted"); }
 hideContext();
};

$("ctxDuplicate").onclick = () => {
 if(selectedKF){
  const copy = JSON.parse(JSON.stringify(selectedKF));
  copy.time = xToTime(selectedKF.time + 1 / fps);
  keyframes.push(copy); keyframes.sort((a, b) => a.time - b.time);
  selectedKF = copy; renderKeyframes(); showToast("Duplicated");
 }
 hideContext();
};

$("ctxType").onclick = () => {
 if(selectedKF){ selectedKF.type = selectedKF.type === "Pose" ? "Move" : "Pose"; showToast("Type: " + selectedKF.type); }
 hideContext();
};

let resizing = false, startY = 0, startH = 0;
$("timelineHandle").addEventListener("pointerdown", e => { resizing = true; startY = e.clientY; startH = $("timeline").offsetHeight; $("timelineHandle").setPointerCapture(e.pointerId); });
$("timelineHandle").addEventListener("pointermove", e => { if(!resizing) return; const h = startH + (startY - e.clientY); $("timeline").style.height = Math.max(80, Math.min(innerHeight - 50, h)) + "px"; });
$("timelineHandle").addEventListener("pointerup", () => resizing = false);

$("playBtn").onclick = () => { playing = !playing; $("playBtn").textContent = playing ? "❚❚ PAUSE" : "▶ PLAY"; };
$("rewind").onclick = () => { currentTime = 0; playing = false; $("playBtn").textContent = "▶ PLAY"; updatePlayhead(); };
$("prev").onclick = () => { currentTime = xToTime(currentTime - 1 / fps); updatePlayhead(); };
$("next").onclick = () => { currentTime = xToTime(currentTime + 1 / fps); updatePlayhead(); };
$("loop").onclick = () => { loop = !loop; $("loop").classList.toggle("active", loop); };
$("addKf").onclick = addKeyframe;
$("copyBtn").onclick = copyKeyframe;
$("pasteBtn").onclick = pasteKeyframe;
$("zoomIn").onclick = () => { timelineZoom = Math.min(400, timelineZoom + 25); drawTimeline(); };
$("zoomOut").onclick = () => { timelineZoom = Math.max(40, timelineZoom - 25); drawTimeline(); };

$("duration").onchange = e => { duration = Math.max(0.25, Number(e.target.value) || 2); if(currentTime > duration) currentTime = duration; drawTimeline(); };
$("fps").onchange = e => { fps = Math.max(1, Number(e.target.value) || 30); drawTimeline(); };

$("newBtn").onclick = () => {
 keyframes = []; selectedKF = null; currentTime = 0; playing = false;
 $("playBtn").textContent = "▶ PLAY";
 parts.forEach(name => { const t = pivots[name]; if(t){ if(name==="Torso")t.position.set(0,0,0); t.rotation.set(0,0,0); t.scale.set(1,1,1); } });
 drawTimeline(); showToast("New animation");
};

function resize(){
 camera.aspect = innerWidth / innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth, innerHeight);
}

let toastTimer;
function showToast(msg){
 $("toast").textContent = msg; $("toast").style.display = "block";
 clearTimeout(toastTimer);
 toastTimer = setTimeout(() => { $("toast").style.display = "none"; }, 900);
}

function animate(){
 requestAnimationFrame(animate);
 orbitControls.update();
 renderer.render(scene, camera);
}

window.onload = init;
</script>
</body>
</html>
