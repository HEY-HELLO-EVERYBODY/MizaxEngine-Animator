<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MizaxEngine Animator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070707;
  color:#eee;
  font-family:Arial,sans-serif;
}

button,input{
  font-family:inherit;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#080808;
}

#toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px;
  overflow-x:auto;
  overflow-y:hidden;
  border-bottom:1px solid #2b0909;
  background:#0d0d0d;
}

.toolBtn{
  height:40px;
  min-width:62px;
  padding:0 11px;
  flex-shrink:0;
  border:1px solid #521010;
  border-radius:7px;
  background:#181010;
  color:#ddd;
  font-size:11px;
  font-weight:bold;
}

.toolBtn.active{
  background:#7c1010;
  border-color:#e02a2a;
  color:white;
}

#fpsWrap{
  height:40px;
  min-width:72px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid #421010;
  border-radius:7px;
  background:#130d0d;
  flex-shrink:0;
}

#fpsWrap span{
  font-size:9px;
  color:#aaa;
}

#fps{
  width:48px;
  background:#080808;
  color:white;
  border:0;
  text-align:center;
  font-size:12px;
  outline:none;
}

#workspace{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
}

#view{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
  background:
  radial-gradient(circle at center,#161616 0%,#080808 75%);
}

#view canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#partPanel{
  position:absolute;
  left:6px;
  top:7px;
  width:99px;
  display:flex;
  flex-direction:column;
  gap:4px;
  z-index:20;
}

.partBtn{
  min-height:31px;
  padding:4px 6px;
  border:1px solid #4d1515;
  border-radius:6px;
  background:rgba(18,12,12,.88);
  color:#ccc;
  font-size:10px;
  font-weight:bold;
  backdrop-filter:blur(5px);
}

.partBtn.active{
  color:white;
  border-color:#e02626;
  background:#711010;
}

#infoBox{
  position:absolute;
  right:7px;
  top:7px;
  z-index:20;
  padding:6px 9px;
  border:1px solid #3c1111;
  border-radius:6px;
  background:rgba(10,10,10,.8);
  font-size:9px;
  color:#aaa;
  pointer-events:none;
}

#timelinePanel{
  height:205px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:#0c0c0c;
  border-top:1px solid #3f0e0e;
}

#timelineTop{
  height:40px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 6px;
  flex-shrink:0;
  background:#111;
  border-bottom:1px solid #262626;
}

.timeBtn{
  height:31px;
  min-width:42px;
  border:1px solid #4a1111;
  border-radius:6px;
  background:#171010;
  color:white;
  font-weight:bold;
}

#play{
  min-width:58px;
  background:#6b1111;
  border-color:#d32727;
}

#timeReadout{
  min-width:112px;
  text-align:center;
  font-size:11px;
  color:#ddd;
}

#timeline{
  position:relative;
  flex:1;
  overflow:auto;
  touch-action:pan-x;
  background:#090909;
}

#timelineInner{
  position:relative;
  min-height:100%;
}

#ruler{
  position:sticky;
  top:0;
  height:26px;
  z-index:10;
  background:#101010;
  border-bottom:1px solid #242424;
}

.tick{
  position:absolute;
  top:0;
  height:26px;
  width:1px;
  background:#333;
}

.tick.major{
  background:#555;
}

.tick span{
  position:absolute;
  top:4px;
  left:4px;
  font-size:9px;
  color:#888;
  white-space:nowrap;
}

#tracks{
  position:relative;
}

.track{
  position:relative;
  height:25px;
  border-bottom:1px solid #181818;
}

.track:nth-child(even){
  background:#0c0c0c;
}

.trackLabel{
  position:sticky;
  left:0;
  z-index:6;
  width:92px;
  height:25px;
  display:flex;
  align-items:center;
  padding-left:7px;
  background:rgba(17,17,17,.94);
  border-right:1px solid #292929;
  color:#888;
  font-size:9px;
  pointer-events:none;
}

.key{
  position:absolute;
  top:7px;
  width:11px;
  height:11px;
  transform:translateX(-5px) rotate(45deg);
  background:#b91a1a;
  border:1px solid #ff4d4d;
  z-index:5;
}

#playhead{
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:#ff3434;
  z-index:15;
  pointer-events:none;
}

#playhead::before{
  content:"";
  position:absolute;
  top:0;
  left:-5px;
  width:12px;
  height:9px;
  background:#ff3434;
  clip-path:polygon(0 0,100% 0,50% 100%);
}

#endMarker{
  position:absolute;
  top:0;
  bottom:0;
  width:20px;
  transform:translateX(-10px);
  z-index:18;
  cursor:ew-resize;
  touch-action:none;
}

#endMarker::before{
  content:"";
  position:absolute;
  left:9px;
  top:0;
  bottom:0;
  width:2px;
  background:#d4d4d4;
}

#endMarker::after{
  content:"]";
  position:absolute;
  left:1px;
  top:3px;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

@media(max-height:650px){
  #timelinePanel{
    height:175px;
  }
}

</style>
</head>

<body>
<div id="app">

<div id="toolbar">
<button class="toolBtn active" id="moveBtn">MOVE</button>
<button class="toolBtn" id="rotateBtn">ROTATE</button>

<button class="toolBtn active" id="globalBtn">GLOBAL</button>
<button class="toolBtn" id="parentBtn">PARENT</button>
<button class="toolBtn" id="localBtn">LOCAL</button>

<button class="toolBtn active" id="smoothBtn">SMOOTH</button>
<button class="toolBtn" id="choppyBtn">CHOPPY</button>

<button class="toolBtn active" id="loopBtn">↻ LOOP</button>
<button class="toolBtn" id="cameraBtn">🔓 CAMERA</button>

<div id="fpsWrap">
<span>FPS</span>
<input id="fps" type="number" min="1" max="60" value="30">
</div>
</div>

<div id="workspace">
<div id="view"></div>

<div id="partPanel">
<button class="partBtn" data-part="Head">HEAD</button>
<button class="partBtn active" data-part="Torso">TORSO</button>
<button class="partBtn" data-part="Left Arm">LEFT ARM</button>
<button class="partBtn" data-part="Right Arm">RIGHT ARM</button>
<button class="partBtn" data-part="Left Leg">LEFT LEG</button>
<button class="partBtn" data-part="Right Leg">RIGHT LEG</button>
</div>

<div id="infoBox">
MizaxEngine R6
</div>
</div>

<div id="timelinePanel">

<div id="timelineTop">
<button class="timeBtn" id="prevBtn">◀</button>
<button class="timeBtn" id="play">▶</button>
<button class="timeBtn" id="nextBtn">▶|</button>
<div id="timeReadout">0.00 / 2.00</div>
</div>

<div id="timeline">
<div id="timelineInner">
<div id="ruler"></div>
<div id="tracks"></div>
<div id="playhead"></div>
<div id="endMarker"></div>
</div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>

const view=document.getElementById("view");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090909);

const camera=new THREE.PerspectiveCamera(
  45,
  Math.max(1,view.clientWidth)/Math.max(1,view.clientHeight),
  0.05,
  200
);

camera.position.set(8,5.5,10);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setSize(
  Math.max(1,view.clientWidth),
  Math.max(1,view.clientHeight)
);

view.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x331111,1.45);
scene.add(hemi);

const light=new THREE.DirectionalLight(0xffffff,1.1);
light.position.set(4,8,7);
scene.add(light);

const fill=new THREE.DirectionalLight(0x8a2020,.45);
fill.position.set(-6,4,-4);
scene.add(fill);

const grid=new THREE.GridHelper(
  30,
  30,
  0x451414,
  0x191919
);

grid.position.y=0;
scene.add(grid);

const orbit=new THREE.OrbitControls(camera,renderer.domElement);
orbit.target.set(0,3,0);
orbit.enableDamping=true;
orbit.dampingFactor=.08;
orbit.minDistance=4;
orbit.maxDistance=30;
orbit.update();

const gizmo=new THREE.TransformControls(camera,renderer.domElement);
gizmo.setSize(.8);
scene.add(gizmo);

gizmo.addEventListener("dragging-changed",e=>{
  orbit.enabled=!e.value && !cameraLocked;
});

function roundedBox(w,h,d,r=.12){

  const shape=new THREE.Shape();

  const x=-w/2;
  const y=-h/2;

  shape.moveTo(x+r,y);
  shape.lineTo(x+w-r,y);
  shape.quadraticCurveTo(x+w,y,x+w,y+r);
  shape.lineTo(x+w,y+h-r);
  shape.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  shape.lineTo(x+r,y+h);
  shape.quadraticCurveTo(x,y+h,x,y+h-r);
  shape.lineTo(x,y+r);
  shape.quadraticCurveTo(x,y,x+r,y);

  const geo=new THREE.ExtrudeGeometry(shape,{
    depth:d,
    bevelEnabled:true,
    bevelSegments:2,
    steps:1,
    bevelSize:r*.42,
    bevelThickness:r*.42
  });

  geo.center();
  geo.computeVertexNormals();

  return geo;
}

function makeHeadGeometry(){

  const points=[];

  points.push(new THREE.Vector2(0.74,-0.67));
  points.push(new THREE.Vector2(0.79,-0.58));
  points.push(new THREE.Vector2(0.82,-0.42));
  points.push(new THREE.Vector2(0.83,-0.12));
  points.push(new THREE.Vector2(0.83,0.20));
  points.push(new THREE.Vector2(0.81,0.43));
  points.push(new THREE.Vector2(0.76,0.59));
  points.push(new THREE.Vector2(0.68,0.67));

  const geo=new THREE.LatheGeometry(
    points,
    32
  );

  geo.computeVertexNormals();

  return geo;
}

const skinMat=new THREE.MeshStandardMaterial({
  color:0xf3d5b7,
  roughness:.72,
  metalness:0
});

const torsoMat=new THREE.MeshStandardMaterial({
  color:0x951717,
  roughness:.65
});

const limbMat=new THREE.MeshStandardMaterial({
  color:0x292929,
  roughness:.7
});

const rigRoot=new THREE.Group();
rigRoot.position.y=0;
scene.add(rigRoot);

const parts={};

function makePart(name,geometry,material,parent){

  const group=new THREE.Group();
  group.name=name;

  const mesh=new THREE.Mesh(
    geometry,
    material
  );

  mesh.castShadow=false;
  mesh.receiveShadow=false;

  group.add(mesh);
  parent.add(group);

  parts[name]=group;

  return group;
}

const torso=makePart(
  "Torso",
  roundedBox(2,2,1,.12),
  torsoMat,
  rigRoot
);

torso.position.set(0,4,0);

const head=makePart(
  "Head",
  makeHeadGeometry(),
  skinMat,
  torso
);

head.position.set(0,1.7,0);

const leftArm=makePart(
  "Left Arm",
  roundedBox(1,2,1,.1),
  limbMat,
  torso
);

leftArm.position.set(-1.5,0,0);

const rightArm=makePart(
  "Right Arm",
  roundedBox(1,2,1,.1),
  limbMat,
  torso
);

rightArm.position.set(1.5,0,0);

const leftLeg=makePart(
  "Left Leg",
  roundedBox(1,2,1,.1),
  limbMat,
  torso
);

leftLeg.position.set(-.5,-2,0);

const rightLeg=makePart(
  "Right Leg",
  roundedBox(1,2,1,.1),
  limbMat,
  torso
);

rightLeg.position.set(.5,-2,0);

const neckRing=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.25,.18,20),
  skinMat
);

neckRing.position.set(0,1.05,0);
torso.add(neckRing);

let selectedPart="Torso";
gizmo.attach(parts[selectedPart]);

function selectPart(name){

  selectedPart=name;

  document.querySelectorAll(".partBtn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.part===name
    );
  });

  gizmo.attach(parts[name]);
}

document.querySelectorAll(".partBtn").forEach(btn=>{

  btn.addEventListener("pointerdown",e=>{
    e.stopPropagation();
    selectPart(btn.dataset.part);
  });

});

const moveBtn=document.getElementById("moveBtn");
const rotateBtn=document.getElementById("rotateBtn");

moveBtn.onclick=()=>{
  gizmo.setMode("translate");
  moveBtn.classList.add("active");
  rotateBtn.classList.remove("active");
};

rotateBtn.onclick=()=>{
  gizmo.setMode("rotate");
  rotateBtn.classList.add("active");
  moveBtn.classList.remove("active");
};

const globalBtn=document.getElementById("globalBtn");
const parentBtn=document.getElementById("parentBtn");
const localBtn=document.getElementById("localBtn");

function setSpace(type){

  globalBtn.classList.toggle("active",type==="global");
  parentBtn.classList.toggle("active",type==="parent");
  localBtn.classList.toggle("active",type==="local");

  if(type==="global"){
    gizmo.setSpace("world");
  }else{
    gizmo.setSpace("local");
  }
}

globalBtn.onclick=()=>setSpace("global");
parentBtn.onclick=()=>setSpace("parent");
localBtn.onclick=()=>setSpace("local");

let cameraLocked=false;

const cameraBtn=document.getElementById("cameraBtn");

cameraBtn.onclick=()=>{

  cameraLocked=!cameraLocked;

  orbit.enabled=!cameraLocked;

  cameraBtn.textContent=
    cameraLocked
    ?"🔒 CAMERA"
    :"🔓 CAMERA";

  cameraBtn.classList.toggle(
    "active",
    cameraLocked
  );
};

let interpolation="smooth";

const smoothBtn=document.getElementById("smoothBtn");
const choppyBtn=document.getElementById("choppyBtn");

smoothBtn.onclick=()=>{
  interpolation="smooth";
  smoothBtn.classList.add("active");
  choppyBtn.classList.remove("active");
  evaluate(currentTime);
};

choppyBtn.onclick=()=>{
  interpolation="choppy";
  choppyBtn.classList.add("active");
  smoothBtn.classList.remove("active");
  evaluate(currentTime);
};

let loopPlayback=true;

const loopBtn=document.getElementById("loopBtn");

loopBtn.onclick=()=>{
  loopPlayback=!loopPlayback;
  loopBtn.classList.toggle("active",loopPlayback);
};

let fps=30;

document.getElementById("fps").onchange=e=>{

  fps=Math.max(
    1,
    Math.min(
      60,
      Number(e.target.value)||30
    )
  );

  e.target.value=fps;
};

function capturePose(){

  const pose={};

  Object.keys(parts).forEach(name=>{

    const p=parts[name];

    pose[name]={
      position:{
        x:p.position.x,
        y:p.position.y,
        z:p.position.z
      },
      quaternion:{
        x:p.quaternion.x,
        y:p.quaternion.y,
        z:p.quaternion.z,
        w:p.quaternion.w
      }
    };
  });

  return pose;
}

function applyPose(pose){

  if(!pose)return;

  Object.keys(parts).forEach(name=>{

    const data=pose[name];
    if(!data)return;

    const p=parts[name];

    p.position.set(
      data.position.x,
      data.position.y,
      data.position.z
    );

    p.quaternion.set(
      data.quaternion.x,
      data.quaternion.y,
      data.quaternion.z,
      data.quaternion.w
    );
  });
}

function poseChanged(a,b){

  if(!a||!b)return true;

  for(const name of Object.keys(parts)){

    const A=a[name];
    const B=b[name];

    if(!A||!B)return true;

    const dp=
      Math.abs(A.position.x-B.position.x)+
      Math.abs(A.position.y-B.position.y)+
      Math.abs(A.position.z-B.position.z);

    const dq=
      Math.abs(A.quaternion.x-B.quaternion.x)+
      Math.abs(A.quaternion.y-B.quaternion.y)+
      Math.abs(A.quaternion.z-B.quaternion.z)+
      Math.abs(A.quaternion.w-B.quaternion.w);

    if(dp>.0001||dq>.0001){
      return true;
    }
  }

  return false;
}

let currentTime=0;
let totalDuration=2;
let keyframes=[];
let playing=false;

keyframes.push({
  time:0,
  pose:capturePose()
});

let lastPose=capturePose();

function autoKey(){

  if(playing)return;

  const pose=capturePose();

  if(!poseChanged(lastPose,pose)){
    return;
  }

  let existing=keyframes.find(
    k=>Math.abs(k.time-currentTime)<.025
  );

  if(existing){
    existing.pose=pose;
  }else{
    keyframes.push({
      time:currentTime,
      pose:pose
    });
  }

  keyframes.sort((a,b)=>a.time-b.time);

  lastPose=capturePose();

  renderTimeline();
}

let autoKeyTimer=null;

gizmo.addEventListener("objectChange",()=>{

  clearTimeout(autoKeyTimer);

  autoKeyTimer=setTimeout(()=>{
    autoKey();
  },35);

});

const tempA=new THREE.Quaternion();
const tempB=new THREE.Quaternion();
const tempQ=new THREE.Quaternion();

function evaluate(time){

  if(keyframes.length===0)return;

  if(keyframes.length===1){
    applyPose(keyframes[0].pose);
    return;
  }

  if(time<=keyframes[0].time){
    applyPose(keyframes[0].pose);
    return;
  }

  const last=
    keyframes[keyframes.length-1];

  if(time>=last.time){
    applyPose(last.pose);
    return;
  }

  let A=keyframes[0];
  let B=keyframes[1];

  for(let i=0;i<keyframes.length-1;i++){

    if(
      time>=keyframes[i].time &&
      time<=keyframes[i+1].time
    ){
      A=keyframes[i];
      B=keyframes[i+1];
      break;
    }
  }

  if(interpolation==="choppy"){
    applyPose(A.pose);
    return;
  }

  let alpha=
    (time-A.time)/
    Math.max(.00001,B.time-A.time);

  alpha=Math.max(
    0,
    Math.min(1,alpha)
  );

  alpha=
    alpha*alpha*(3-2*alpha);

  Object.keys(parts).forEach(name=>{

    const a=A.pose[name];
    const b=B.pose[name];
    const p=parts[name];

    p.position.set(
      THREE.MathUtils.lerp(
        a.position.x,
        b.position.x,
        alpha
      ),
      THREE.MathUtils.lerp(
        a.position.y,
        b.position.y,
        alpha
      ),
      THREE.MathUtils.lerp(
        a.position.z,
        b.position.z,
        alpha
      )
    );

    tempA.set(
      a.quaternion.x,
      a.quaternion.y,
      a.quaternion.z,
      a.quaternion.w
    );

    tempB.set(
      b.quaternion.x,
      b.quaternion.y,
      b.quaternion.z,
      b.quaternion.w
    );

    THREE.Quaternion.slerp(
      tempA,
      tempB,
      tempQ,
      alpha
    );

    p.quaternion.copy(tempQ);
  });
}

const timeline=document.getElementById("timeline");
const timelineInner=document.getElementById("timelineInner");
const ruler=document.getElementById("ruler");
const tracks=document.getElementById("tracks");
const playhead=document.getElementById("playhead");
const endMarker=document.getElementById("endMarker");
const timeReadout=document.getElementById("timeReadout");

const pixelsPerSecond=130;
const leftOffset=95;

const trackNames=[
  "Head",
  "Torso",
  "Left Arm",
  "Right Arm",
  "Left Leg",
  "Right Leg"
];

function buildRuler(){

  ruler.innerHTML="";

  const width=
    Math.max(
      timeline.clientWidth,
      leftOffset+
      totalDuration*pixelsPerSecond+
      100
    );

  timelineInner.style.width=
    width+"px";

  for(
    let t=0;
    t<=totalDuration+.001;
    t+=.25
  ){

    const tick=
      document.createElement("div");

    const major=
      Math.abs((t*2)-Math.round(t*2))
      <.001;

    tick.className=
      major
      ?"tick major"
      :"tick";

    tick.style.left=
      (
        leftOffset+
        t*pixelsPerSecond
      )+"px";

    if(major){

      const span=
        document.createElement("span");

      span.textContent=
        t.toFixed(1)+"s";

      tick.appendChild(span);
    }

    ruler.appendChild(tick);
  }
}

function renderTimeline(){

  buildRuler();

  tracks.innerHTML="";

  trackNames.forEach(name=>{

    const row=
      document.createElement("div");

    row.className="track";

    const label=
      document.createElement("div");

    label.className="trackLabel";
    label.textContent=name;

    row.appendChild(label);

    keyframes.forEach(k=>{

      const key=
        document.createElement("div");

      key.className="key";

      key.style.left=
        (
          leftOffset+
          k.time*pixelsPerSecond
        )+"px";

      key.addEventListener(
        "pointerdown",
        e=>{
          e.stopPropagation();
          setTime(k.time);
        }
      );

      row.appendChild(key);
    });

    tracks.appendChild(row);
  });

  updateTimeline();
}

function updateTimeline(){

  playhead.style.left=
    (
      leftOffset+
      currentTime*pixelsPerSecond
    )+"px";

  endMarker.style.left=
    (
      leftOffset+
      totalDuration*pixelsPerSecond
    )+"px";

  timeReadout.textContent=
    currentTime.toFixed(2)+
    " / "+
    totalDuration.toFixed(2);
}

function setTime(t){

  currentTime=Math.max(
    0,
    Math.min(
      totalDuration,
      t
    )
  );

  evaluate(currentTime);

  lastPose=capturePose();

  updateTimeline();
}

let scrubbing=false;

timeline.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.target===endMarker ||
      endMarker.contains(e.target)
    ){
      return;
    }

    const rect=
      timelineInner.getBoundingClientRect();

    let x=
      e.clientX-
      rect.left-
      leftOffset;

    if(x<0)return;

    scrubbing=true;

    setTime(
      x/pixelsPerSecond
    );

    timeline.setPointerCapture?.(
      e.pointerId
    );
  }
);

timeline.addEventListener(
  "pointermove",
  e=>{

    if(!scrubbing)return;

    const rect=
      timelineInner.getBoundingClientRect();

    let x=
      e.clientX-
      rect.left-
      leftOffset;

    setTime(
      x/pixelsPerSecond
    );
  }
);

timeline.addEventListener(
  "pointerup",
  ()=>scrubbing=false
);

timeline.addEventListener(
  "pointercancel",
  ()=>scrubbing=false
);

let draggingEnd=false;

endMarker.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();
    e.stopPropagation();

    draggingEnd=true;

    endMarker.setPointerCapture?.(
      e.pointerId
    );
  }
);

endMarker.addEventListener(
  "pointermove",
  e=>{

    if(!draggingEnd)return;

    const rect=
      timelineInner.getBoundingClientRect();

    let x=
      e.clientX-
      rect.left-
      leftOffset;

    totalDuration=
      Math.max(
        .25,
        Math.min(
          50,
          x/pixelsPerSecond
        )
      );

    if(currentTime>totalDuration){
      currentTime=totalDuration;
      evaluate(currentTime);
    }

    renderTimeline();
  }
);

endMarker.addEventListener(
  "pointerup",
  ()=>draggingEnd=false
);

endMarker.addEventListener(
  "pointercancel",
  ()=>draggingEnd=false
);

const playBtn=document.getElementById("play");

playBtn.onclick=()=>{

  playing=!playing;

  playBtn.textContent=
    playing
    ?"⏸"
    :"▶";

  if(playing){

    if(currentTime>=totalDuration){
      currentTime=0;
      evaluate(0);
    }

    lastFrameTime=
      performance.now();
  }
};

document.getElementById("prevBtn").onclick=()=>{

  let target=0;

  for(const k of keyframes){

    if(k.time<currentTime-.02){
      target=k.time;
    }
  }

  setTime(target);
};

document.getElementById("nextBtn").onclick=()=>{

  for(const k of keyframes){

    if(k.time>currentTime+.02){
      setTime(k.time);
      return;
    }
  }

  setTime(totalDuration);
};

let lastFrameTime=performance.now();

function animate(now){

  requestAnimationFrame(animate);

  orbit.update();

  const distance=
    camera.position.distanceTo(
      gizmo.position
    );

  gizmo.setSize(
    Math.max(
      .55,
      Math.min(
        1.1,
        distance*.075
      )
    )
  );

  if(playing){

    const delta=
      Math.min(
        .08,
        (now-lastFrameTime)/1000
      );

    lastFrameTime=now;

    currentTime+=delta;

    if(currentTime>=totalDuration){

      if(loopPlayback){

        currentTime=
          currentTime%
          totalDuration;

        evaluate(currentTime);

      }else{

        currentTime=totalDuration;
        evaluate(currentTime);
        playing=false;
        playBtn.textContent="▶";
      }

    }else{

      evaluate(currentTime);
    }

    updateTimeline();

    const px=
      leftOffset+
      currentTime*pixelsPerSecond;

    if(
      px-timeline.scrollLeft >
      timeline.clientWidth-55
    ){
      timeline.scrollLeft=
        Math.max(
          0,
          px-
          timeline.clientWidth+
          90
        );
    }
  }

  renderer.render(
    scene,
    camera
  );
}

function resize(){

  const w=
    Math.max(
      1,
      view.clientWidth
    );

  const h=
    Math.max(
      1,
      view.clientHeight
    );

  camera.aspect=w/h;
  camera.updateProjectionMatrix();

  renderer.setSize(
    w,
    h,
    false
  );

  renderTimeline();
}

window.addEventListener(
  "resize",
  resize
);

renderTimeline();
resize();
requestAnimationFrame(animate);

</script>
</body>
</html>
