<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MizaxEngine Animator V2</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:Arial,sans-serif}
#app{width:100%;height:100%;position:relative}

#top{
 position:absolute;top:0;left:0;right:0;height:48px;
 background:#191919;border-bottom:1px solid #333;
 display:flex;align-items:center;padding:0 10px;z-index:10
}
#title{font-weight:bold;color:#ff3b3b;font-size:15px}
#status{margin-left:auto;font-size:11px;color:#aaa}

#view{
 position:absolute;top:48px;left:0;right:0;bottom:170px;
 overflow:hidden
}

#tools{
 position:absolute;left:8px;top:8px;z-index:5;
 display:flex;gap:5px
}
button{
 border:1px solid #444;background:#202020;color:#ddd;
 border-radius:6px;padding:9px 12px;font-size:12px;
 touch-action:none
}
button.active{background:#d52b2b;color:white;border-color:#ff5555}

#parts{
 position:absolute;right:8px;top:8px;z-index:5;
 display:flex;flex-direction:column;gap:4px
}
.part{
 padding:7px 9px;background:#1d1d1d;border:1px solid #383838;
 border-radius:5px;font-size:10px;color:#bbb
}
.part.active{background:#9d2424;color:#fff}

#bottom{
 position:absolute;left:0;right:0;bottom:0;height:170px;
 background:#181818;border-top:1px solid #333;
 z-index:10;padding:7px
}

#properties{
 display:flex;gap:5px;height:54px
}
.prop{
 flex:1;background:#101010;border:1px solid #333;
 border-radius:5px;padding:5px
}
.prop label{font-size:9px;color:#777;display:block}
.prop input{
 width:100%;background:none;border:0;outline:0;
 color:white;font-size:12px
}

#timeline{
 height:58px;margin-top:5px;
 overflow-x:auto;overflow-y:hidden;
 display:flex;align-items:center;gap:2px;
 border-top:1px solid #292929;border-bottom:1px solid #292929;
 touch-action:pan-x
}
.frame{
 min-width:34px;height:34px;
 background:#242424;border:1px solid #3a3a3a;
 border-radius:4px;color:#aaa;font-size:10px
}
.frame.current{background:#d32d2d;color:#fff;border-color:#ff5555}
.frame.key{border-color:#ff8a8a}

#transport{
 display:flex;gap:5px;margin-top:5px
}
#transport button{flex:1}

canvas{
 display:block;
 width:100%;
 height:100%;
 touch-action:none
}
</style>
</head>

<body>
<div id="app">

<div id="top">
 <div id="title">MizaxEngine Animator V2</div>
 <div id="status">Creating R6...</div>
</div>

<div id="view">

 <div id="tools">
  <button id="moveBtn" class="active">MOVE</button>
  <button id="rotateBtn">ROTATE</button>
 </div>

 <div id="parts">
  <button class="part active" data-part="Head">HEAD</button>
  <button class="part" data-part="Torso">TORSO</button>
  <button class="part" data-part="Left Arm">L ARM</button>
  <button class="part" data-part="Right Arm">R ARM</button>
  <button class="part" data-part="Left Leg">L LEG</button>
  <button class="part" data-part="Right Leg">R LEG</button>
 </div>

</div>

<div id="bottom">

 <div id="properties">
  <div class="prop"><label>POS X</label><input id="px"></div>
  <div class="prop"><label>POS Y</label><input id="py"></div>
  <div class="prop"><label>POS Z</label><input id="pz"></div>
  <div class="prop"><label>ROT X</label><input id="rx"></div>
  <div class="prop"><label>ROT Y</label><input id="ry"></div>
  <div class="prop"><label>ROT Z</label><input id="rz"></div>
 </div>

 <div id="timeline"></div>

 <div id="transport">
  <button id="prev">◀</button>
  <button id="key">◆ KEYFRAME</button>
  <button id="play">▶ PLAY</button>
  <button id="next">▶</button>
 </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>
/* =========================
   MIZAXENGINE V2
========================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  .01,
  100
);

camera.position.set(4,3,6);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
document.getElementById("view").appendChild(renderer.domElement);

/* LIGHT */

scene.add(new THREE.HemisphereLight(0xffffff,0x333333,1.4));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(4,7,5);
scene.add(light);

/* CAMERA */

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = .18;
controls.rotateSpeed = .35;
controls.zoomSpeed = .35;
controls.panSpeed = .25;

/* =========================
   R6
========================= */

const rig = new THREE.Group();
scene.add(rig);

const parts = {};

function material(color){
 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:.75
 });
}

function cube(name,w,h,d,color){
 const group = new THREE.Group();
 group.name=name;

 const geo = new THREE.BoxGeometry(w,h,d);
 const mesh = new THREE.Mesh(geo,material(color));

 mesh.position.y=-h/2;
 group.add(mesh);

 rig.add(group);
 parts[name]=group;

 return group;
}

/* TORSO */

const torso = cube(
 "Torso",
 1.45,
 2,
 .75,
 0x3b82f6
);

torso.position.y=2.9;

/* HEAD */

const head = cube(
 "Head",
 1.25,
 1.25,
 1.25,
 0xf1c27d
);

head.position.y=4.525;

/* FACE */

const face = new THREE.Mesh(
 new THREE.BoxGeometry(.55,.32,.04),
 material(0x222222)
);

face.position.set(
 0,
 -.52,
 .63
);

head.add(face);

/* LEFT ARM */

const leftArm = cube(
 "Left Arm",
 .55,
 1.8,
 .6,
 0xf1c27d
);

leftArm.position.set(
 -1.0,
 2.95,
 0
);

/* RIGHT ARM */

const rightArm = cube(
 "Right Arm",
 .55,
 1.8,
 .6,
 0xf1c27d
);

rightArm.position.set(
 1.0,
 2.95,
 0
);

/* LEFT LEG */

const leftLeg = cube(
 "Left Leg",
 .65,
 1.9,
 .7,
 0x202020
);

leftLeg.position.set(
 -.4,
 .95,
 0
);

/* RIGHT LEG */

const rightLeg = cube(
 "Right Leg",
 .65,
 1.9,
 .7,
 0x202020
);

rightLeg.position.set(
 .4,
 .95,
 0
);

/* =========================
   GROUND
========================= */

const ground = new THREE.GridHelper(
 8,
 16,
 0x444444,
 0x222222
);

ground.position.y=0;
scene.add(ground);

/* =========================
   GIZMO
========================= */

const gizmo = new THREE.TransformControls(
 camera,
 renderer.domElement
);

gizmo.setSize(.65);
gizmo.setMode("translate");

scene.add(gizmo);

let selected = head;

/* berat / tidak licin */

gizmo.setTranslationSnap(.05);
gizmo.setRotationSnap(THREE.MathUtils.degToRad(5));

gizmo.addEventListener(
 "dragging-changed",
 e=>{
  controls.enabled=!e.value;
 }
);

gizmo.addEventListener(
 "change",
 ()=>{
  if(selected) updateInputs();
 }
);

gizmo.attach(selected);

/* =========================
   SELECT PART
========================= */

document.querySelectorAll(".part").forEach(btn=>{

 btn.addEventListener("click",()=>{

  const name=btn.dataset.part;

  selected=parts[name];

  gizmo.attach(selected);

  document.querySelectorAll(".part")
   .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  updateInputs();
 });
});

/* =========================
   MODE
========================= */

const moveBtn=document.getElementById("moveBtn");
const rotateBtn=document.getElementById("rotateBtn");

moveBtn.onclick=()=>{
 gizmo.setMode("translate");
 moveBtn.classList.add("active");
 rotateBtn.classList.remove("active");
};

rotateBtn.onclick=()=>{
 gizmo.setMode("rotate");
 rotateBtn.classList.add("active");
 moveBtn.classList.remove("active");
};

/* =========================
   INPUT
========================= */

const inputs={
 px:document.getElementById("px"),
 py:document.getElementById("py"),
 pz:document.getElementById("pz"),
 rx:document.getElementById("rx"),
 ry:document.getElementById("ry"),
 rz:document.getElementById("rz")
};

function updateInputs(){

 if(!selected)return;

 inputs.px.value=selected.position.x.toFixed(2);
 inputs.py.value=selected.position.y.toFixed(2);
 inputs.pz.value=selected.position.z.toFixed(2);

 inputs.rx.value=THREE.MathUtils.radToDeg(
  selected.rotation.x
 ).toFixed(1);

 inputs.ry.value=THREE.MathUtils.radToDeg(
  selected.rotation.y
 ).toFixed(1);

 inputs.rz.value=THREE.MathUtils.radToDeg(
  selected.rotation.z
 ).toFixed(1);
}

function num(input){
 return parseFloat(input.value)||0;
}

inputs.px.onchange=()=>{
 selected.position.x=num(inputs.px);
};

inputs.py.onchange=()=>{
 selected.position.y=num(inputs.py);
};

inputs.pz.onchange=()=>{
 selected.position.z=num(inputs.pz);
};

inputs.rx.onchange=()=>{
 selected.rotation.x=THREE.MathUtils.degToRad(num(inputs.rx));
};

inputs.ry.onchange=()=>{
 selected.rotation.y=THREE.MathUtils.degToRad(num(inputs.ry));
};

inputs.rz.onchange=()=>{
 selected.rotation.z=THREE.MathUtils.degToRad(num(inputs.rz));
};

/* =========================
   KEYFRAMES
========================= */

let currentFrame=0;
let playing=false;
let timer=null;

const keyframes={};

for(let i=0;i<=60;i++){

 const b=document.createElement("button");

 b.className="frame";
 b.textContent=i;

 b.onclick=()=>{
  currentFrame=i;
  applyFrame(i);
  updateTimeline();
 };

 document.getElementById("timeline").appendChild(b);
}

function saveKeyframe(){

 if(!keyframes[currentFrame])
  keyframes[currentFrame]={};

 keyframes[currentFrame][selected.name]={
  position:[
   selected.position.x,
   selected.position.y,
   selected.position.z
  ],
  rotation:[
   selected.rotation.x,
   selected.rotation.y,
   selected.rotation.z
  ]
 };

 updateTimeline();
}

function applyFrame(frame){

 const data=keyframes[frame];

 if(!data)return;

 Object.keys(data).forEach(name=>{

  const p=parts[name];

  if(!p)return;

  const d=data[name];

  p.position.set(
   d.position[0],
   d.position[1],
   d.position[2]
  );

  p.rotation.set(
   d.rotation[0],
   d.rotation[1],
   d.rotation[2]
  );
 });

 updateInputs();
}

function updateTimeline(){

 document.querySelectorAll(".frame").forEach((b,i)=>{

  b.classList.toggle(
   "current",
   i===currentFrame
  );

  b.classList.toggle(
   "key",
   !!keyframes[i]
  );
 });
}

document.getElementById("key").onclick=()=>{
 saveKeyframe();
};

/* =========================
   PLAY
========================= */

function stop(){

 playing=false;

 if(timer){
  clearInterval(timer);
  timer=null;
 }

 document.getElementById("play").textContent="▶ PLAY";
}

document.getElementById("play").onclick=()=>{

 if(playing){
  stop();
  return;
 }

 playing=true;
 document.getElementById("play").textContent="■ STOP";

 timer=setInterval(()=>{

  currentFrame++;

  if(currentFrame>60){
   currentFrame=0;
  }

  applyFrame(currentFrame);
  updateTimeline();

 },100);
};

document.getElementById("prev").onclick=()=>{
 stop();
 currentFrame=Math.max(0,currentFrame-1);
 applyFrame(currentFrame);
 updateTimeline();
};

document.getElementById("next").onclick=()=>{
 stop();
 currentFrame=Math.min(60,currentFrame+1);
 applyFrame(currentFrame);
 updateTimeline();
};

/* =========================
   RESIZE
========================= */

function resize(){

 const box=document.getElementById("view");

 camera.aspect=
  box.clientWidth/box.clientHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  box.clientWidth,
  box.clientHeight
 );
}

window.addEventListener("resize",resize);

/* =========================
   START
========================= */

updateInputs();
updateTimeline();

document.getElementById("status").textContent=
 "R6 Ready";

resize();

function animate(){

 requestAnimationFrame(animate);

 controls.update();

 renderer.render(
  scene,
  camera
 );
}

animate();
</script>

</body>
</html>
