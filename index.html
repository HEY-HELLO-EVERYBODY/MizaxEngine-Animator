<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>MizaxEngine Animator V1</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080808;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    border-radius:0;
}

/* =====================================================
   APP
===================================================== */

#app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:#080808;
}

/* =====================================================
   TOP BAR
===================================================== */

#topbar{
    height:52px;
    flex:none;
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px;
    background:#101010;
    border-bottom:1px solid #333;
    z-index:50;
}

.brand{
    color:#e00000;
    font-weight:bold;
    font-size:15px;
    padding:0 8px;
    white-space:nowrap;
}

.topBtn{
    height:34px;
    min-width:34px;
    padding:0 9px;
    background:#191919;
    border:1px solid #444;
    color:#ddd;
    font-size:12px;
}

.topBtn:hover{
    background:#242424;
}

.topBtn.active{
    background:#b40000;
    border-color:#ff3333;
    color:white;
}

.spacer{
    flex:1;
}

/* =====================================================
   VIEWPORT
===================================================== */

#viewport{
    position:relative;
    flex:1;
    min-height:80px;
    overflow:hidden;
    background:#111;
}

#canvasWrap{
    position:absolute;
    inset:0;
}

#canvasWrap canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =====================================================
   VIEWPORT TOOL
===================================================== */

#viewportTools{
    position:absolute;
    right:8px;
    top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    z-index:10;
}

.vBtn{
    width:38px;
    height:34px;
    background:#151515;
    border:1px solid #444;
    color:#ddd;
    border-radius:0;
}

.vBtn.active{
    background:#a00000;
    border-color:#ff2222;
}

/* =====================================================
   TIMELINE
===================================================== */

#timeline{
    height:310px;
    min-height:0;
    flex:none;
    position:relative;
    display:flex;
    flex-direction:column;
    background:#111318;
    border-top:2px solid #333;
    z-index:30;
}

/* RESIZE HANDLE */

#timelineResize{
    position:absolute;
    top:-8px;
    left:0;
    width:100%;
    height:8px;
    cursor:ns-resize;
    z-index:100;
}

#timelineResize::after{
    content:"";
    position:absolute;
    left:50%;
    top:3px;
    width:55px;
    height:2px;
    transform:translateX(-50%);
    background:#777;
}

#timelineResize:hover::after{
    background:#e00000;
}

/* =====================================================
   TIMELINE HEADER
===================================================== */

#timelineHeader{
    height:86px;
    flex:none;
    background:#15171c;
    border-bottom:1px solid #333;
}

#timelineControls{
    height:43px;
    display:flex;
    align-items:center;
    gap:4px;
    padding:5px;
    overflow:hidden;
}

.tBtn{
    height:32px;
    min-width:32px;
    padding:0 8px;
    background:#1b1d22;
    border:1px solid #41444b;
    color:#ddd;
    border-radius:0;
    font-size:12px;
    flex:none;
}

.tBtn:hover{
    background:#292c32;
}

.tBtn.active{
    background:#a80000;
    border-color:#ff3030;
    color:#fff;
}

.playBtn{
    width:42px;
    font-size:15px;
}

#durationBox{
    height:32px;
    width:70px;
    background:#1b1d22;
    border:1px solid #41444b;
    color:#fff;
    text-align:center;
    outline:none;
}

#durationBox:focus{
    border-color:#e00000;
}

.smallLabel{
    font-size:10px;
    color:#888;
    padding-left:3px;
}

/* =====================================================
   TIMELINE BODY
===================================================== */

#timelineBody{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

/* LEFT PART LIST */

#trackList{
    width:180px;
    min-width:180px;
    background:#15171c;
    border-right:2px solid #292c31;
    overflow-y:auto;
    overflow-x:hidden;
}

.trackHeader{
    height:42px;
    display:flex;
    align-items:center;
    padding:0 9px;
    color:#aaa;
    font-size:11px;
    border-bottom:1px solid #292c31;
}

.trackRow{
    height:40px;
    display:flex;
    align-items:center;
    padding:0 7px;
    gap:6px;
    color:#bbb;
    border-bottom:1px solid #24272c;
    font-size:12px;
}

.trackRow.selected{
    background:#3b1111;
    color:#fff;
    border-left:3px solid #e00000;
    padding-left:4px;
}

.eye{
    width:22px;
    text-align:center;
    color:#888;
    cursor:pointer;
}

.trackName{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =====================================================
   TIMELINE SCROLL AREA
===================================================== */

#timelineScroll{
    flex:1;
    min-width:0;
    overflow:auto;
    position:relative;
    background:#0f1115;
}

#timelineContent{
    position:relative;
    min-width:900px;
    height:100%;
}

/* RULER */

#ruler{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:42px;
    background:#17191e;
    border-bottom:1px solid #34373d;
}

.tick{
    position:absolute;
    top:0;
    width:1px;
    height:42px;
    background:#363940;
}

.tick.major{
    background:#70747c;
}

.tickLabel{
    position:absolute;
    top:4px;
    transform:translateX(4px);
    color:#aeb1b7;
    font-size:10px;
    white-space:nowrap;
}

/* TRACKS */

#tracks{
    position:absolute;
    left:0;
    top:42px;
    width:100%;
}

.trackLane{
    position:relative;
    height:40px;
    border-bottom:1px solid #292c31;
}

.trackLane::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:
        repeating-linear-gradient(
            to right,
            rgba(255,255,255,.045) 0,
            rgba(255,255,255,.045) 1px,
            transparent 1px,
            transparent var(--minorTick)
        );
}

/* =====================================================
   PLAYHEAD
===================================================== */

#playhead{
    position:absolute;
    top:0;
    width:2px;
    height:100%;
    background:#ff2525;
    z-index:40;
    pointer-events:none;
}

#playheadHandle{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:12px solid #ff2525;
}

/* =====================================================
   KEYFRAMES
===================================================== */

.keyframe{
    position:absolute;
    top:50%;
    width:12px;
    height:12px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:#d7d7d7;
    border:2px solid #777;
    cursor:pointer;
    z-index:50;
}

.keyframe:hover{
    background:#fff;
}

.keyframe.selected{
    background:#ff2020;
    border-color:#fff;
    box-shadow:0 0 8px #e00000;
}

.keyframe.copied{
    outline:2px dashed #ff4444;
    outline-offset:3px;
}

/* =====================================================
   CONTEXT MENU
===================================================== */

#kfMenu{
    position:fixed;
    display:none;
    min-width:145px;
    background:#17181c;
    border:1px solid #555;
    z-index:500;
    box-shadow:0 8px 25px rgba(0,0,0,.7);
}

.menuTitle{
    padding:8px;
    font-size:11px;
    color:#888;
    border-bottom:1px solid #333;
}

.menuItem{
    padding:9px 10px;
    font-size:12px;
    color:#ddd;
    cursor:pointer;
}

.menuItem:hover{
    background:#8d0000;
    color:#fff;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    #topbar{
        height:48px;
        padding:4px;
        gap:3px;
    }

    .brand{
        font-size:12px;
        padding:0 4px;
    }

    .topBtn{
        height:32px;
        min-width:30px;
        padding:0 6px;
        font-size:10px;
    }

    #timeline{
        height:290px;
    }

    #trackList{
        width:125px;
        min-width:125px;
    }

    .trackRow{
        font-size:11px;
    }

    .trackHeader{
        font-size:10px;
    }

    #timelineControls{
        gap:3px;
        overflow-x:auto;
    }

    .tBtn{
        min-width:30px;
        padding:0 6px;
        font-size:10px;
    }

    #durationBox{
        width:58px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =================================================
         TOP BAR
    ================================================= -->

    <div id="topbar">

        <div class="brand">
            MIZAXENGINE
        </div>

        <button class="topBtn" id="newBtn">NEW</button>
        <button class="topBtn" id="undoBtn">UNDO</button>
        <button class="topBtn" id="redoBtn">REDO</button>

        <div class="spacer"></div>

        <button class="topBtn" id="copyBtn">COPY</button>
        <button class="topBtn" id="pasteBtn">PASTE</button>

    </div>


    <!-- =================================================
         3D VIEWPORT
    ================================================= -->

    <div id="viewport">

        <div id="canvasWrap"></div>

        <div id="viewportTools">

            <button class="vBtn active"
                    id="moveBtn">
                MOVE
            </button>

            <button class="vBtn"
                    id="rotateBtn">
                ROT
            </button>

            <button class="vBtn"
                    id="cameraBtn">
                CAM
            </button>

        </div>

    </div>


    <!-- =================================================
         TIMELINE
    ================================================= -->

    <div id="timeline">

        <div id="timelineResize"></div>

        <div id="timelineHeader">

            <div id="timelineControls">

                <button class="tBtn"
                        id="rewindBtn">
                    |◀
                </button>

                <button class="tBtn"
                        id="prevBtn">
                    ◀
                </button>

                <button class="tBtn playBtn"
                        id="playBtn">
                    ▶
                </button>

                <button class="tBtn"
                        id="nextBtn">
                    ▶|
                </button>

                <button class="tBtn"
                        id="loopBtn">
                    LOOP
                </button>

                <span class="smallLabel">
                    Duration
                </span>

                <input
                    id="durationBox"
                    type="number"
                    min="0.25"
                    max="60"
                    step="0.25"
                    value="2"
                >

                <button class="tBtn"
                        id="addKeyBtn">
                    + KF
                </button>

                <button class="tBtn"
                        id="zoomOutBtn">
                    −
                </button>

                <button class="tBtn"
                        id="zoomInBtn">
                    +
                </button>

            </div>

        </div>


        <div id="timelineBody">

            <div id="trackList">

                <div class="trackHeader">
                    RIG / PARTS
                </div>

            </div>


            <div id="timelineScroll">

                <div id="timelineContent">

                    <div id="ruler"></div>

                    <div id="tracks"></div>

                    <div id="playhead">
                        <div id="playheadHandle"></div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     KEYFRAME MENU
===================================================== -->

<div id="kfMenu">

    <div class="menuTitle">
        KEYFRAME
    </div>

    <div class="menuItem"
         id="deleteKF">
        Delete
    </div>

    <div class="menuItem"
         id="duplicateKF">
        Duplicate
    </div>

    <div class="menuItem"
         id="typeMove">
        Type: Move
    </div>

    <div class="menuItem"
         id="typeRotate">
        Type: Rotate
    </div>

    <div class="menuItem"
         id="typeScale">
        Type: Scale
    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let scene;
let camera;
let renderer;

let orbitControls;
let transformControls;

let rigRoot;

let selectedPart = null;

let playing = false;
let loop = true;

let currentTime = 0;
let duration = 2;

let zoom = 100;

let copiedKeyframe = null;

let selectedKeyframe = null;

let keyframes = [];

let longPressTimer = null;
let draggingKeyframe = null;

let timelineHeight = 310;

const parts = [
    "Torso",
    "Head",
    "Left Arm",
    "Right Arm",
    "Left Leg",
    "Right Leg"
];

const rig = {};

const viewport =
    document.getElementById("viewport");

const timeline =
    document.getElementById("timeline");

const timelineContent =
    document.getElementById("timelineContent");

const timelineScroll =
    document.getElementById("timelineScroll");

const ruler =
    document.getElementById("ruler");

const tracks =
    document.getElementById("tracks");

const trackList =
    document.getElementById("trackList");

const playhead =
    document.getElementById("playhead");

const kfMenu =
    document.getElementById("kfMenu");


/* =====================================================
   INIT
===================================================== */

function init(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x101010);


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            45,
            1,
            0.1,
            1000
        );


    camera.position.set(
        7,
        5,
        9
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.shadowMap.enabled = true;

    document
        .getElementById("canvasWrap")
        .appendChild(
            renderer.domElement
        );


    /* ORBIT */

    orbitControls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    orbitControls.enableDamping = true;

    orbitControls.dampingFactor = .07;

    orbitControls.minDistance = 3;

    orbitControls.maxDistance = 20;

    orbitControls.target.set(
        0,
        2.5,
        0
    );


    /* TRANSFORM */

    transformControls =
        new THREE.TransformControls(
            camera,
            renderer.domElement
        );

    transformControls.setMode(
        "translate"
    );

    transformControls.setSpace(
        "local"
    );

    transformControls.size =
        .8;

    scene.add(
        transformControls
    );


    transformControls.addEventListener(
        "dragging-changed",
        e => {

            orbitControls.enabled =
                !e.value;

        }
    );


    transformControls.addEventListener(
        "change",
        () => {

            if(selectedPart){

                updatePartPose();

            }

        }
    );


    /* LIGHT */

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            .75
        )
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            .9
        );

    light.position.set(
        5,
        10,
        7
    );

    light.castShadow = true;

    scene.add(light);


    /* BASEPLATE */

    const base =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                14,
                .2,
                14
            ),

            new THREE.MeshPhongMaterial({
                color:0x292929
            })

        );

    base.position.y =
        -0.1;

    base.receiveShadow = true;

    scene.add(base);


    /* GRID */

    const grid =
        new THREE.GridHelper(
            14,
            14,
            0x555555,
            0x292929
        );

    grid.position.y = 0;

    scene.add(grid);


    /* BUILD */

    buildRig();


    /* TIMELINE */

    buildTracks();

    buildRuler();

    updatePlayhead();


    /* UI */

    setupUI();


    /* RESIZE */

    window.addEventListener(
        "resize",
        resize
    );


    resize();

    animate();
}


/* =====================================================
   ROUNDED BOX
===================================================== */

function roundedBox(
    w,
    h,
    d,
    radius=.12
){

    const shape =
        new THREE.Shape();

    const x =
        -w / 2;

    const y =
        -h / 2;

    shape.moveTo(
        x + radius,
        y
    );

    shape.lineTo(
        x + w - radius,
        y
    );

    shape.quadraticCurveTo(
        x + w,
        y,
        x + w,
        y + radius
    );

    shape.lineTo(
        x + w,
        y + h - radius
    );

    shape.quadraticCurveTo(
        x + w,
        y + h,
        x + w - radius,
        y + h
    );

    shape.lineTo(
        x + radius,
        y + h
    );

    shape.quadraticCurveTo(
        x,
        y + h,
        x,
        y + h - radius
    );

    shape.lineTo(
        x,
        y + radius
    );

    shape.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    const geo =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth:d,
                bevelEnabled:true,
                bevelSegments:2,
                bevelSize:.07,
                bevelThickness:.07
            }
        );

    geo.center();

    return geo;
}


/* =====================================================
   RIG
===================================================== */

function buildRig(){

    rigRoot =
        new THREE.Group();

    rigRoot.name =
        "R6";

    scene.add(
        rigRoot
    );


    /* MATERIALS */

    const bodyMat =
        new THREE.MeshPhongMaterial({
            color:0xcccccc,
            shininess:15
        });

    const torsoMat =
        new THREE.MeshPhongMaterial({
            color:0x11bce8,
            shininess:15
        });

    const legMat =
        new THREE.MeshPhongMaterial({
            color:0xe5323c,
            shininess:15
        });


    /* TORSO */

    const torso =
        new THREE.Mesh(
            roundedBox(
                2,
                2,
                1,
                .12
            ),
            torsoMat
        );

    torso.name =
        "Torso";

    torso.position.y =
        3;

    torso.castShadow = true;

    torso.receiveShadow = true;

    rigRoot.add(
        torso
    );

    rig["Torso"] =
        torso;


    /* HEAD PIVOT */

    const headPivot =
        new THREE.Group();

    headPivot.name =
        "HeadPivot";

    headPivot.position.set(
        0,
        1,
        0
    );

    torso.add(
        headPivot
    );


    /* HEAD - SHARP */

    const head =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.85,
                1.3,
                1
            ),

            bodyMat

        );

    head.name =
        "Head";

    head.position.y =
        .65;

    head.castShadow = true;

    head.receiveShadow = true;

    headPivot.add(
        head
    );

    rig["Head"] =
        head;

    rig["HeadPivot"] =
        headPivot;


    /* FACE */

    const faceCanvas =
        document.createElement(
            "canvas"
        );

    faceCanvas.width = 256;

    faceCanvas.height = 128;

    const ctx =
        faceCanvas.getContext(
            "2d"
        );

    ctx.clearRect(
        0,
        0,
        256,
        128
    );

    ctx.fillStyle =
        "rgba(0,0,0,0)";

    ctx.clearRect(
        0,
        0,
        256,
        128
    );

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 72px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        ">v<",
        128,
        64
    );

    const faceTexture =
        new THREE.CanvasTexture(
            faceCanvas
        );

    faceTexture.encoding =
        THREE.sRGBEncoding;

    const faceMat =
        new THREE.MeshBasicMaterial({
            map:faceTexture,
            transparent:true,
            depthWrite:false
        });

    const face =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                1.5,
                .65
            ),
            faceMat
        );

    /*
       Turunkan posisi wajah.
       Tidak ada background kotak.
    */

    face.position.set(
        0,
        .28,
        .506
    );

    headPivot.add(
        face
    );


    /* ARMS */

    createLimb(
        "Left Arm",
        -1,
        1,
        bodyMat
    );

    createLimb(
        "Right Arm",
        1,
        1,
        bodyMat
    );


    /* LEGS */

    createLeg(
        "Left Leg",
        -.5,
        legMat
    );

    createLeg(
        "Right Leg",
        .5,
        legMat
    );


    selectPart(
        torso
    );
}


/* =====================================================
   ARM
===================================================== */

function createLimb(
    name,
    x,
    y,
    material
){

    const pivot =
        new THREE.Group();

    pivot.name =
        name.replace(
            " ",
            ""
        ) + "Pivot";

    pivot.position.set(
        x * 1.5,
        1,
        0
    );

    rig["Torso"].add(
        pivot
    );


    const mesh =
        new THREE.Mesh(

            roundedBox(
                1,
                2,
                1,
                .12
            ),

            material

        );

    mesh.name =
        name;

    mesh.position.y =
        -1;

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    pivot.add(
        mesh
    );

    rig[name] =
        mesh;

    rig[
        name.replace(
            " ",
            ""
        ) + "Pivot"
    ] =
        pivot;
}


/* =====================================================
   LEG
===================================================== */

function createLeg(
    name,
    x,
    material
){

    const pivot =
        new THREE.Group();

    pivot.name =
        name.replace(
            " ",
            ""
        ) + "Pivot";

    pivot.position.set(
        x,
        -1,
        0
    );

    rig["Torso"].add(
        pivot
    );


    const mesh =
        new THREE.Mesh(

            roundedBox(
                1,
                2,
                1,
                .12
            ),

            material

        );

    mesh.name =
        name;

    mesh.position.y =
        -1;

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    pivot.add(
        mesh
    );

    rig[name] =
        mesh;

    rig[
        name.replace(
            " ",
            ""
        ) + "Pivot"
    ] =
        pivot;
}


/* =====================================================
   GET PIVOT
===================================================== */

function getPivot(part){

    if(part === rig["Torso"])
        return part;

    if(part === rig["Head"])
        return rig["HeadPivot"];

    if(part === rig["Left Arm"])
        return rig["LeftArmPivot"];

    if(part === rig["Right Arm"])
        return rig["RightArmPivot"];

    if(part === rig["Left Leg"])
        return rig["LeftLegPivot"];

    if(part === rig["Right Leg"])
        return rig["RightLegPivot"];

    return part;
}


/* =====================================================
   SELECT PART
===================================================== */

function selectPart(part){

    selectedPart =
        part;

    const target =
        getPivot(part);

    transformControls.attach(
        target
    );

    document
        .querySelectorAll(
            ".trackRow"
        )
        .forEach(row => {

            row.classList.toggle(
                "selected",
                row.dataset.part ===
                part.name
            );

        });
}

   TIMELINE TRACKS
===================================================== */

function buildTracks(){

/* =====================================================
   RULER
===================================================== */

function buildRuler(){

    ruler.innerHTML = "";

    /*
       Cada 0.05 detik = satu garis kecil.
       Setiap 0.25 detik = garis besar.
    */

    const step =
        0.05;

    const pxPerSecond =
        zoom;

    const total =
        Math.ceil(
            duration / step
        );

    timelineContent.style.width =
        Math.max(
            900,
            duration *
            pxPerSecond +
            200
        ) + "px";

    for(
        let i=0;
        i<=total;
        i++
    ){

        const time =
            i * step;

        if(time > duration)
            break;

        const x =
            time *
            pxPerSecond;

        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick" +
            (
                i % 5 === 0
                ? " major"
                : ""
            );

        tick.style.left =
            x + "px";

        ruler.appendChild(
            tick
        );


        if(i % 5 === 0){

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "tickLabel";

            label.style.left =
                x + "px";

            label.textContent =
                time.toFixed(2);

            ruler.appendChild(
                label
            );
        }
    }


    timelineContent.style.setProperty(
        "--minorTick",
        (step * pxPerSecond) +
        "px"
    );
}


/* =====================================================
   SNAP
===================================================== */

function snapTime(time){

    const step =
        .05;

    time =
        Math.max(
            0,
            Math.min(
                duration,
                time
            )
        );

    return Math.round(
        time / step
    ) * step;
}


/* =====================================================
   KEYFRAME POSITION
===================================================== */

function timeToX(time){

    return time * zoom;
}


/* =====================================================
   ADD KEYFRAME
===================================================== */

function addKeyframe(
    partName,
    time=currentTime,
    type="Move"
){

    time =
        snapTime(time);

    const existing =
        keyframes.find(
            k =>
                k.part === partName &&
                Math.abs(
                    k.time-time
                ) < .001
        );

    if(existing){

        selectedKeyframe =
            existing;

        renderKeyframes();

        return;
    }


    const pivot =
        getPivot(
            rig[partName]
        );


    const kf = {

        id:
            Date.now() +
            Math.random(),

        part:
            partName,

        time:
            time,

        type:
            type,

        position:
            pivot.position.clone(),

        quaternion:
            pivot.quaternion.clone(),

        scale:
            pivot.scale.clone()

    };


    keyframes.push(
        kf
    );

    selectedKeyframe =
        kf;

    renderKeyframes();
}


/* =====================================================
   RENDER KEYFRAMES
===================================================== */

function renderKeyframes(){

    document
        .querySelectorAll(
            ".keyframe"
        )
        .forEach(
            e => e.remove()
        );


    keyframes.forEach(
        kf => {

            const lane =
                document.querySelector(
                    `.trackLane[data-part="${kf.part}"]`
                );

            if(!lane)
                return;


            const el =
                document.createElement(
                    "div"
                );

            el.className =
                "keyframe";


            if(
                selectedKeyframe &&
                selectedKeyframe.id ===
                kf.id
            ){

                el.classList.add(
                    "selected"
                );

            }


            el.style.left =
                timeToX(
                    kf.time
                ) + "px";


            el.title =
                `${kf.part} • ${kf.time.toFixed(2)} • ${kf.type}`;


            /* NORMAL TAP */

            el.addEventListener(
                "pointerdown",
                e => {

                    e.stopPropagation();

                    longPressTimer =
                        setTimeout(
                            () => {

                                selectedKeyframe =
                                    kf;

                                showKFMenu(
                                    e.clientX,
                                    e.clientY,
                                    kf
                                );

                            },
                            550
                        );


                    draggingKeyframe =
                        kf;

                    el.setPointerCapture(
                        e.pointerId
                    );

                }
            );


            el.addEventListener(
                "pointerup",
                e => {

                    clearTimeout(
                        longPressTimer
                    );

                    if(
                        draggingKeyframe ===
                        kf
                    ){

                        selectedKeyframe =
                            kf;

                        renderKeyframes();

                    }

                    draggingKeyframe =
                        null;

                }
            );


            el.addEventListener(
                "pointermove",
                e => {

                    if(
                        draggingKeyframe !==
                        kf
                    )
                        return;

                    clearTimeout(
                        longPressTimer
                    );

                    /*
                       Geser keyframe.
                       Timeline TIDAK ikut bergerak.
                    */

                    const rect =
                        timelineContent
                            .getBoundingClientRect();

                    let x =
                        e.clientX -
                        rect.left;

                    kf.time =
                        snapTime(
                            x / zoom
                        );

                    renderKeyframes();

                    updatePlayhead();

                }
            );


            lane.appendChild(
                el
            );
        }
    );
}

===================================================== */

/* =====================================================
   ANIMATION
===================================================== */

let lastTime =
    performance.now();

function animationTick(){

    const now =
        performance.now();

    const dt =
        (now-lastTime)/1000;

    lastTime =
        now;

    if(playing){

        currentTime +=
            dt;

        if(
            currentTime >=
            duration
        ){

            if(loop){

                currentTime =
                    0;

            }else{

                currentTime =
                    duration;

                playing =
                    false;

                document.getElementById(
                    "playBtn"
                ).textContent =
                    "▶";

            }
        }

        applyAnimation(
            currentTime
        );

        updatePlayhead();
    }
}


/* =====================================================
   APPLY ANIMATION
===================================================== */

function applyAnimation(time){

    parts.forEach(
        partName => {

            const list =
                keyframes
                    .filter(
                        k =>
                            k.part ===
                            partName
                    )
                    .sort(
                        (a,b) =>
                            a.time-b.time
                    );

            if(!list.length)
                return;


            let before =
                null;

            let after =
                null;

            for(
                const k of list
            ){

                if(
                    k.time <=
                    time
                )
                    before = k;

                if(
                    k.time >=
                    time
                ){

                    after = k;

                    break;

                }
            }


            const pivot =
                getPivot(
                    rig[partName]
                );


            if(
                before &&
                after &&
                before !== after
            ){

                const range =
                    after.time -
                    before.time;

                const t =
                    range === 0
                    ? 0
                    : (
                        time -
                        before.time
                    ) / range;


                pivot.position.lerpVectors(
                    before.position,
                    after.position,
                    t
                );


                THREE.Quaternion
                    .slerp(
                        before.quaternion,
                        after.quaternion,
                        pivot.quaternion,
                        t
                    );


                pivot.scale.lerpVectors(
                    before.scale,
                    after.scale,
                    t
                );

            }

            else if(before){

                pivot.position.copy(
                    before.position
                );

                pivot.quaternion.copy(
                    before.quaternion
                );

                pivot.scale.copy(
                    before.scale
                );

            }

            else if(after){

                pivot.position.copy(
                    after.position
                );

                pivot.quaternion.copy(
                    after.quaternion
                );

                pivot.scale.copy(
                    after.scale
                );
            }
        }
    );
}

function updatePartPose(){

    /*

/* =====================================================
   DURATION
===================================================== */

document.getElementById(
    "durationBox"
).addEventListener(
    "change",
    e => {

        let value =
            parseFloat(
                e.target.value
            );

        if(
            !Number.isFinite(value)
        )
            value = 2;

        value =
            Math.max(
                .25,
                Math.min(
                    60,
                    value
                )
            );

        duration =
            value;

        if(
            currentTime >
            duration
        )
            currentTime =
                duration;

        buildRuler();

        renderKeyframes();

        updatePlayhead();
    }
);

   ZOOM

            zoom + 25

    buildRuler();

    renderKeyframes();

};


document.getElementById(
    "zoomOutBtn"
).onclick = () => {

        Math.max(

            zoom - 25

/* =====================================================
   TIMELINE RESIZE
===================================================== */

const resizeHandle =
    document.getElementById(
        "timelineResize"
    );

let resizingTimeline =
    false;

let resizeStartY =
    0;

let resizeStartHeight =
    0;


resizeHandle.addEventListener(
    "pointerdown",
    e => {

        resizingTimeline =
            true;

        resizeStartY =
            e.clientY;

        resizeStartHeight =
            timeline.offsetHeight;

        resizeHandle.setPointerCapture(
            e.pointerId
        );

        e.preventDefault();
    }
);


resizeHandle.addEventListener(
    "pointermove",
    e => {

        if(
            !resizingTimeline
        )
            return;

        const delta =
            resizeStartY -
            e.clientY;

        timelineHeight =
            Math.max(
                0,
                Math.min(
                    window.innerHeight -
                    100,
                    resizeStartHeight +
                    delta
                )
            );

        timeline.style.height =
            timelineHeight + "px";

        resize();

    }
);


resizeHandle.addEventListener(
    "pointerup",
    () => {

        resizingTimeline =
            false;

    }
);

/* =====================================================
   RESET
===================================================== */

function resetRig(){

    parts.forEach(
        name => {

            const p =
                getPivot(
                    rig[name]
                );

            p.rotation.set(
                0,
                0,
                0
            );

            p.scale.set(
                1,
                1,
                1
            );

        }
    );


    rig["Torso"].position.set(
        0,
        3,
        0
    );


    rig["HeadPivot"].position.set(
        0,
        1,
        0
    );

    rig["LeftArmPivot"].position.set(
        -1.5,
        1,
        0
    );

    rig["RightArmPivot"].position.set(
        1.5,
        1,
        0
    );

    rig["LeftLegPivot"].position.set(
        -.5,
        -1,
        0
    );

    rig["RightLegPivot"].position.set(
        .5,
        -1,
        0
    );
}


/* =====================================================
   UNDO / REDO
===================================================== */

    "undoBtn"
).onclick = () => {

        keyframes.pop();

        renderKeyframes();

};

    "redoBtn"
).onclick = () => {

};


/* =====================================================
   RESIZE VIEWPORT
===================================================== */

function resize(){

    const w =
        viewport.clientWidth;

    const h =
        viewport.clientHeight;

    if(
        w <= 0 ||
        h <= 0
    )
        return;

    camera.aspect =
        w / h;

    camera.updateProjectionMatrix();

    renderer.setSize(
        w,
        h,
        false
    );
}


/* =====================================================
   RENDER
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    animationTick();

    orbitControls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   START
===================================================== */

window.onload =
    init;
